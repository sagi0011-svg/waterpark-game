<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b84d6">
<title>ספלאש בלאגן — סימולציית פארק מים</title>
<style>
:root{
  --sky1:#7bdcff;
  --sky2:#0b84d6;
  --bg:var(--sky2);
  --bg2:#f4fbfe;
  --card:#ffffff;
  --card2:#eaf6fb;
  --border:#d3ecf5;
  --text:#0a324c;
  --dim:#5c7a8c;
  --dim2:#93aebc;
  --accent:#00bfb3;
  --accent2:#00969c;
  --good:#16a34a;
  --bad:#d9362b;
  --warn:#c9790a;
  --gold:#b8790a;
  --coral:#ff6b4a;
  --coral2:#ff5252;
  --pink:#ec4fa0;
  --leaf:#3fb950;
  --violet:#9b6bff;
  --slate:#3d5a72;
  --radius:20px;
  --radius-sm:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--sky2);color:var(--text);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Assistant,Arial,sans-serif;
  overscroll-behavior-y:none;
  touch-action:manipulation;
  min-height:100vh;
  min-height:100dvh;
}
button{font-family:inherit;}
::selection{background:var(--accent);color:#fff;}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 460px,#075c87 1400px);
}

/* ---------- generic bits ---------- */
.screen{display:flex;flex-direction:column;flex:1;padding-bottom:calc(24px + var(--safe-bottom));animation:fadein .25s ease;position:relative;}
.scene-host{position:relative;overflow:hidden;}
.scene-backdrop{position:absolute;left:0;right:0;bottom:0;height:min(50vh,380px);z-index:0;}
.scene-backdrop svg{width:100%;height:100%;display:block;}
.scene-backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,132,214,0) 0%,rgba(6,60,92,.45) 55%,rgba(3,26,40,.82) 100%);}
.scene-content{position:relative;z-index:1;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.px{padding-left:16px;padding-right:16px;}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
}
.muted{color:var(--dim);}
.small{font-size:12.5px;}
.center{text-align:center;}
.row{display:flex;align-items:center;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.gap8{gap:8px;}
.gap12{gap:12px;}
.stack{display:flex;flex-direction:column;}
.spacer{flex:1;}
h1,h2,h3,p{margin:0;}
.hidden{display:none !important;}

/* buttons */
.btn{
  border:none;border-radius:999px;
  padding:15px 20px;
  font-size:15.5px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;
  transition:transform .08s ease, opacity .15s ease, filter .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--coral),var(--coral2));color:#fff;box-shadow:0 6px 16px rgba(255,82,82,.35);}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(0,150,156,.3);}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn-good{background:linear-gradient(135deg,#4ade80,#22c55e);color:#052e14;}
.btn-bad{background:linear-gradient(135deg,#fb7185,#ef4444);color:#3a0303;}
.btn-block{width:100%;}
.btn-lg{padding:18px 22px;font-size:17px;border-radius:22px;}
.btn:disabled{opacity:.4;filter:grayscale(.3);cursor:not-allowed;transform:none;box-shadow:none;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:999px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text);cursor:pointer;
  box-shadow:0 2px 8px rgba(8,48,74,.12);
}

/* badges */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:var(--card2);border:1px solid var(--border);color:var(--text);
}
.badge-good{background:rgba(22,163,74,.12);color:var(--good);border-color:rgba(22,163,74,.3);}
.badge-bad{background:rgba(217,54,43,.1);color:var(--bad);border-color:rgba(217,54,43,.28);}
.badge-warn{background:rgba(201,121,10,.12);color:var(--warn);border-color:rgba(201,121,10,.3);}
.badge-gold{background:rgba(184,121,10,.12);color:var(--gold);border-color:rgba(184,121,10,.3);}

/* progress dots (wizard) */
.progress-dots{display:flex;gap:6px;justify-content:center;padding:14px 0 4px;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s;}
.dot.active{background:#fff;width:22px;border-radius:5px;}
.dot.done{background:rgba(255,255,255,.6);}

/* top bar */
.topbar{
  position:sticky;top:0;z-index:20;
  padding:calc(10px + var(--safe-top)) 16px 10px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.park-id{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}

/* hero seasonal card */
.hero{
  margin:12px 16px 0;
  border-radius:24px;
  padding:0;
  position:relative;overflow:hidden;
  border:1px solid var(--border);
  min-height:150px;
  display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:0 10px 28px rgba(6,40,62,.22);
}
.hero-scene{position:absolute;inset:0;transition:filter .4s ease;}
.hero-scene svg{width:100%;height:100%;display:block;}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:75%;background:linear-gradient(0deg,rgba(3,26,40,.8),rgba(3,26,40,0));pointer-events:none;}
.hero .hero-emoji{position:absolute;top:14px;left:16px;font-size:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));z-index:2;background:rgba(255,255,255,.25);backdrop-filter:blur(4px);border-radius:14px;padding:4px 8px;}
.hero .hero-content{position:relative;z-index:2;padding:18px 18px 16px;color:#fff;}
.hero .hero-month{font-size:20px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.4);}
.hero .hero-sub{font-size:12.5px;opacity:.92;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.35);}
.hero-scene.season-winter{filter:saturate(.45) brightness(.78) hue-rotate(15deg);}
.hero-scene.season-spring{filter:saturate(1.05) brightness(1.02);}
.hero-scene.season-summer{filter:saturate(1.3) brightness(1.08) hue-rotate(-6deg);}
.hero-scene.season-autumn{filter:saturate(.8) brightness(.9) sepia(.15) hue-rotate(8deg);}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 16px 0;}
.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:12px 8px;text-align:center;
  box-shadow:0 3px 10px rgba(8,48,74,.08);
}
.kpi .kpi-label{font-size:11px;color:var(--dim);margin-bottom:4px;}
.kpi .kpi-value{font-size:16.5px;font-weight:800;}
.kpi .kpi-delta{font-size:11px;margin-top:3px;font-weight:700;}

/* action grid */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 16px 0;}
.action-card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:16px 12px;text-align:center;cursor:pointer;transition:.1s;
  box-shadow:0 3px 10px rgba(8,48,74,.08);
}
.action-card:active{transform:scale(.96);background:var(--card2);}
.action-card .ac-emoji{font-size:26px;display:block;margin-bottom:6px;}
.action-card .ac-label{font-weight:700;font-size:13.5px;}

/* sticky bottom CTA */
.sticky-cta{
  position:sticky;bottom:0;z-index:20;
  padding:12px 16px calc(12px + var(--safe-bottom));
  background:linear-gradient(0deg,var(--sky2) 55%,transparent);
  margin-top:auto;
}

/* list section */
.section-title{font-size:13px;font-weight:800;color:rgba(255,255,255,.9);margin:18px 16px 8px;letter-spacing:.02em;text-shadow:0 1px 4px rgba(0,0,0,.2);}

/* warning banner */
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;}
.banner-bad{background:#fff0ee;border:1px solid rgba(217,54,43,.3);color:var(--bad);}
.banner-warn{background:#fff8ea;border:1px solid rgba(201,121,10,.3);color:var(--warn);}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;
  background:var(--card);border:1px solid var(--border);color:var(--dim);cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 6px rgba(8,48,74,.08);
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.tab.active.tab-facility{background:var(--accent);border-color:var(--accent);}
.tab.active.tab-food{background:var(--coral);border-color:var(--coral);}
.tab.active.tab-seating{background:var(--violet);border-color:var(--violet);}
.tab.active.tab-expansion{background:var(--leaf);border-color:var(--leaf);}
.tab.active.tab-marketing{background:var(--pink);border-color:var(--pink);}
.tab.active.tab-security{background:var(--slate);border-color:var(--slate);}

.side-panel{display:flex;gap:8px;margin:8px 16px 6px;}
.side-stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 10px;text-align:center;box-shadow:0 2px 8px rgba(8,48,74,.08);}
.side-stat .ss-label{font-size:10px;color:var(--dim);}
.side-stat .ss-value{font-size:13.5px;font-weight:800;margin-top:2px;}

.item-list{display:flex;flex-direction:column;gap:10px;padding:8px 16px 10px;}
.item-card{background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--border);border-radius:18px;padding:14px;box-shadow:0 3px 10px rgba(8,48,74,.08);}
.item-card.building{border-color:rgba(201,121,10,.4);border-inline-start-color:var(--warn);}
.item-card.disabled{opacity:.55;}
.item-title{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;}
.item-meta{font-size:12px;color:var(--dim);margin-top:4px;}
.item-actions{display:flex;gap:8px;margin-top:10px;}
.progress-bar{height:8px;border-radius:5px;background:var(--border);overflow:hidden;margin-top:8px;}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;transition:width .3s;}

/* overlay / bottom sheet */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadein2 .2s ease;
}
@keyframes fadein2{from{opacity:0;}to{opacity:1;}}
.sheet{
  width:100%;max-width:520px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:26px 26px 0 0;
  padding:10px 18px calc(20px + var(--safe-bottom));
  max-height:88vh;overflow-y:auto;
  animation:slideup .25s cubic-bezier(.2,.9,.3,1);
  color:var(--text);
}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 14px;}
.event-emoji{font-size:44px;text-align:center;display:block;margin-bottom:6px;}
.event-headline{font-size:18px;font-weight:800;text-align:center;line-height:1.35;}
.event-desc{font-size:13.5px;color:var(--dim);text-align:center;margin-top:8px;line-height:1.5;}
.event-effects{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.event-choices{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

/* news card */
.news-card{background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(8,48,74,.06);}
.news-card.bad{border-inline-start-color:var(--bad);}
.news-card.good{border-inline-start-color:var(--good);}
.news-title{font-weight:800;font-size:13.5px;}
.news-sub{font-size:12px;color:var(--dim);margin-top:3px;}

/* finance breakdown */
.finance-row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
.finance-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:9px;font-weight:800;font-size:15px;}

/* ---- ticket price control ---- */
.price-card{margin:0 16px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;box-shadow:0 4px 14px rgba(3,26,40,.10);}
.price-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.price-head .lbl{font-size:13px;font-weight:700;color:var(--dim);}
.price-value{font-size:26px;font-weight:900;color:var(--accent2);font-variant-numeric:tabular-nums;}
.price-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.price-step{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:20px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.price-step:active{transform:scale(.94);}
.price-step:disabled{opacity:.35;cursor:default;}
.price-slider{flex:1 1 auto;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--leaf),var(--warn),var(--bad));outline:none;}
.price-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;
  border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;
  box-shadow:0 2px 8px rgba(3,26,40,.28);}
.price-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;
  border:3px solid var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(3,26,40,.28);}
.price-slider:focus-visible{box-shadow:0 0 0 3px rgba(0,191,179,.4);}
.price-hint{margin-top:9px;font-size:12.5px;color:var(--dim);line-height:1.5;}
.price-hint b{color:var(--text);}
.price-tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:800;}
.price-tag.cheap{background:rgba(63,185,80,.15);color:var(--good);}
.price-tag.fair{background:rgba(0,191,179,.15);color:var(--accent2);}
.price-tag.steep{background:rgba(217,54,43,.13);color:var(--bad);}
@media (prefers-reduced-motion:reduce){.price-step:active{transform:none;}}

/* history table */
.hist-row{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.hist-row:last-child{border-bottom:none;}

/* toggle switch style card for wizard options */
.opt-card{
  background:var(--card);border:2px solid var(--border);border-radius:18px;
  padding:14px 16px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:12px;
  box-shadow:0 3px 10px rgba(8,48,74,.08);
}
.opt-card.selected{border-color:var(--accent);background:rgba(0,191,179,.08);}
.opt-emoji{font-size:26px;}
.opt-title{font-weight:800;font-size:14.5px;}
.opt-sub{font-size:12px;color:var(--dim);margin-top:2px;}

input[type=text],input[type=number]{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;color:var(--text);font-size:16px;outline:none;
}
input[type=text]:focus,input[type=number]:focus{border-color:var(--accent);}

.logo-hero{font-size:56px;text-align:center;margin-bottom:6px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
.title-xl{font-size:24px;font-weight:900;text-align:center;line-height:1.3;color:#fff;text-shadow:0 2px 10px rgba(3,26,40,.35);}
.subtitle{font-size:14px;color:rgba(255,255,255,.88);text-align:center;margin-top:6px;line-height:1.5;text-shadow:0 1px 6px rgba(3,26,40,.3);}
.title-xl.on-card{color:var(--text);text-shadow:none;}
.subtitle.on-card{color:var(--dim);text-shadow:none;}

.sparkline{width:100%;height:60px;margin-top:6px;}

.toast{
  position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  background:var(--text);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  animation:toastin .2s ease, toastout .3s ease 1.8s forwards;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,10px);}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* =========================================================
   CONFIG — all tables from the design doc
   ========================================================= */
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const MONTH_EMOJI = ["❄️","☔","🌱","🌸","🌤️","🌞","🔥","🔥","🍎","🎉","🍂","🌧️"];
const SEASON_MULT = [0.1,0.1,0.3,1.2,0.8,1.5,3.0,3.2,1.3,1.4,0.2,0.1];

function seasonClass(mIdx){ // 0-based month index
  if([5,6,7].includes(mIdx)) return "season-summer";
  if([2,3,4].includes(mIdx)) return "season-spring";
  if([8,9].includes(mIdx)) return "season-autumn";
  return "season-winter";
}

/* illustrated water-park scene, reused as hero art + screen backdrops.
   season variety comes from a CSS filter on the wrapper, not separate art. */
const SCENE_SVG = `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe0ff"/>
      <stop offset="1" stop-color="#2196d8"/>
    </linearGradient>
    <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c2c7"/>
      <stop offset="1" stop-color="#00838f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="400" height="220" fill="url(#skyG)"/>
  <circle cx="335" cy="42" r="46" fill="#ffd54a" opacity=".28"/>
  <circle cx="335" cy="42" r="26" fill="#ffca3c"/>
  <ellipse cx="70" cy="38" rx="34" ry="13" fill="#fff" opacity=".85"/>
  <ellipse cx="105" cy="46" rx="26" ry="10" fill="#fff" opacity=".75"/>
  <ellipse cx="220" cy="26" rx="28" ry="10" fill="#fff" opacity=".7"/>
  <path d="M46,190 C42,150 52,110 62,86" stroke="#8b5a2b" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g fill="#3fb950">
    <path d="M62,86 C40,70 18,74 6,92 C30,88 48,92 62,86 Z"/>
    <path d="M62,86 C48,62 54,40 74,28 C64,52 62,70 62,86 Z"/>
    <path d="M62,86 C82,66 106,66 122,80 C98,80 78,82 62,86 Z"/>
    <path d="M62,86 C70,60 92,48 116,50 C94,58 78,70 62,86 Z"/>
  </g>
  <rect x="300" y="60" width="14" height="70" fill="#e8e8e8"/>
  <path d="M307,60 C270,78 258,104 288,122 C312,136 292,156 258,168" stroke="#fff" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M307,60 C270,78 258,104 288,122 C312,136 292,156 258,168" stroke="#ff6b4a" stroke-width="20" fill="none" stroke-linecap="round" stroke-dasharray="4 22"/>

   ECON — the economic model.
   Demand comes from a limited MARKET (stars, attractions,
   word of mouth), not from capacity. Capacity only caps it.
   --------------------------------------------------------- */
const ECON = {
  // ticket pricing
  ticketMin:15, ticketMax:60, ticketDefault:32,
  ticketRef:35,          // price at which demand factor == 1
  elasticity:1.25,       // >1 ⇒ raising price loses more heads than it gains ₪

  // market size (visitors per day at seasonMult 1, sat 100)
  marketBase:50,         // people who'd come to any pool
  marketPerStar:125,     // reputation is the main growth engine
  womCap:90,             // word-of-mouth ceiling
  womDiv:260,            // √cumulativeVisitors / womDiv × womCap
  appealScale:2.6,       // headline attractions widen the market

  // payroll — scales with capacity, throttled by season
  lifeguardPer:70,   lifeguardCost:16000,
  staffPer:55,       staffCost:12500,
  staffFloor:0.35,   staffPeak:1.5,   // winter skeleton crew … full crew at seasonMult ≥1.5

  // fixed overhead
  arnonaPerCapacity:85,
  adminBase:9000,
  insuranceBase:8000, insurancePerRisk:6000,
  insuranceSpikeMult:1.6, insuranceSpikeMonths:12,

  // satisfaction equilibrium (NOT 100 — a park earns its stars)
  satBase:50,
};

function fmtMoney(n){
  const neg = n<0; n = Math.round(Math.abs(n));
  return (neg?"-":"") + "₪" + n.toLocaleString("he-IL");
}
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function rand(min,max){ return Math.random()*(max-min)+min; }
function randi(min,max){ return Math.round(rand(min,max)); }
function chance(p){ return Math.random() < p; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function stars(n){ return "⭐".repeat(clamp(n,1,5)); }
function ratingFromSatisfaction(s){
  if(s<=20) return 1;
  if(s<=40) return 2;
  if(s<=60) return 3;
  if(s<=80) return 4;
  return 5;
}
function ratingDesc(n){

}
function defOf(defId){
  return FACILITIES.find(f=>f.id===defId) || FOOD.find(f=>f.id===defId) || SEATING.find(f=>f.id===defId) || EXPANSION.find(f=>f.id===defId);

/* ---------- ECONOMY ---------- */
function appealTotal(){
  return G.built.filter(b=>b.status==="active")
                .reduce((s,b)=>s+(defOf(b.defId).appeal||0),0);
}
function wordOfMouth(){
  return Math.min(ECON.womCap, Math.sqrt(G.cumulativeVisitors)/ECON.womDiv*ECON.womCap);
}
// How many people WANT to come per day, before capacity is applied.
function marketPerDay(monthIdx){
  const base = ECON.marketBase
             + G.rating*ECON.marketPerStar
             + wordOfMouth()
             + appealTotal()*ECON.appealScale;
  const ads = G.campaigns.reduce((s,c)=>s+c.boost,0);
  return base * SEASON_MULT[monthIdx] * (1+ads) * (G.satisfaction/100) * priceFactor();
}
// Demand response to ticket price. >1 below the reference price, <1 above it.
function priceFactor(){
  return Math.pow(ECON.ticketRef/(G.ticketPrice||ECON.ticketDefault), ECON.elasticity);
}
function staffingLoad(monthIdx){
  return clamp(SEASON_MULT[monthIdx]/ECON.staffPeak, ECON.staffFloor, 1);
}
function staffCounts(){
  const cap = capacityTotal();
  if(cap<=0) return {lifeguards:0, staff:0};
  return {
    lifeguards: Math.ceil(cap/ECON.lifeguardPer),
    staff:      Math.ceil(cap/ECON.staffPer),
  };
}
function payrollFor(monthIdx){
  const {lifeguards, staff} = staffCounts();
  const full = lifeguards*ECON.lifeguardCost + staff*ECON.staffCost;
  return Math.round(full * staffingLoad(monthIdx));
}
function riskyCount(){
  return G.built.filter(b=>b.status==="active" && (defOf(b.defId).isSlide||defOf(b.defId).riskMult)).length;
}
function insuranceMonthly(){
  let p = ECON.insuranceBase + riskyCount()*ECON.insurancePerRisk;
  if(G.turn < (G.insuranceSpikeUntil||0)) p *= ECON.insuranceSpikeMult;
  return Math.round(p);
}
function bumpInsurance(){
  G.insuranceSpikeUntil = Math.max(G.insuranceSpikeUntil||0, G.turn + ECON.insuranceSpikeMonths);
}
function arnonaMonthly(){ return Math.round(capacityTotal()*ECON.arnonaPerCapacity); }
// Every recurring cost except maintenance and the security packages.
function overheadBreakdown(monthIdx){
  const opex = DIFFICULTY[G.difficulty].opexMult||1;
  return {
    payroll:   Math.round(payrollFor(monthIdx)*opex),
    arnona:    Math.round(arnonaMonthly()*opex),
    admin:     Math.round(ECON.adminBase*opex),
    insurance: Math.round(insuranceMonthly()*opex),
  };
}
function toast(msg){
  const el = document.createElement("div");
  el.className="toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

function worstNeglectFactor(){
  if(G.difficulty!=="hard") return 1;
  let worst = 1;
  G.built.forEach(b=>{
    if(b.status!=="active") return;
    const d = defOf(b.defId);
    const mult = (d.riskMult||1) * (b.monthsSinceMaint>6 ? 1.8 : (b.monthsSinceMaint>3?1.3:1));
    if(mult>worst) worst = mult;
  });
  return worst;
}

/* =========================================================
   MONTH RESOLUTION
   ========================================================= */
function resolveMonth(){
  const diff = DIFFICULTY[G.difficulty];
  const news = [];
  G._satDelta = 0;

  // --- tick constructions ---
  G.built.forEach(b=>{
    if(b.status==="building"){
      b.weeksLeft = Math.max(0, b.weeksLeft-4);
      if(b.weeksLeft<=0){
        b.status="active"; b.monthsSinceMaint=0; b.builtAtTurn=G.turn;
        news.push({type:"good", title:`${defOf(b.defId).emoji} ${defOf(b.defId).name} נפתח לקהל הרחב!`, sub:"עוד סיבה לבוא."});
        G.justUpgradedThisTurn = true;
      }
    } else if(b.status==="closed"){
      if(b.closedWeeksLeft!=null){
        b.closedWeeksLeft = Math.max(0,b.closedWeeksLeft-4);
        if(b.closedWeeksLeft<=0){ b.status="active"; b.monthsSinceMaint=0; news.push({type:"good", title:`${defOf(b.defId).emoji} ${defOf(b.defId).name} חזר לפעילות`, sub:"התיקון הושלם."}); }
      }
    }
    if(b.status==="active"){ b.monthsSinceMaint = (b.monthsSinceMaint||0)+1; }
  });

  // --- tick campaigns ---
  G.campaigns = G.campaigns.filter(c=>{ c.weeksLeft -= 4; return c.weeksLeft>0; });

  // --- market & demand ---
  // Demand is set by the MARKET (stars, attractions, word of mouth, price).
  // Capacity no longer creates customers — it only limits how many you can serve.
  const capacity = capacityTotal();
  const demandPerDay = marketPerDay(G.monthIdx);
  const visitorsPerDay = capacity>0 ? Math.min(demandPerDay, capacity) : 0;
  const crowding = capacity>0 ? demandPerDay/capacity : 0;
  const turnedAway = Math.round(Math.max(0, demandPerDay-capacity) * 30);
  const visitorsMonth = Math.round(visitorsPerDay * 30);
  const prevVisitors = G.lastVisitors;

  // --- income ---
  const ticketIncome = Math.round(visitorsMonth * G.ticketPrice);
  let foodSpend = 0;
  activeBuilt("food").forEach(b=>{
    const d = defOf(b.defId);
    let s = d.spend;
    if(d.summerBoost && [5,6,7].includes(G.monthIdx)) s *= d.summerBoost;
    foodSpend += s;
  });
  const foodIncome = Math.round(visitorsMonth * foodSpend);
  const vipCount = G.built.filter(b=>b.status==="active" && defOf(b.defId).vip).length;
  const vipIncome = Math.round(visitorsMonth * 0.04 * vipCount * 45);
  let income = ticketIncome + foodIncome + vipIncome;

  // --- expenses: maintenance ---
  let maintenance = 0;
  if(diff.maintOn){
    G.built.forEach(b=>{
      if(b.status!=="active") return;
      const d = defOf(b.defId);
      let m = d.maint||0;
      if(diff.neglect && b.monthsSinceMaint>6) m *= 1.5;
      maintenance += m;
    });
    maintenance = Math.round(maintenance * (diff.opexMult||1));
  }
  let securityMonthly = 0;
  SECURITY.forEach(s=>{ if(G.security[s.id]) securityMonthly += s.monthly; });
  // payroll, arnona, admin, insurance — the costs that don't care if anyone shows up
  const oh = overheadBreakdown(G.monthIdx);
  const overhead = oh.payroll + oh.arnona + oh.admin + oh.insurance;
  let expenses = maintenance + securityMonthly + overhead;

  // --- random events ---
  const pool = buildEventPool();
  let redCandidates = pool.RED.filter(e=>e.chance>0);
  let greenCandidates = pool.GREEN.filter(e=>e.chance>0);
  if(diff.lightOnly) redCandidates = redCandidates.filter(e=>e.light);
  redCandidates = redCandidates.map(e=>({...e, chance:e.chance*diff.freqMult}));

  const triggered = [];
  function rollFrom(list){
    for(const e of list){ if(chance(e.chance)) return e; }
    return null;
  }
  const r1 = rollFrom(shuffled(redCandidates));
  const g1 = rollFrom(shuffled(greenCandidates));
  if(r1) triggered.push(r1);
  if(g1) triggered.push(g1);
  if(diff.doubleChance && chance(diff.doubleChance)){
    const extra = rollFrom(shuffled(redCandidates.filter(e=>!triggered.includes(e))));
    if(extra) triggered.push(extra);
  }

  triggered.forEach(e=>{
    const result = e.apply();
    news.push({type:e.name && pool.GREEN.includes(e)?"good":"bad", title:`${e.emoji} ${e.name}`, sub: result, headline:e.headline});
  });

  // dilemma roll (only if none pending already, small chance independent of red/green)
  let dilemma = null;
  if(chance(0.22 * diff.freqMult)){
    const candidates = DILEMMAS.filter(d=> !d.requiresSlide || hasSlideActive());
    if(candidates.length) dilemma = pick(candidates);
  }

  // --- satisfaction factors ---
  let pos = 0, neg = 0;
  if(capacity>0){
    if(crowding<=1) pos += Math.round(10*(1-Math.abs(1-crowding)));
    else neg += clamp(Math.round((crowding-1)*30),0,15);
  }
  const groups = new Set(G.built.filter(b=>b.status==="active").map(b=>defOf(b.defId).group).filter(Boolean));
  if(groups.size>=2) pos += 5;
  const seatCap = allBuilt("seating").filter(b=>b.status!=="closed").reduce((s,b)=>s+(defOf(b.defId).seatCap||0),0);
  if(seatCap*10 >= visitorsPerDay*0.4) pos += 5;
  const foodVariety = activeBuilt("food").length;
  if(foodVariety>=2) pos += 5;
  if(G.justUpgradedThisTurn) pos += 10;
  if(G.rating>G.prevRating) pos += 3;

  const shadeCap = allBuilt("seating").filter(b=>b.status!=="closed" && defOf(b.defId).shade).reduce((s,b)=>s+(defOf(b.defId).seatCap||0),0);
  if([5,6,7].includes(G.monthIdx) && shadeCap*10 < visitorsPerDay*0.25) neg += 8;
  const anyClosed = G.built.some(b=>b.status==="closed");
  if(anyClosed) neg += 10;
  if(crowding>1.3) neg += 5; // long queue

  // headline attractions and security are a standing draw
  pos += Math.min(12, Math.round(appealTotal()/12));
  if(G.security.lifeguard||G.security.full) pos += 4;
  if(G.security.guards||G.security.full) pos += 2;

  // price perception — "יקר מדי" vs "מחיר הוגן"
  const price = G.ticketPrice||ECON.ticketDefault;
  if(price > 40) neg += (price-40)*0.40;
  else if(price < 25) pos += (25-price)*0.30;

  // event-driven sat deltas already applied via addSat -> _satDelta (can be + or -)
  const eventDelta = G._satDelta||0;

  // NOTE: the baseline is ECON.satBase, not 100. With a baseline of 100 every park
  // — even an empty one — drifted to 5 stars, which broke the whole economy.
  const factorSum = ECON.satBase + pos - neg + eventDelta;
  const newSat = clamp(G.satisfaction*0.7 + factorSum*0.3, 0, 100);

  // fold event-driven money changes already applied directly to G.money above (inside apply())
  const profit = income - expenses;
  G.money += profit;

  G.prevRating = G.rating;
  G.satisfaction = Math.round(newSat);
  G.rating = ratingFromSatisfaction(G.satisfaction);
  G.lastVisitors = visitorsMonth;
  G.cumulativeVisitors += visitorsMonth;

  const visitorsDeltaPct = prevVisitors>0 ? Math.round(((visitorsMonth-prevVisitors)/prevVisitors)*100) : null;

  G.history.push({
    turn:G.turn, monthIdx:G.monthIdx, year:G.year,
    visitors:visitorsMonth, visitorsDeltaPct,
    satisfaction:G.satisfaction, rating:G.rating,
    income, expenses, maintenance, securityMonthly, ticketIncome, foodIncome, vipIncome,
    payroll:oh.payroll, arnona:oh.arnona, admin:oh.admin, insurance:oh.insurance,
    ticketPrice:G.ticketPrice, turnedAway, capacity, demand:Math.round(demandPerDay),
    profit, money:G.money,
  });
  if(G.history.length>36) G.history.shift();

  G.pendingEvents = news;
  G.pendingDilemma = dilemma;
  G.justUpgradedThisTurn = false;

  // advance calendar
  G.monthIdx += 1;
  if(G.monthIdx>11){ G.monthIdx=0; G.year+=1; }
  G.turn += 1;
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function checkEndConditions(){
  if(G.money < -200000 && G.winCondition!=="sandbox"){
    G.over = {type:"lose", reason:"bankrupt"};
    return true;
  }
  if(G.winCondition==="season"){
    if(G.turn > G.seasonLen){ G.over = {type:"win", reason:"season"}; return true; }
  }
  if(G.winCondition==="goal"){
    let reached=false;
    if(G.goalType==="money" && G.money>=G.goalValue) reached=true;
    if(G.goalType==="stars" && G.rating>=G.goalValue) reached=true;
    if(G.goalType==="visitors" && G.cumulativeVisitors>=G.goalValue) reached=true;
    if(reached){ G.over = {type:"win", reason:"goal"}; return true; }
  }
  return false;
}

/* =========================================================
   RENDER — root dispatcher
   ========================================================= */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!G){ app.appendChild(renderWelcome()); return; }
  if(G.over){ app.appendChild(renderGameOver()); return; }
  switch(G.screen){
    case "wizard": app.appendChild(renderWizard()); break;
    case "dashboard": app.appendChild(renderDashboard()); break;
    case "build": app.appendChild(renderBuild()); break;
    case "history": app.appendChild(renderHistory()); break;
    default: app.appendChild(renderDashboard());
  }
  // overlays
  if(G.screen==="dashboard" || G.screen==="build" || G.screen==="history"){
    if(G._showReport){ app.appendChild(renderReportOverlay()); }
    else if(G._showDilemma){ app.appendChild(renderDilemmaOverlay()); }
  }
  saveGame();
}

function el(html){
  const d = document.createElement("div");
  d.innerHTML = html.trim();

}

      [["money","💰 כסף"],["stars","⭐ דירוג"],["visitors","👥 מבקרים"]].forEach(([id,label])=>{
        const b = el(`<button class="btn btn-sm ${G.draft.goalType===id?'btn-accent':'btn-ghost'}" style="flex:1;">${label}</button>`);
        on(b,"click",()=>{ G.draft.goalType=id; renderInto(); });
        typeRow.appendChild(b);
      });
      goalBox.appendChild(el(`<div class="small muted">בחרו יעד:</div>`));
      goalBox.appendChild(typeRow);
      const defaults = {money:5000000, stars:5, visitors:150000};
      if(!G.draft.goalValue) G.draft.goalValue = defaults[G.draft.goalType];
      const numInput = el(`<input type="number" min="1" style="margin-top:6px;">`);
      numInput.value = G.draft.goalValue;
      on(numInput,"input",e=>G.draft.goalValue=Number(e.target.value)||1);
      goalBox.appendChild(numInput);
      body.appendChild(goalBox);
    }
  }
  if(step==="difficulty"){
    body.appendChild(el(`<div class="title-xl" style="margin-bottom:4px;">רמת קושי</div>`));
    Object.entries(DIFFICULTY).forEach(([id,d])=>{
      const card = el(`<div class="opt-card ${G.draft.difficulty===id?'selected':''}">
        <div class="opt-emoji">${d.emoji}</div>
        <div><div class="opt-title">${d.label}</div><div class="opt-sub">תקציב פתיחה: ${fmtMoney(d.startMoney)} · קנסות ×${d.fineMult}</div></div>
      </div>`);
      on(card,"click",()=>{ G.draft.difficulty=id; renderInto(); });
      body.appendChild(card);
    });
  }
  if(step==="pace"){
    body.appendChild(el(`<div class="title-xl" style="margin-bottom:4px;">קצב משחק</div>`));
    Object.entries(PACE).forEach(([id,p])=>{
      const card = el(`<div class="opt-card ${G.draft.pace===id?'selected':''}">
        <div class="opt-emoji">${p.emoji}</div>
        <div><div class="opt-title">${p.label}</div><div class="opt-sub">${id==='fast'?'עונה שלמה ב-~10 דק׳, ממשק מצומצם':'חוויה עמוקה, גרפים ופירוט מלא, עונה של '+p.seasonLen+' חודשים'}</div></div>
      </div>`);
      on(card,"click",()=>{ G.draft.pace=id; renderInto(); });
      body.appendChild(card);
    });
  }
  if(step==="review"){
    body.appendChild(el(`<div class="logo-hero">🚀</div>`));
    body.appendChild(el(`<div class="title-xl">מוכנים לצלול?</div>`));
    const d = G.draft;
    const rows = [
      ["מנהל/ת", d.managerName||"—"],
      ["פארק", d.parkName||"—"],
      ["מטרה", {sandbox:"Sandbox אינסופי",season:"שרוד עונה",goal:"יעד מוגדר"}[d.winCondition]],
      ["קושי", DIFFICULTY[d.difficulty].label],
      ["קצב", PACE[d.pace].label],
    ];
    const card = el(`<div class="card stack gap8" style="margin-top:10px;"></div>`);
    rows.forEach(([k,v])=>card.appendChild(el(`<div class="row-between"><span class="muted small">${k}</span><span style="font-weight:700;">${v}</span></div>`)));
    body.appendChild(card);
  }

  function renderInto(){ // re-render just this screen in place
    const idx = Array.from(wrap.parentElement?wrap.parentElement.children:[]).indexOf(wrap);
    render();
  }

  const nextBtn = wrap.querySelector("#wizNext");
  const backBtn = wrap.querySelector("#wizBack");
  if(step==="review") nextBtn.textContent = "🏊 התחל ניהול!";
  on(nextBtn,"click",()=>{
    if(step==="manager" && !G.draft.managerName.trim()){ toast("צריך לרשום שם 🙂"); return; }
    if(step==="park" && !G.draft.parkName.trim()){ toast("צריך שם לפארק 🙂"); return; }
    if(step==="review"){
      G = newGame(G.draft);
      render();
      return;
    }
    G.step += 1; render();
  });
  if(backBtn) on(backBtn,"click",()=>{ G.step -=1; render(); });

  return wrap;
}

/* Ticket price — the player's main revenue dial.
   Cheap fills the park but invites בלאגן; steep empties it and annoys people. */
function priceCard(){
  const price = G.ticketPrice||ECON.ticketDefault;
  const card = el(`<div class="price-card">
    <div class="price-head">
      <span class="lbl">🎟️ מחיר כרטיס</span>
      <span class="price-value" id="priceVal">₪${price}</span>
    </div>
    <div class="price-row">
      <button class="price-step" id="priceDown" aria-label="הורדת מחיר">−</button>
      <input class="price-slider" id="priceSlider" type="range"
             min="${ECON.ticketMin}" max="${ECON.ticketMax}" step="1" value="${price}"
             aria-label="מחיר כרטיס בשקלים">
      <button class="price-step" id="priceUp" aria-label="העלאת מחיר">+</button>
    </div>
    <div class="price-hint" id="priceHint"></div>
  </div>`);

  const valEl   = card.querySelector("#priceVal");
  const hintEl  = card.querySelector("#priceHint");
  const slider  = card.querySelector("#priceSlider");
  const btnDown = card.querySelector("#priceDown");
  const btnUp   = card.querySelector("#priceUp");

  function refresh(){
    const p = G.ticketPrice;
    valEl.textContent = `₪${p}`;
    slider.value = p;
    btnDown.disabled = p<=ECON.ticketMin;
    btnUp.disabled   = p>=ECON.ticketMax;

    const cap    = capacityTotal();
    const demand = Math.round(marketPerDay(G.monthIdx));

    let tag;
    if(p < 25)      tag = `<span class="price-tag cheap">זול</span> קהל גדול וקצת פרוע.`;
    else if(p > 40) tag = `<span class="price-tag steep">יקר</span> יותר מכל ראש, פחות סבלנות בביקורות.`;
    else            tag = `<span class="price-tag fair">בינוני</span> אף אחד לא מתלונן.`;

    // The real lesson: the right price depends on whether capacity is the bottleneck.
    let load;
    if(cap<=0){
      load = "אין עדיין מתקנים פעילים — המחיר לא משנה עד שתבנו משהו.";
    } else if(demand > cap*1.05){
      const away = Math.round((demand-cap)*30).toLocaleString('he-IL');
      load = `ביקוש <b>${demand.toLocaleString('he-IL')}</b>/יום מול קיבולת <b>${cap.toLocaleString('he-IL')}</b> — `
           + `<span style="color:var(--warn)">${away} אנשים יחזרו הביתה החודש</span>. `
           + `<b style="color:var(--good)">כדאי להעלות מחיר או להרחיב.</b>`;
    } else if(demand < cap*0.8){
      const pct = Math.round(demand/cap*100);
      load = `ביקוש <b>${demand.toLocaleString('he-IL')}</b>/יום — רק <b>${pct}%</b> מהקיבולת, `
           + `ואת המשכורות משלמים בכל מקרה. <b style="color:var(--good)">כדאי להוריד מחיר.</b>`;
    } else {
      const pct = Math.round(demand/cap*100);
      load = `ביקוש <b>${demand.toLocaleString('he-IL')}</b>/יום — <b>${pct}%</b> מהקיבולת. `
           + `<b style="color:var(--good)">מחיר מכויל יפה.</b>`;
    }
    hintEl.innerHTML = `${tag}<br>${load}`;
  }

  function setPrice(v){
    G.ticketPrice = clamp(Math.round(v), ECON.ticketMin, ECON.ticketMax);
    refresh(); saveGame();
  }
  on(slider,"input",()=>setPrice(+slider.value));
  on(btnDown,"click",()=>setPrice(G.ticketPrice-1));
  on(btnUp,"click",()=>setPrice(G.ticketPrice+1));
  refresh();
  return card;
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function sparkline(values, light){
  if(values.length<2){ return el(`<div class="small" style="color:${light?'rgba(255,255,255,.85)':'var(--dim)'};text-shadow:${light?'0 1px 4px rgba(3,26,40,.3)':'none'};">עוד אין מספיק נתונים.</div>`); }
  const w=480,h=60,pad=4;
  const max=Math.max(...values,1), min=Math.min(...values,0);
  const range = (max-min)||1;
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1))*(w-pad*2);
    const y = h-pad - ((v-min)/range)*(h-pad*2);
    return `${x},${y}`;
  }).join(" ");
  const stroke = light? "#ffffff" : "#ff6b4a";
  const svg = el(`<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 1px 3px rgba(3,26,40,.3));"/>
  </svg>`);
  return svg;
}

function catColor(cat){
  return ({facility:"var(--accent)", food:"var(--coral)", seating:"var(--violet)", expansion:"var(--leaf)", marketing:"var(--pink)", security:"var(--slate)"})[cat] || "var(--border)";
}

function buildingCard(b){
  const d = defOf(b.defId);
  const totalWeeks = d.weeks;
  const pct = totalWeeks>0 ? Math.round(((totalWeeks-b.weeksLeft)/totalWeeks)*100) : 100;
  const card = el(`<div class="item-card building">
    <div class="item-title">🚧 ${d.emoji} ${d.name}</div>
    <div class="item-meta">בבנייה — נותרו ${Math.ceil(b.weeksLeft/4)} חודשים (${Math.max(0,b.weeksLeft)} שבועות)</div>
    <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="item-actions"></div>
  </div>`);
  const speedCost = Math.round((b.weeksLeft/4) * (d.cost/Math.max(1,totalWeeks/4)) * 0.6);
  const actions = card.querySelector(".item-actions");
  const speedBtn = el(`<button class="btn btn-sm btn-ghost" style="flex:1;">⚡ להאיץ בתשלום (${fmtMoney(speedCost)})</button>`);
  speedBtn.disabled = G.money < speedCost;
  on(speedBtn,"click",()=>{ if(G.money<speedCost) return; G.money-=speedCost; b.weeksLeft=0; b.status="active"; b.monthsSinceMaint=0; b.builtAtTurn=G.turn; G.justUpgradedThisTurn=true; toast("הבנייה הואצה! 🏗️"); render(); });
  actions.appendChild(speedBtn);
  return card;
}

/* =========================================================
   BUILD SCREEN
   ========================================================= */
const BUILD_TABS = [
  {id:"facility", label:"🏊 מתקנים", data:FACILITIES},
  {id:"food", label:"🍔 הסעדה", data:FOOD},
  {id:"seating", label:"🪑 ישיבה", data:SEATING},
  {id:"expansion", label:"📐 הרחבה", data:EXPANSION},
  {id:"marketing", label:"📢 פרסום", data:MARKETING},
  {id:"security", label:"🛡️ אבטחה", data:SECURITY},
];

function renderBuild(){
  const wrap = el(`<div class="screen"></div>`);
  const bar = el(`<div class="topbar">
    <button class="icon-btn" id="backBtn">➡️</button>
    <div class="park-id">🏗️ בנייה ושדרוגים</div>
    <span class="badge badge-gold">💰 ${fmtMoney(G.money)}</span>
  </div>`);
  on(bar.querySelector("#backBtn"),"click",()=>{ G.screen="dashboard"; render(); });
  wrap.appendChild(bar);

  const tabs = el(`<div class="tabs"></div>`);
  BUILD_TABS.forEach(t=>{
    const tb = el(`<div class="tab tab-${t.id} ${G.buildTab===t.id?'active':''}">${t.label}</div>`);
    on(tb,"click",()=>{ G.buildTab=t.id; render(); });
    tabs.appendChild(tb);
  });
  wrap.appendChild(tabs);

  wrap.appendChild(el(`<div class="side-panel">
    <div class="side-stat"><div class="ss-label">יתרה</div><div class="ss-value">${fmtMoney(G.money)}</div></div>
    <div class="side-stat"><div class="ss-label">בבנייה</div><div class="ss-value">${G.built.filter(b=>b.status==='building').length}</div></div>
    <div class="side-stat"><div class="ss-label">שטח</div><div class="ss-value">${allSlotsUsed()}/${totalSlots()}</div></div>
  </div>`));

  const tab = BUILD_TABS.find(t=>t.id===G.buildTab);
  const list = el(`<div class="item-list"></div>`);

  if(tab.id==="marketing"){
    tab.data.forEach(m=>list.appendChild(marketingCard(m)));
  } else if(tab.id==="security"){
    tab.data.forEach(s=>list.appendChild(securityCard(s)));
  } else {
    // built (active) first
    G.built.filter(b=>defOf(b.defId).cat===tab.id && b.status==="active")
      .forEach(b=>list.appendChild(existingCard(b)));
    // building
    G.built.filter(b=>defOf(b.defId).cat===tab.id && b.status==="building")
      .forEach(b=>list.appendChild(buildingCard(b)));
    // closed (broken)
    G.built.filter(b=>defOf(b.defId).cat===tab.id && b.status==="closed")
      .forEach(b=>list.appendChild(closedCard(b)));
    // available
    tab.data.forEach(d=>{
      const already = G.built.some(b=>b.defId===d.id);
      if(already && !d.repeatable) return;
      list.appendChild(availableCard(d));
    });
  }

  if(list.children.length===0){
    list.appendChild(el(`<div class="center small" style="padding:30px 0;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(3,26,40,.3);">אין פריטים בקטגוריה הזו כרגע.</div>`));
  }
  wrap.appendChild(list);
  return wrap;
}

function existingCard(b){
  const d = defOf(b.defId);
  const age = Math.max(0, G.turn - (b.builtAtTurn||G.turn));
  const maintLevel = b.monthsSinceMaint<=2 ? "🟢 תקין" : (b.monthsSinceMaint<=6 ? "🟡 בינוני" : "🔴 מוזנח");
  const card = el(`<div class="item-card" style="border-inline-start-color:${catColor(d.cat)};">
    <div class="item-title">${d.emoji} ${d.name}</div>
    <div class="item-meta">מצב: פעיל ✅ · בנוי לפני: ${age} חודשים · תחזוקה: ${maintLevel}</div>
    <div class="item-actions"></div>
  </div>`);
  const actions = card.querySelector(".item-actions");
  if(d.cat==="facility"){
    const maintCost = Math.max(500, Math.round((d.maint||500)*3));
    const maintBtn = el(`<button class="btn btn-sm btn-ghost" style="flex:1;">🔧 תחזק עכשיו (${fmtMoney(maintCost)})</button>`);
    maintBtn.disabled = G.money<maintCost || b.monthsSinceMaint<=1;
    on(maintBtn,"click",()=>{ if(G.money<maintCost) return; G.money-=maintCost; b.monthsSinceMaint=0; G.justUpgradedThisTurn=true; toast("תוחזק! ✨"); render(); });
    actions.appendChild(maintBtn);

    if(!b.upgraded){
      const upCost = Math.round(d.cost*0.5);
      const upBtn = el(`<button class="btn btn-sm btn-accent" style="flex:1;">⬆️ שדרג (${fmtMoney(upCost)})</button>`);
      upBtn.disabled = G.money<upCost;
      on(upBtn,"click",()=>{ if(G.money<upCost) return; G.money-=upCost; b.upgraded=true; b.monthsSinceMaint=0; d._upgradedCapacityBonus=true; G.justUpgradedThisTurn=true; toast("שודרג! המתקן פופולרי יותר 🎉"); render(); });
      actions.appendChild(upBtn);
    } else {
      actions.appendChild(el(`<span class="badge badge-good" style="flex:1;justify-content:center;">⬆️ משודרג</span>`));
    }
  } else {
    const maintCost = Math.max(300, Math.round((d.maint||300)*3));
    const maintBtn = el(`<button class="btn btn-sm btn-ghost btn-block">🔧 תחזק עכשיו (${fmtMoney(maintCost)})</button>`);
    maintBtn.disabled = G.money<maintCost || b.monthsSinceMaint<=1;
    on(maintBtn,"click",()=>{ if(G.money<maintCost) return; G.money-=maintCost; b.monthsSinceMaint=0; toast("תוחזק! ✨"); render(); });
    actions.appendChild(maintBtn);
  }
  return card;
}

function closedCard(b){
  const d = defOf(b.defId);
  const weeks = Math.ceil((b.closedWeeksLeft||0)/4)||1;
  const card = el(`<div class="item-card" style="border-color:rgba(217,54,43,.35);border-inline-start-color:var(--bad);">
    <div class="item-title">${d.emoji} ${d.name}</div>
    <div class="item-meta" style="color:var(--bad);">🚧 סגור לתיקון — נותרו כ-${weeks} חודשים</div>
    <div class="item-actions"></div>
  </div>`);
  const fixCost = Math.round((d.maint||1000)*4);
  const fixBtn = el(`<button class="btn btn-sm btn-ghost btn-block">⚡ תיקון מהיר בתשלום (${fmtMoney(fixCost)})</button>`);
  fixBtn.disabled = G.money<fixCost;
  on(fixBtn,"click",()=>{ if(G.money<fixCost) return; G.money-=fixCost; b.status="active"; b.closedWeeksLeft=0; b.monthsSinceMaint=0; toast("תוקן! פתוח שוב 🎉"); render(); });
  card.querySelector(".item-actions").appendChild(fixBtn);
  return card;
}

function availableCard(d){
  const used = allSlotsUsed();
  const needsSlot = (d.slots||0) > 0;
  const noSpace = needsSlot && (used + d.slots > totalSlots());
  const noMoney = G.money < d.cost;
  const disabled = noSpace || noMoney;
  let extra = "";
  if(d.id==="umbrellas"){ extra = ` · ₪16,500 ליחידה (כאן = 4 יח')`; }
  // What this costs you every single month, and how much new demand it pulls in.
  const runMonthly = (d.maint||0) + (d.capacity||0)*ECON.arnonaPerCapacity
    + (d.capacity? Math.ceil(d.capacity/ECON.lifeguardPer)*ECON.lifeguardCost
                 + Math.ceil(d.capacity/ECON.staffPer)*ECON.staffCost : 0);
  const runLine = runMonthly>0
    ? `<div class="item-meta" style="color:var(--bad);">💸 עד ${fmtMoney(runMonthly)}/חודש בשיא העונה</div>` : "";
  const drawLine = d.appeal
    ? `<div class="item-meta" style="color:var(--good);">🧲 מושך ~${Math.round(d.appeal*ECON.appealScale)} מבקרים/יום נוספים לשוק</div>` : "";
  const card = el(`<div class="item-card ${disabled?'disabled':''}" style="border-inline-start-color:${catColor(d.cat)};">
    <div class="item-title">${d.emoji} ${d.name}</div>
    <div class="item-meta">${fmtMoney(d.cost)} · ${d.weeks>0?Math.ceil(d.weeks/4)+' חודשים בנייה':'זמין מיידית'}${d.capacity?` · קיבולת ${d.capacity}/יום`:''}${needsSlot?` · ${d.slots} יח' שטח`:''}${extra}</div>
    ${drawLine}${runLine}
    <div class="item-actions"></div>
  </div>`);
  const btn = el(`<button class="btn btn-sm ${disabled?'btn-ghost':'btn-accent'} btn-block">🔨 בנה</button>`);
  btn.disabled = disabled;
  on(btn,"click",()=>{
    if(disabled) return;
    G.money -= d.cost;
    const b = {defId:d.id, status: d.weeks>0?"building":"active", weeksLeft:d.weeks, monthsSinceMaint:0, builtAtTurn:G.turn};
    if(d.weeks<=0) G.justUpgradedThisTurn = true;
    if(d.id==="extra_dunam"){ /* built triggers capacity via effect below on completion */ }
    G.built.push(b);
    toast(`🔨 בונים ${d.name}...`);
    render();
  });
  card.querySelector(".item-actions").appendChild(btn);
  if(noSpace) card.querySelector(".item-meta").insertAdjacentHTML("beforeend", ` · <span style="color:var(--bad);">אין שטח פנוי</span>`);
  return card;
}

function marketingCard(m){
  const active = G.campaigns.find(c=>c.id===m.id+"_active");
  const card = el(`<div class="item-card" style="border-inline-start-color:var(--pink);">
    <div class="item-title">${m.emoji} ${m.name}</div>
    <div class="item-meta">${fmtMoney(m.cost)} · משך השפעה: ${Math.ceil(m.weeksDuration/4)} חודש/ים · +${Math.round(m.boost*100)}% מבקרים</div>
    <div class="item-actions"></div>
  </div>`);
  const actions = card.querySelector(".item-actions");
  if(active){
    actions.appendChild(el(`<span class="badge badge-good" style="flex:1;justify-content:center;">✅ פעיל (${Math.ceil(active.weeksLeft/4)} חוד' נותרו)</span>`));
  } else {
    const btn = el(`<button class="btn btn-sm btn-accent btn-block">📢 הפעל קמפיין</button>`);
    btn.disabled = G.money<m.cost;
    on(btn,"click",()=>{
      if(G.money<m.cost) return;
      G.money -= m.cost;
      G.campaigns.push({id:m.id+"_active", weeksLeft:m.weeksDuration, boost:m.boost});
      toast(`📢 ${m.name} יצא לדרך!`);
      render();
    });
    actions.appendChild(btn);
  }
  return card;
}

function securityCard(s){
  const owned = G.security[s.id];
  const card = el(`<div class="item-card" style="border-inline-start-color:var(--slate);">
    <div class="item-title">${s.emoji} ${s.name}</div>
    <div class="item-meta">${fmtMoney(s.cost)} + ${fmtMoney(s.monthly)}/חודש · ${s.desc}</div>
    <div class="item-actions"></div>
  </div>`);
  const actions = card.querySelector(".item-actions");
  if(owned){
    actions.appendChild(el(`<span class="badge badge-good" style="flex:1;justify-content:center;">✅ פעיל</span>`));
  } else {
    const btn = el(`<button class="btn btn-sm btn-accent btn-block">🛡️ רכוש</button>`);
    btn.disabled = G.money<s.cost;
    on(btn,"click",()=>{
      if(G.money<s.cost) return;
      G.money -= s.cost;
      G.security[s.id] = true;
      if(s.id==="full"){ G.security.guards=true; G.security.cameras=true; G.security.lifeguard=true; }
      toast(`🛡️ ${s.name} הופעל!`);
      render();
    });
    actions.appendChild(btn);
  }
  return card;
}

/* effect: extra_dunam grants slots when completed -> patch resolveMonth tick */
const _origResolve = resolveMonth;

/* =========================================================
   HISTORY / REPORT SCREEN
   ========================================================= */
function renderHistory(){
  const wrap = el(`<div class="screen"></div>`);
  const bar = el(`<div class="topbar">
    <button class="icon-btn" id="backBtn">➡️</button>
    <div class="park-id">📊 היסטוריה</div>
    <span class="badge">${G.history.length} חודשים</span>
  </div>`);
  on(bar.querySelector("#backBtn"),"click",()=>{ G.screen="dashboard"; render(); });
  wrap.appendChild(bar);

  wrap.appendChild(el(`<div class="section-title">מגמת מבקרים ושביעות רצון</div>`));
  const chartWrap = el(`<div class="px"></div>`);
  chartWrap.appendChild(sparkline(G.history.map(h=>h.visitors), true));
  wrap.appendChild(chartWrap);

  wrap.appendChild(el(`<div class="section-title">טבלת חודשים</div>`));
  const card = el(`<div class="card px" style="margin:0 16px;"></div>`);
  const header = el(`<div class="hist-row" style="font-weight:800;color:var(--dim);"><span>חודש</span><span>מבקרים</span><span>דירוג</span><span>רווח</span></div>`);
  card.appendChild(header);
  G.history.slice().reverse().forEach(h=>{
    const row = el(`<div class="hist-row">
      <span>${MONTHS[h.monthIdx].slice(0,3)}' ${h.year}</span>
      <span>${h.visitors.toLocaleString('he-IL')}</span>
      <span>${stars(h.rating)}</span>
      <span style="color:${h.profit>=0?'var(--good)':'var(--bad)'}">${fmtMoney(h.profit)}</span>
    </div>`);
    card.appendChild(row);
  });
  wrap.appendChild(card);
  wrap.appendChild(el(`<div style="height:20px;"></div>`));
  return wrap;
}

/* =========================================================
   DILEMMA OVERLAY
   ========================================================= */
function renderDilemmaOverlay(){
  const dil = G.pendingDilemma;
  const overlay = el(`<div class="overlay"><div class="sheet"></div></div>`);
  const sheet = overlay.querySelector(".sheet");
  sheet.appendChild(el(`<div class="sheet-handle"></div>`));
  sheet.appendChild(el(`<span class="event-emoji">${dil.emoji}</span>`));
  sheet.appendChild(el(`<div class="event-headline">${dil.headline}</div>`));
  if(!G.quickUI){
    sheet.appendChild(el(`<div class="event-desc">${dil.desc}</div>`));
  }
  const choicesWrap = el(`<div class="event-choices"></div>`);
  dil.choices.forEach((c,i)=>{
    const btn = el(`<button class="btn ${i===0?'btn-good':'btn-ghost'} btn-lg btn-block">${c.label}</button>`);
    on(btn,"click",()=>{
      G._satDelta = 0;
      const result = c.apply();
      G.pendingEvents.unshift({type:"neutral", title:`${dil.emoji} ${dil.name}`, sub:result});
      if(G._satDelta){ G.satisfaction = clamp(G.satisfaction + G._satDelta*0.3, 0, 100); G.satisfaction = Math.round(G.satisfaction); G.rating = ratingFromSatisfaction(G.satisfaction); }
      G.pendingDilemma = null;
      G._showDilemma = false;
      G._showReport = true;
      render();
    });
    choicesWrap.appendChild(btn);
  });
  sheet.appendChild(choicesWrap);
  return overlay;
}

/* =========================================================
   MONTHLY REPORT OVERLAY
   ========================================================= */
function renderReportOverlay(){
  const h = G.history[G.history.length-1];
  const overlay = el(`<div class="overlay"><div class="sheet"></div></div>`);
  const sheet = overlay.querySelector(".sheet");
  sheet.appendChild(el(`<div class="sheet-handle"></div>`));
  sheet.appendChild(el(`<div class="row-between"><div style="font-weight:800;">📅 ${MONTHS[h.monthIdx]} ${h.year}</div><div class="muted small">${G.parkName}</div></div>`));

  const deltaColor = (h.visitorsDeltaPct==null)?'var(--dim)':(h.visitorsDeltaPct>=0?'var(--good)':'var(--bad)');
  const deltaTxt = (h.visitorsDeltaPct==null)?'':` (${h.visitorsDeltaPct>=0?'+':''}${h.visitorsDeltaPct}%)`;
  sheet.appendChild(el(`<div class="kpi-row" style="margin:14px 0 0;">
    <div class="kpi"><div class="kpi-label">👥 מבקרים</div><div class="kpi-value">${h.visitors.toLocaleString('he-IL')}</div><div class="kpi-delta" style="color:${deltaColor}">${deltaTxt}</div></div>
    <div class="kpi"><div class="kpi-label">⭐ דירוג</div><div class="kpi-value">${stars(h.rating)}</div></div>
    <div class="kpi"><div class="kpi-label">💰 רווח נקי</div><div class="kpi-value" style="color:${h.profit>=0?'var(--good)':'var(--bad)'}">${fmtMoney(h.profit)}</div></div>
  </div>`));

  // financial breakdown (collapsible)
  const finBox = el(`<div class="card" style="margin-top:14px;"></div>`);
  const finHeader = el(`<div class="row-between" style="cursor:pointer;"><span style="font-weight:700;font-size:13.5px;">💵 פירוט כספי</span><span id="finArrow">${G.quickUI?'▼':'▲'}</span></div>`);
  const finBody = el(`<div class="stack" style="margin-top:10px;"></div>`);
  finBody.appendChild(el(`<div class="finance-row"><span class="muted">🎟️ כרטיסים <span style="opacity:.7">(₪${h.ticketPrice??ECON.ticketDefault})</span></span><span>${fmtMoney(h.ticketIncome)}</span></div>`));
  finBody.appendChild(el(`<div class="finance-row"><span class="muted">🍔 הסעדה</span><span>${fmtMoney(h.foodIncome)}</span></div>`));
  finBody.appendChild(el(`<div class="finance-row"><span class="muted">💎 VIP</span><span>${fmtMoney(h.vipIncome)}</span></div>`));
  const outRow = (label,val)=>`<div class="finance-row"><span class="muted">${label}</span><span style="color:var(--bad)">-${fmtMoney(val)}</span></div>`;
  finBody.appendChild(el(outRow(`🧑‍✈️ שכר עובדים <span style="opacity:.7">(${staffCounts().lifeguards} מצילים · ${staffCounts().staff} עובדים)</span>`, h.payroll||0)));
  finBody.appendChild(el(outRow("🔧 תחזוקה", h.maintenance)));
  finBody.appendChild(el(outRow("🏛️ ארנונה", h.arnona||0)));
  finBody.appendChild(el(outRow(`📋 ביטוח${G.turn < (G.insuranceSpikeUntil||0) ? ' <span style="opacity:.7">(מוטען אחרי תאונה)</span>' : ''}`, h.insurance||0)));
  finBody.appendChild(el(outRow("🗄️ מנהלה ורישוי", h.admin||0)));
  finBody.appendChild(el(outRow("🛡️ אבטחה", h.securityMonthly)));
  finBody.appendChild(el(`<div class="finance-row total"><span>רווח נקי</span><span style="color:${h.profit>=0?'var(--good)':'var(--bad)'}">${fmtMoney(h.profit)}</span></div>`));
  if(h.turnedAway>0){
    finBody.appendChild(el(`<div class="finance-row" style="border-top:1px dashed var(--border);margin-top:6px;padding-top:8px;"><span class="muted">🚧 נשלחו הביתה (אין מקום)</span><span style="color:var(--warn)">${h.turnedAway.toLocaleString('he-IL')}</span></div>`));
  }
  finBody.style.display = G.quickUI ? "none" : "flex";
  finBox.appendChild(finHeader); finBox.appendChild(finBody);
  on(finHeader,"click",()=>{
    const showing = finBody.style.display!=="none";
    finBody.style.display = showing?"none":"flex";
    finHeader.querySelector("#finArrow").textContent = showing?"▼":"▲";
  });
  sheet.appendChild(finBox);

  // hot news
  if(G.pendingEvents.length){
    sheet.appendChild(el(`<div class="section-title" style="margin:16px 0 8px;padding:0;">🗞️ הידיעות החמות</div>`));
    const newsStack = el(`<div class="stack gap8"></div>`);
    G.pendingEvents.forEach(n=>{
      const card = el(`<div class="news-card ${n.type==='bad'?'bad':(n.type==='good'?'good':'')}">
        <div class="news-title">${n.headline?n.headline:n.title}</div>
        <div class="news-sub">${n.headline?n.title+' — ':''}${n.sub}</div>
      </div>`);
      newsStack.appendChild(card);
    });
    sheet.appendChild(newsStack);
  } else {
    sheet.appendChild(el(`<div class="muted small center" style="margin-top:16px;">חודש שקט. אף אחד לא רב על כיסא הפעם. 🙏</div>`));
  }

  if(!G.quickUI){
    sheet.appendChild(el(`<div class="section-title" style="padding:0;margin:18px 0 6px;">📈 מגמה — 6 חודשים אחרונים</div>`));
    sheet.appendChild(sparkline(G.history.slice(-6).map(x=>x.visitors)));
  }

  const cont = el(`<button class="btn btn-primary btn-lg btn-block" style="margin-top:20px;">המשך ➡️</button>`);
  on(cont,"click",()=>{
    G._showReport = false;
    G.pendingEvents = [];
    if(checkEndConditions()){ render(); return; }
    render();
  });
  sheet.appendChild(cont);

  return overlay;
}

/* =========================================================
   GAME OVER / WIN
   ========================================================= */
function renderGameOver(){
  const win = G.over.type==="win";
  const outer = el(`<div class="screen scene-host">
    <div class="scene-backdrop">${SCENE_SVG}</div>
    <div class="scene-content px" style="justify-content:center;padding-top:60px;display:flex;flex-direction:column;flex:1;"></div>
  </div>`);
  const wrap = outer.querySelector(".scene-content");
  wrap.appendChild(el(`<div class="logo-hero">${win?'🏆':'💧😢'}</div>`));
  wrap.appendChild(el(`<div class="title-xl">${win?'ניצחתם!':'המשחק נגמר'}</div>`));
  let msg = "";
  if(win && G.over.reason==="season") msg = `${G.parkName} שרד עונה שלמה בלי לפשוט רגל! מנהל/ת השנה: ${G.managerName}.`;
  if(win && G.over.reason==="goal") msg = `${G.parkName} הגיע ליעד שהוגדר! כל הכבוד, ${G.managerName}.`;
  if(!win) msg = `${G.parkName} פשט את הרגל אחרי ${G.turn-1} חודשים. אולי בפעם הבאה פחות מגלשות "פחד מוות".`;
  wrap.appendChild(el(`<div class="subtitle">${msg}</div>`));

  const stat = el(`<div class="card stack gap8" style="margin-top:24px;"></div>`);
  [["💰 כסף סופי", fmtMoney(G.money)],["⭐ דירוג סופי", stars(G.rating)],["👥 סה״כ מבקרים", G.cumulativeVisitors.toLocaleString('he-IL')],["📅 חודשים שרדו", G.turn-1]]
    .forEach(([k,v])=>stat.appendChild(el(`<div class="row-between"><span class="muted small">${k}</span><span style="font-weight:800;">${v}</span></div>`)));
  wrap.appendChild(stat);

  const btn = el(`<button class="btn btn-primary btn-lg btn-block" style="margin-top:24px;">🆕 משחק חדש</button>`);
  on(btn,"click",()=>{
    clearSave();
    G = {screen:"wizard", step:0, draft:{managerName:G.managerName, parkName:"", winCondition:"season", difficulty:"normal", pace:"fast", goalType:"money", goalValue:5000000}};
    render();
  });
  wrap.appendChild(btn);
  return outer;
}

/* =========================================================
   extra_dunam slot effect — hook into completion
   ========================================================= */
const _resolveMonthOriginal = resolveMonth;
resolveMonth = function(){
  _resolveMonthOriginal();
  // grant slots for any extra_dunam that just became active
  G.built.forEach(b=>{
    if(b.defId==="extra_dunam" && b.status==="active" && !b.slotsGranted){
      G.extraSlots += 4;
      b.slotsGranted = true;
    }
  });
};

/* =========================================================
   BOOTSTRAP
   ========================================================= */
function boot(){
  const saved = loadGame();
  if(saved && saved.screen && saved.screen!=="wizard"){
    G = null; // show welcome with continue option
  } else {
    G = null;
  }
  render();
}
boot();
</script>
