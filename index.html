<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b84d6">
<title>ספלאש בלאגן — סימולציית פארק מים</title>
<style>
:root{
  --sky1:#7bdcff;
  --sky2:#0b84d6;
  --bg:var(--sky2);
  --bg2:#f4fbfe;
  --card:#ffffff;
  --card2:#eaf6fb;
  --border:#d3ecf5;
  --text:#0a324c;
  --dim:#5c7a8c;
  --dim2:#93aebc;
  --accent:#00bfb3;
  --accent2:#00969c;
  --good:#16a34a;
  --bad:#d9362b;
  --warn:#c9790a;
  --gold:#b8790a;
  --coral:#ff6b4a;
  --coral2:#ff5252;
  --pink:#ec4fa0;
  --leaf:#3fb950;
  --violet:#9b6bff;
  --slate:#3d5a72;
  --radius:20px;
  --radius-sm:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--sky2);color:var(--text);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Assistant,Arial,sans-serif;
  overscroll-behavior-y:none;
  touch-action:manipulation;
  min-height:100vh;
  min-height:100dvh;
}
button{font-family:inherit;}
::selection{background:var(--accent);color:#fff;}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 460px,#075c87 1400px);
}

/* ---------- generic bits ---------- */
.screen{display:flex;flex-direction:column;flex:1;padding-bottom:calc(24px + var(--safe-bottom));animation:fadein .25s ease;position:relative;}
.scene-host{position:relative;overflow:hidden;}
.scene-backdrop{position:absolute;left:0;right:0;bottom:0;height:min(50vh,380px);z-index:0;}
.scene-backdrop svg{width:100%;height:100%;display:block;}
.scene-backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,132,214,0) 0%,rgba(6,60,92,.45) 55%,rgba(3,26,40,.82) 100%);}
.scene-content{position:relative;z-index:1;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.px{padding-left:16px;padding-right:16px;}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
}
.muted{color:var(--dim);}
.small{font-size:12.5px;}
.center{text-align:center;}
.row{display:flex;align-items:center;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.gap8{gap:8px;}
.gap12{gap:12px;}
.stack{display:flex;flex-direction:column;}
.spacer{flex:1;}
h1,h2,h3,p{margin:0;}
.hidden{display:none !important;}

/* buttons */
.btn{
  border:none;border-radius:999px;
  padding:15px 20px;
  font-size:15.5px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;
  transition:transform .08s ease, opacity .15s ease, filter .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--coral),var(--coral2));color:#fff;box-shadow:0 6px 16px rgba(255,82,82,.35);}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(0,150,156,.3);}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn-good{background:linear-gradient(135deg,#4ade80,#22c55e);color:#052e14;}
.btn-bad{background:linear-gradient(135deg,#fb7185,#ef4444);color:#3a0303;}
.btn-block{width:100%;}
.btn-lg{padding:18px 22px;font-size:17px;border-radius:22px;}
.btn:disabled{opacity:.4;filter:grayscale(.3);cursor:not-allowed;transform:none;box-shadow:none;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:999px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text);cursor:pointer;
  box-shadow:0 2px 8px rgba(8,48,74,.12);
}

/* badges */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:var(--card2);border:1px solid var(--border);color:var(--text);
}
.badge-good{background:rgba(22,163,74,.12);color:var(--good);border-color:rgba(22,163,74,.3);}
.badge-bad{background:rgba(217,54,43,.1);color:var(--bad);border-color:rgba(217,54,43,.28);}
.badge-warn{background:rgba(201,121,10,.12);color:var(--warn);border-color:rgba(201,121,10,.3);}
.badge-gold{background:rgba(184,121,10,.12);color:var(--gold);border-color:rgba(184,121,10,.3);}

/* progress dots (wizard) */
.progress-dots{display:flex;gap:6px;justify-content:center;padding:14px 0 4px;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s;}
.dot.active{background:#fff;width:22px;border-radius:5px;}
.dot.done{background:rgba(255,255,255,.6);}

/* top bar */
.topbar{
  position:sticky;top:0;z-index:20;
  padding:calc(10px + var(--safe-top)) 16px 10px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.park-id{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}

/* hero seasonal card */
.hero{
  margin:12px 16px 0;
  border-radius:24px;
  padding:0;
  position:relative;overflow:hidden;
  border:1px solid var(--border);
  min-height:150px;
  display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:0 10px 28px rgba(6,40,62,.22);
}
.hero-scene{position:absolute;inset:0;transition:filter .4s ease;}
.hero-scene svg{width:100%;height:100%;display:block;}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:75%;background:linear-gradient(0deg,rgba(3,26,40,.8),rgba(3,26,40,0));pointer-events:none;}
.hero .hero-emoji{position:absolute;top:14px;left:16px;font-size:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));z-index:2;background:rgba(255,255,255,.25);backdrop-filter:blur(4px);border-radius:14px;padding:4px 8px;}
.hero .hero-content{position:relative;z-index:2;padding:18px 18px 16px;color:#fff;}
.hero .hero-month{font-size:20px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.4);}
.hero .hero-sub{font-size:12.5px;opacity:.92;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.35);}
.hero-scene.season-winter{filter:saturate(.45) brightness(.78) hue-rotate(15deg);}
.hero-scene.season-spring{filter:saturate(1.05) brightness(1.02);}
.hero-scene.season-summer{filter:saturate(1.3) brightness(1.08) hue-rotate(-6deg);}
.hero-scene.season-autumn{filter:saturate(.8) brightness(.9) sepia(.15) hue-rotate(8deg);}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 16px 0;}
.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:12px 8px;text-align:center;
  box-shadow:0 3px 10px rgba(8,48,74,.08);
}
.kpi .kpi-label{font-size:11px;color:var(--dim);margin-bottom:4px;}
.kpi .kpi-value{font-size:16.5px;font-weight:800;}
.kpi .kpi-delta{font-size:11px;margin-top:3px;font-weight:700;}

/* action grid */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 16px 0;}
.action-card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:16px 12px;text-align:center;cursor:pointer;transition:.1s;
  box-shadow:0 3px 10px rgba(8,48,74,.08);
}
.action-card:active{transform:scale(.96);background:var(--card2);}
.action-card .ac-emoji{font-size:26px;display:block;margin-bottom:6px;}
.action-card .ac-label{font-weight:700;font-size:13.5px;}

/* sticky bottom CTA */
.sticky-cta{
  position:sticky;bottom:0;z-index:20;
  padding:12px 16px calc(12px + var(--safe-bottom));
  background:linear-gradient(0deg,var(--sky2) 55%,transparent);
  margin-top:auto;
}

/* list section */
.section-title{font-size:13px;font-weight:800;color:rgba(255,255,255,.9);margin:18px 16px 8px;letter-spacing:.02em;text-shadow:0 1px 4px rgba(0,0,0,.2);}

/* warning banner */
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;}
.banner-bad{background:#fff0ee;border:1px solid rgba(217,54,43,.3);color:var(--bad);}
.banner-warn{background:#fff8ea;border:1px solid rgba(201,121,10,.3);color:var(--warn);}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;
  background:var(--card);border:1px solid var(--border);color:var(--dim);cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 6px rgba(8,48,74,.08);
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.tab.active.tab-facility{background:var(--accent);border-color:var(--accent);}
.tab.active.tab-food{background:var(--coral);border-color:var(--coral);}
.tab.active.tab-seating{background:var(--violet);border-color:var(--violet);}
.tab.active.tab-expansion{background:var(--leaf);border-color:var(--leaf);}
.tab.active.tab-marketing{background:var(--pink);border-color:var(--pink);}
.tab.active.tab-security{background:var(--slate);border-color:var(--slate);}

.side-panel{display:flex;gap:8px;margin:8px 16px 6px;}
.side-stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 10px;text-align:center;box-shadow:0 2px 8px rgba(8,48,74,.08);}
.side-stat .ss-label{font-size:10px;color:var(--dim);}
.side-stat .ss-value{font-size:13.5px;font-weight:800;margin-top:2px;}

.item-list{display:flex;flex-direction:column;gap:10px;padding:8px 16px 10px;}
.item-card{background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--border);border-radius:18px;padding:14px;box-shadow:0 3px 10px rgba(8,48,74,.08);}
.item-card.building{border-color:rgba(201,121,10,.4);border-inline-start-color:var(--warn);}
.item-card.disabled{opacity:.55;}
.item-title{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;}
.item-meta{font-size:12px;color:var(--dim);margin-top:4px;}
.item-actions{display:flex;gap:8px;margin-top:10px;}
.progress-bar{height:8px;border-radius:5px;background:var(--border);overflow:hidden;margin-top:8px;}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;transition:width .3s;}

/* overlay / bottom sheet */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadein2 .2s ease;
}
@keyframes fadein2{from{opacity:0;}to{opacity:1;}}
.sheet{
  width:100%;max-width:520px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:26px 26px 0 0;
  padding:10px 18px calc(20px + var(--safe-bottom));
  max-height:88vh;overflow-y:auto;
  animation:slideup .25s cubic-bezier(.2,.9,.3,1);
  color:var(--text);
}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 14px;}
.event-emoji{font-size:44px;text-align:center;display:block;margin-bottom:6px;}
.event-headline{font-size:18px;font-weight:800;text-align:center;line-height:1.35;}
.event-desc{font-size:13.5px;color:var(--dim);text-align:center;margin-top:8px;line-height:1.5;}
.event-effects{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.event-choices{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

/* news card */
.news-card{background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(8,48,74,.06);}
.news-card.bad{border-inline-start-color:var(--bad);}
.news-card.good{border-inline-start-color:var(--good);}
.news-title{font-weight:800;font-size:13.5px;}
.news-sub{font-size:12px;color:var(--dim);margin-top:3px;}

/* finance breakdown */
.finance-row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
.finance-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:9px;font-weight:800;font-size:15px;}

/* ---- ticket price control ---- */
.price-card{margin:0 16px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;box-shadow:0 4px 14px rgba(3,26,40,.10);}
.price-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.price-head .lbl{font-size:13px;font-weight:700;color:var(--dim);}
.price-value{font-size:26px;font-weight:900;color:var(--accent2);font-variant-numeric:tabular-nums;}
.price-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.price-step{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:20px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.price-step:active{transform:scale(.94);}
.price-step:disabled{opacity:.35;cursor:default;}
.price-slider{flex:1 1 auto;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--leaf),var(--warn),var(--bad));outline:none;}
.price-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;
  border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;
  box-shadow:0 2px 8px rgba(3,26,40,.28);}
.price-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;
  border:3px solid var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(3,26,40,.28);}
.price-slider:focus-visible{box-shadow:0 0 0 3px rgba(0,191,179,.4);}
.price-hint{margin-top:9px;font-size:12.5px;color:var(--dim);line-height:1.5;}
.price-hint b{color:var(--text);}
.price-tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:800;}
.price-tag.cheap{background:rgba(63,185,80,.15);color:var(--good);}
.price-tag.fair{background:rgba(0,191,179,.15);color:var(--accent2);}
.price-tag.steep{background:rgba(217,54,43,.13);color:var(--bad);}
@media (prefers-reduced-motion:reduce){.price-step:active{transform:none;}}

/* capacity vs demand */
.cap-card{margin:14px 16px 0;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;box-shadow:0 4px 14px rgba(3,26,40,.10);}
.cap-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.cap-head .lbl{font-size:12.5px;font-weight:700;color:var(--dim);}
.cap-nums{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent2);}
.cap-nums.over{color:var(--bad);}
.cap-bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:9px;
  border:1px solid var(--border);}
.cap-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--leaf),var(--accent));
  transition:width .3s;}
.cap-fill.over{background:linear-gradient(90deg,var(--warn),var(--bad));}
.cap-hint{margin-top:8px;font-size:12px;color:var(--dim);line-height:1.5;}

/* satisfaction breakdown in the monthly report */
.sat-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;}
.sat-row .up{color:var(--good);}
.sat-row .down{color:var(--bad);}
.gap4{gap:4px;}

/* history table */
.hist-row{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.hist-row:last-child{border-bottom:none;}

/* toggle switch style card for wizard options */
.opt-card{
  background:var(--card);border:2px solid var(--border);border-radius:18px;
  padding:14px 16px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:12px;
  box-shadow:0 3px 10px rgba(8,48,74,.08);
}
.opt-card.selected{border-color:var(--accent);background:rgba(0,191,179,.08);}
.opt-emoji{font-size:26px;}
.opt-title{font-weight:800;font-size:14.5px;}
.opt-sub{font-size:12px;color:var(--dim);margin-top:2px;}

input[type=text],input[type=number]{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;color:var(--text);font-size:16px;outline:none;
}
input[type=text]:focus,input[type=number]:focus{border-color:var(--accent);}

.logo-hero{font-size:56px;text-align:center;margin-bottom:6px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
.title-xl{font-size:24px;font-weight:900;text-align:center;line-height:1.3;color:#fff;text-shadow:0 2px 10px rgba(3,26,40,.35);}
.subtitle{font-size:14px;color:rgba(255,255,255,.88);text-align:center;margin-top:6px;line-height:1.5;text-shadow:0 1px 6px rgba(3,26,40,.3);}
.title-xl.on-card{color:var(--text);text-shadow:none;}
.subtitle.on-card{color:var(--dim);text-shadow:none;}

.sparkline{width:100%;height:60px;margin-top:6px;}

.toast{
  position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  background:var(--text);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  animation:toastin .2s ease, toastout .3s ease 1.8s forwards;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,10px);}}

/* =========================================================
   ONBOARDING — spotlight tour · contextual tips · glossary
   ========================================================= */
.tour-overlay{position:fixed;inset:0;z-index:9998;background:transparent;}
.tour-hole{
  position:fixed;left:0;top:0;width:0;height:0;border-radius:14px;
  box-shadow:0 0 0 9999px rgba(3,26,40,.75);
  transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease;
  pointer-events:none;
}
.tour-hole::after{
  content:"";position:absolute;inset:-3px;border-radius:inherit;
  border:2px solid var(--sky2);animation:tourpulse 1.7s ease-in-out infinite;
}
@keyframes tourpulse{0%,100%{opacity:.95;}50%{opacity:.3;}}

.tour-bubble{
  position:fixed;z-index:9999;top:0;left:0;
  width:min(320px,calc(100vw - 32px));
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:14px 16px 12px;box-shadow:0 14px 40px rgba(3,26,40,.4);
  color:var(--text);text-align:start;animation:fadein2 .18s ease;
}
.tour-bubble.as-sheet{
  left:0;right:0;top:auto;bottom:0;width:100%;max-width:520px;margin:0 auto;
  border-radius:22px 22px 0 0;padding-bottom:calc(14px + var(--safe-bottom));
}
.tour-arrow{position:absolute;width:16px;height:16px;z-index:-1;}
.tour-arrow i{display:block;width:16px;height:16px;background:var(--card);
  border:1px solid var(--border);border-radius:3px;transform:rotate(45deg);}
.tour-arrow.at-top{top:-8px;animation:tourfloatup 1.2s ease-in-out infinite;}
.tour-arrow.at-bottom{bottom:-8px;animation:tourfloatdown 1.2s ease-in-out infinite;}
.tour-arrow.at-left{left:-8px;animation:tourfloatleft 1.2s ease-in-out infinite;}
.tour-arrow.at-right{right:-8px;animation:tourfloatright 1.2s ease-in-out infinite;}
@keyframes tourfloatup{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes tourfloatdown{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}
@keyframes tourfloatleft{0%,100%{transform:translateX(0);}50%{transform:translateX(-3px);}}

  {id:"full", cat:"security", name:"חבילת אבטחה מלאה", emoji:"🛡️", cost:990000, monthly:54000, weeks:12, desc:"הכל לעיל + כמעט אוטומטי מול משרד הבריאות"},
];

/* ---------------------------------------------------------
   ECON — the economic model.
   Demand comes from a limited MARKET (stars, attractions,
   word of mouth), not from capacity. Capacity only caps it.
   --------------------------------------------------------- */
const ECON = {
  // ticket pricing
  ticketMin:15, ticketMax:60, ticketDefault:32,
  ticketRef:35,          // price at which demand factor == 1
  elasticity:1.25,       // >1 ⇒ raising price loses more heads than it gains ₪

  // market size (visitors per day at seasonMult 1, sat 100)
  marketBase:50,         // people who'd come to any pool
  marketPerStar:125,     // reputation is the main growth engine
  womCap:90,             // word-of-mouth ceiling
  womDiv:260,            // √cumulativeVisitors / womDiv × womCap
  appealScale:2.6,       // headline attractions widen the market

  // payroll — scales with capacity, throttled by season
  lifeguardPer:70,   lifeguardCost:16000,
  staffPer:55,       staffCost:12500,
  staffFloor:0.35,   staffPeak:1.5,   // winter skeleton crew … full crew at seasonMult ≥1.5

  // fixed overhead
  arnonaPerCapacity:85,
  adminBase:9000,
  insuranceBase:8000, insurancePerRisk:6000,
  insuranceSpikeMult:1.6, insuranceSpikeMonths:12,

  // satisfaction equilibrium (NOT 100 — a park earns its stars)
  satBase:50,
};

/* Satisfaction weights. The glossary in the tutorial reads these same
   numbers, so the explanation can never drift from the simulation. */
const SAT_W = {
  crowdFit:10, crowdSlope:30, crowdMax:15,
  variety:5, seating:5, foodVariety:5,
  freshBuild:10, ratingUp:3,
  appealMax:12, appealDiv:12,
  lifeguard:4, guards:2,
  noShade:8, closedRide:10, queue:5, queueAt:1.3,
  priceHigh:40, pricyPerShekel:0.40, priceLow:25, cheapPerShekel:0.30,
};

const DIFFICULTY = {
  easy:   {label:"קליל", emoji:"🟢", maintOn:false, fineMult:0.5, freqMult:0.5, lightOnly:true, startMoney:1800000, opexMult:0.75},
  normal: {label:"רגיל", emoji:"🟡", maintOn:true,  fineMult:1,   freqMult:1,   lightOnly:false, startMoney:1200000, opexMult:1},
  hard:   {label:"יאללה בלאגן", emoji:"🔴", maintOn:true, fineMult:2, freqMult:1.5, lightOnly:false, startMoney:800000, opexMult:1.3, neglect:true, doubleChance:0.3},
};
const PACE = {
  fast: {label:"מהיר", emoji:"🐇", quickUI:true, seasonLen:12},
  slow: {label:"מורחב", emoji:"🐢", quickUI:false, seasonLen:24},
};

  "ספלאש בלאגן","מגלשת חאלס","וואן דה יאללה","H2Whoa","מים עד הצוואר","הבריכה של דודו",
  "אקוופארק חאפלה","טיפה בלאגן","מגלשת יאללה ביי","וואן דה כתר","הבריכה של אבו מים",
  "שיטפון של שמחה","מים עד הברכיים","ספלאש אחלה","טובע בכיף","H2Yalla","מגלשת פחד ואמא"
];

let G = null;

function newGame(draft){
  const diff = DIFFICULTY[draft.difficulty];
  const pace = PACE[draft.pace];
  return {
    screen:"dashboard",
    managerName: draft.managerName,
    parkName: draft.parkName,
    winCondition: draft.winCondition, // sandbox | season | goal
    goalType: draft.goalType || null, // money | stars | visitors

    pace: draft.pace,
    quickUI: pace.quickUI,

    year: 1,
    money: diff.startMoney,
    satisfaction: 62,
    rating: 3,
    prevRating: 3,
    lastVisitors: 0,
    cumulativeVisitors: 0,

    campaigns: [], // {id, weeksLeft, boost}
    security: {guards:false, cameras:false, lifeguard:false, full:false},

  };
}

function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }catch(e){}
}
function loadGame(){
  try{
    const s = localStorage.getItem(SAVE_KEY);
    if(!s) return null;
    return migrateSave(JSON.parse(s));
  }catch(e){ return null; }
}
// Saves from before the economy rewrite lack the new fields.
function migrateSave(g){
  if(!g || typeof g!=="object") return g;
  if(g.ticketPrice==null) g.ticketPrice = ECON.ticketDefault;
  if(g.insuranceSpikeUntil==null) g.insuranceSpikeUntil = 0;
  return g;
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* =========================================================
   HELPERS
   ========================================================= */
function fmtMoney(n){
  const neg = n<0; n = Math.round(Math.abs(n));
  return (neg?"-":"") + "₪" + n.toLocaleString("he-IL");
}
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function rand(min,max){ return Math.random()*(max-min)+min; }
function randi(min,max){ return Math.round(rand(min,max)); }
function chance(p){ return Math.random() < p; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function stars(n){ return "⭐".repeat(clamp(n,1,5)); }
function ratingFromSatisfaction(s){
  if(s<=20) return 1;
  if(s<=40) return 2;
  if(s<=60) return 3;
  if(s<=80) return 4;
  return 5;
}
function ratingDesc(n){
  return ({1:'"לא הייתי חוזר גם אם ישלמו לי"',2:'"היה בסדר, המים היו רטובים"',3:'"כיף משפחתי סטנדרטי"',4:'"תיק ותסע, שווה!"',5:'"הפארק הכי טוב אחרי הכינרת"'})[n];
}
function defOf(defId){
  return FACILITIES.find(f=>f.id===defId) || FOOD.find(f=>f.id===defId) || SEATING.find(f=>f.id===defId) || EXPANSION.find(f=>f.id===defId);
}
function allSlotsUsed(){
  return G.built.reduce((sum,b)=>{
    if(b.status==="closed") return sum;
    const d = defOf(b.defId);
    return sum + (d.slots||0);
  },0);
}
function totalSlots(){ return 8 + G.extraSlots; }
function activeBuilt(cat){
  return G.built.filter(b=>b.status==="active" && defOf(b.defId).cat===cat);
}
function allBuilt(cat){
  return G.built.filter(b=>defOf(b.defId).cat===cat);
}
function capacityTotal(){
  return G.built.filter(b=>b.status==="active").reduce((s,b)=>{
    const d = defOf(b.defId);
    return s + (d.capacity||0);
  },0);
}
function hasSlideActive(){
  return G.built.some(b=>b.status==="active" && defOf(b.defId).isSlide);
}

/* ---------- ECONOMY ---------- */
function appealTotal(){
  return G.built.filter(b=>b.status==="active")
                .reduce((s,b)=>s+(defOf(b.defId).appeal||0),0);
}
function wordOfMouth(){
  return Math.min(ECON.womCap, Math.sqrt(G.cumulativeVisitors)/ECON.womDiv*ECON.womCap);
}
// How many people WANT to come per day, before capacity is applied.
function marketPerDay(monthIdx){
  const base = ECON.marketBase
             + G.rating*ECON.marketPerStar
             + wordOfMouth()
             + appealTotal()*ECON.appealScale;
  const ads = G.campaigns.reduce((s,c)=>s+c.boost,0);
  return base * SEASON_MULT[monthIdx] * (1+ads) * (G.satisfaction/100) * priceFactor();
}
// Demand response to ticket price. >1 below the reference price, <1 above it.
function priceFactor(){
  return Math.pow(ECON.ticketRef/(G.ticketPrice||ECON.ticketDefault), ECON.elasticity);
}
function staffingLoad(monthIdx){
  return clamp(SEASON_MULT[monthIdx]/ECON.staffPeak, ECON.staffFloor, 1);
}
function staffCounts(){
  const cap = capacityTotal();
  if(cap<=0) return {lifeguards:0, staff:0};
  return {
    lifeguards: Math.ceil(cap/ECON.lifeguardPer),
    staff:      Math.ceil(cap/ECON.staffPer),
  };
}
function payrollFor(monthIdx){
  const {lifeguards, staff} = staffCounts();
  const full = lifeguards*ECON.lifeguardCost + staff*ECON.staffCost;
  return Math.round(full * staffingLoad(monthIdx));
}
function riskyCount(){
  return G.built.filter(b=>b.status==="active" && (defOf(b.defId).isSlide||defOf(b.defId).riskMult)).length;
}
function insuranceMonthly(){
  let p = ECON.insuranceBase + riskyCount()*ECON.insurancePerRisk;
  if(G.turn < (G.insuranceSpikeUntil||0)) p *= ECON.insuranceSpikeMult;
  return Math.round(p);
}
function bumpInsurance(){
  G.insuranceSpikeUntil = Math.max(G.insuranceSpikeUntil||0, G.turn + ECON.insuranceSpikeMonths);
}
function arnonaMonthly(){ return Math.round(capacityTotal()*ECON.arnonaPerCapacity); }
// Every recurring cost except maintenance and the security packages.
function overheadBreakdown(monthIdx){
  const opex = DIFFICULTY[G.difficulty].opexMult||1;
  return {
    payroll:   Math.round(payrollFor(monthIdx)*opex),
    arnona:    Math.round(arnonaMonthly()*opex),
    admin:     Math.round(ECON.adminBase*opex),
    insurance: Math.round(insuranceMonthly()*opex),
  };
}
function toast(msg){
  const el = document.createElement("div");
  el.className="toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* =========================================================
   EVENTS DATA
   ========================================================= */
function buildEventPool(){
  const diff = DIFFICULTY[G.difficulty];
  const chairsCount = G.built.filter(b=>b.status==="active" && b.defId==="chairs").length;
  const guardMult = (G.security.guards||G.security.full) ? 0.7 : 1;
  const camMult = (G.security.cameras||G.security.full) ? 0.7 : 1;
  const lifeguardMult = (G.security.lifeguard||G.security.full) ? 0.15 : 1;
  const neglectFactor = worstNeglectFactor();
  const autumnWinter = [8,9,10,11].includes(G.monthIdx) ? 1.6 : 1;
  // A bargain ticket brings a rowdier crowd; a steep one keeps it quiet.
  const price = G.ticketPrice||ECON.ticketDefault;
  const rowdy = price<25 ? 1+(25-price)*0.045 : (price>45 ? 0.85 : 1);

  const RED = [
    {id:"chair_fight", light:true, name:'קטטת כיסאות "כתר"', emoji:"🥊",
      chance:(0.08 + chairsCount*0.01) * guardMult * rowdy,
      headline:'קרב אגרוף על כיסא בצל — "היד שלי הייתה שם קודם!"',
      apply(){ const fine = randi(33000,110000)*diff.fineMult; G.money -= fine; addSat(-8);
        return `קנס ${fmtMoney(fine)} ופוסט זועם בקבוצת הוואטסאפ השכונתית.`; }},
    {id:"slide_malfunction", light:false, name:"תקלה במגלשה", emoji:"🔧",
      chance: hasSlideActive() ? (0.06 * neglectFactor) : 0,
      headline:"מגלשה נתקעת עם מבקר בפנים — הצוות הכריז חירום",

function worstNeglectFactor(){
  if(G.difficulty!=="hard") return 1;
  let worst = 1;
  G.built.forEach(b=>{
    if(b.status!=="active") return;
    const d = defOf(b.defId);
    const mult = (d.riskMult||1) * (b.monthsSinceMaint>6 ? 1.8 : (b.monthsSinceMaint>3?1.3:1));
    if(mult>worst) worst = mult;
  });
  return worst;
}

function addSat(delta){ G._satDelta = (G._satDelta||0) + delta; }

/* =========================================================
   MONTH RESOLUTION
   ========================================================= */
function resolveMonth(){
  const diff = DIFFICULTY[G.difficulty];
  const news = [];
  G._satDelta = 0;

  // --- tick constructions ---
  G.built.forEach(b=>{
    if(b.status==="building"){
      b.weeksLeft = Math.max(0, b.weeksLeft-4);
      if(b.weeksLeft<=0){
        b.status="active"; b.monthsSinceMaint=0; b.builtAtTurn=G.turn;
        news.push({type:"good", title:`${defOf(b.defId).emoji} ${defOf(b.defId).name} נפתח לקהל הרחב!`, sub:"עוד סיבה לבוא."});
        G.justUpgradedThisTurn = true;
      }
    } else if(b.status==="closed"){
      if(b.closedWeeksLeft!=null){
        b.closedWeeksLeft = Math.max(0,b.closedWeeksLeft-4);
        if(b.closedWeeksLeft<=0){ b.status="active"; b.monthsSinceMaint=0; news.push({type:"good", title:`${defOf(b.defId).emoji} ${defOf(b.defId).name} חזר לפעילות`, sub:"התיקון הושלם."}); }
      }
    }
    if(b.status==="active"){ b.monthsSinceMaint = (b.monthsSinceMaint||0)+1; }
  });

  // --- tick campaigns ---
  G.campaigns = G.campaigns.filter(c=>{ c.weeksLeft -= 4; return c.weeksLeft>0; });

  // --- market & demand ---
  // Demand is set by the MARKET (stars, attractions, word of mouth, price).
  // Capacity no longer creates customers — it only limits how many you can serve.
  const capacity = capacityTotal();
  const demandPerDay = marketPerDay(G.monthIdx);
  const visitorsPerDay = capacity>0 ? Math.min(demandPerDay, capacity) : 0;
  const crowding = capacity>0 ? demandPerDay/capacity : 0;
  const turnedAway = Math.round(Math.max(0, demandPerDay-capacity) * 30);
  const visitorsMonth = Math.round(visitorsPerDay * 30);
  const prevVisitors = G.lastVisitors;
  // How many heads the current ticket price won or cost us, against the
  // reference price where the demand factor is exactly 1.
  const pf = priceFactor();
  const demandAtRef = pf>0 ? demandPerDay/pf : demandPerDay;
  const visitorsAtRef = capacity>0 ? Math.round(Math.min(demandAtRef, capacity)*30) : 0;
  const priceVisitorDelta = visitorsMonth - visitorsAtRef;          // what it cost at the gate
  const priceDemandDelta = Math.round((demandPerDay-demandAtRef)*30); // what it did to demand itself

  // --- income ---
  const ticketIncome = Math.round(visitorsMonth * G.ticketPrice);
  let foodSpend = 0;
  activeBuilt("food").forEach(b=>{
    const d = defOf(b.defId);
    let s = d.spend;
    if(d.summerBoost && [5,6,7].includes(G.monthIdx)) s *= d.summerBoost;
    foodSpend += s;
  });
  const foodIncome = Math.round(visitorsMonth * foodSpend);
  const vipCount = G.built.filter(b=>b.status==="active" && defOf(b.defId).vip).length;
  const vipIncome = Math.round(visitorsMonth * 0.04 * vipCount * 45);
  let income = ticketIncome + foodIncome + vipIncome;

  // --- expenses: maintenance ---
  let maintenance = 0;
  if(diff.maintOn){
    G.built.forEach(b=>{
      if(b.status!=="active") return;
      const d = defOf(b.defId);
      let m = d.maint||0;
      if(diff.neglect && b.monthsSinceMaint>6) m *= 1.5;
      maintenance += m;
    });
    maintenance = Math.round(maintenance * (diff.opexMult||1));
  }
  let securityMonthly = 0;
  SECURITY.forEach(s=>{ if(G.security[s.id]) securityMonthly += s.monthly; });
  // payroll, arnona, admin, insurance — the costs that don't care if anyone shows up
  const oh = overheadBreakdown(G.monthIdx);
  const overhead = oh.payroll + oh.arnona + oh.admin + oh.insurance;
  let expenses = maintenance + securityMonthly + overhead;

  // --- random events ---
  const pool = buildEventPool();
  let redCandidates = pool.RED.filter(e=>e.chance>0);
  let greenCandidates = pool.GREEN.filter(e=>e.chance>0);
  if(diff.lightOnly) redCandidates = redCandidates.filter(e=>e.light);
  redCandidates = redCandidates.map(e=>({...e, chance:e.chance*diff.freqMult}));

  const triggered = [];
  function rollFrom(list){
    for(const e of list){ if(chance(e.chance)) return e; }
    return null;
  }
  const r1 = rollFrom(shuffled(redCandidates));
  const g1 = rollFrom(shuffled(greenCandidates));
  if(r1) triggered.push(r1);
  if(g1) triggered.push(g1);
  if(diff.doubleChance && chance(diff.doubleChance)){
    const extra = rollFrom(shuffled(redCandidates.filter(e=>!triggered.includes(e))));
    if(extra) triggered.push(extra);
  }

  triggered.forEach(e=>{
    const result = e.apply();
    news.push({type:e.name && pool.GREEN.includes(e)?"good":"bad", title:`${e.emoji} ${e.name}`, sub: result, headline:e.headline});
  });

  // dilemma roll (only if none pending already, small chance independent of red/green)
  let dilemma = null;
  if(chance(0.22 * diff.freqMult)){
    const candidates = DILEMMAS.filter(d=> !d.requiresSlide || hasSlideActive());
    if(candidates.length) dilemma = pick(candidates);
  }

  // --- satisfaction factors ---
  // Every factor is also written to satLog so the monthly report can say WHY
  // the score moved, instead of dropping a new number on the player.
  let pos = 0, neg = 0;
  const satLog = [];
  const bump = (label, delta)=>{
    if(!delta) return;
    if(delta>0) pos += delta; else neg += -delta;
    satLog.push({label, v:delta});
  };
  if(capacity>0){
    if(crowding<=1) bump("איזון טוב בין מבקרים לקיבולת", Math.round(SAT_W.crowdFit*(1-Math.abs(1-crowding))));
    else bump("צפיפות יתר", -clamp(Math.round((crowding-1)*SAT_W.crowdSlope),0,SAT_W.crowdMax));
  }
  const groups = new Set(G.built.filter(b=>b.status==="active").map(b=>defOf(b.defId).group).filter(Boolean));
  if(groups.size>=2) bump("מגוון מתקנים לכל הגילאים", SAT_W.variety);
  const seatCap = allBuilt("seating").filter(b=>b.status!=="closed").reduce((s,b)=>s+(defOf(b.defId).seatCap||0),0);
  if(seatCap*10 >= visitorsPerDay*0.4) bump("מספיק מקומות ישיבה", SAT_W.seating);
  const foodVariety = activeBuilt("food").length;
  if(foodVariety>=2) bump("מגוון הסעדה", SAT_W.foodVariety);
  if(G.justUpgradedThisTurn) bump("משהו חדש נפתח החודש", SAT_W.freshBuild);
  if(G.rating>G.prevRating) bump("הדירוג עלה מהחודש שעבר", SAT_W.ratingUp);

  const shadeCap = allBuilt("seating").filter(b=>b.status!=="closed" && defOf(b.defId).shade).reduce((s,b)=>s+(defOf(b.defId).seatCap||0),0);
  if([5,6,7].includes(G.monthIdx) && shadeCap*10 < visitorsPerDay*0.25) bump("אין מספיק צל בשיא הקיץ", -SAT_W.noShade);
  const anyClosed = G.built.some(b=>b.status==="closed");
  if(anyClosed) bump("מתקן סגור או מקולקל", -SAT_W.closedRide);
  if(crowding>SAT_W.queueAt) bump("תורים ארוכים", -SAT_W.queue);

  // headline attractions and security are a standing draw
  bump("מתקני הדגל של הפארק", Math.min(SAT_W.appealMax, Math.round(appealTotal()/SAT_W.appealDiv)));
  if(G.security.lifeguard||G.security.full) bump("מציל ייעודי", SAT_W.lifeguard);
  if(G.security.guards||G.security.full) bump("מאבטחים בכניסה", SAT_W.guards);

  // price perception — "יקר מדי" vs "מחיר הוגן"
  const price = G.ticketPrice||ECON.ticketDefault;
  if(price > SAT_W.priceHigh) bump("המחיר נתפס כיקר מדי", -(price-SAT_W.priceHigh)*SAT_W.pricyPerShekel);
  else if(price < SAT_W.priceLow) bump("המחיר נתפס כמשתלם", (SAT_W.priceLow-price)*SAT_W.cheapPerShekel);

  // event-driven sat deltas already applied via addSat -> _satDelta (can be + or -)
  const eventDelta = G._satDelta||0;
  if(eventDelta) satLog.push({label:"אירועי החודש", v:eventDelta});
  const satRanked = satLog.slice().sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const satUp = satRanked.filter(f=>f.v>0).slice(0,2).map(f=>({label:f.label, v:Math.round(f.v)}));
  const satDown = satRanked.filter(f=>f.v<0).slice(0,2).map(f=>({label:f.label, v:Math.round(f.v)}));
  const satBefore = G.satisfaction;

  // NOTE: the baseline is ECON.satBase, not 100. With a baseline of 100 every park
  // — even an empty one — drifted to 5 stars, which broke the whole economy.
  const factorSum = ECON.satBase + pos - neg + eventDelta;
  const newSat = clamp(G.satisfaction*0.7 + factorSum*0.3, 0, 100);

  // fold event-driven money changes already applied directly to G.money above (inside apply())
  const profit = income - expenses;
  G.money += profit;

  G.prevRating = G.rating;
  G.satisfaction = Math.round(newSat);
  G.rating = ratingFromSatisfaction(G.satisfaction);
  G.lastVisitors = visitorsMonth;
  G.cumulativeVisitors += visitorsMonth;

  const visitorsDeltaPct = prevVisitors>0 ? Math.round(((visitorsMonth-prevVisitors)/prevVisitors)*100) : null;

  G.history.push({
    turn:G.turn, monthIdx:G.monthIdx, year:G.year,
    visitors:visitorsMonth, visitorsDeltaPct,
    satisfaction:G.satisfaction, rating:G.rating,
    income, expenses, maintenance, securityMonthly, ticketIncome, foodIncome, vipIncome,
    payroll:oh.payroll, arnona:oh.arnona, admin:oh.admin, insurance:oh.insurance,
    ticketPrice:G.ticketPrice, turnedAway, capacity, demand:Math.round(demandPerDay),
    priceFactorVal:Math.round(pf*100)/100, priceVisitorDelta, priceDemandDelta,
    satBefore, satUp, satDown,
    profit, money:G.money,
  });
  if(G.history.length>36) G.history.shift();

  G.pendingEvents = news;
  G.pendingDilemma = dilemma;
  G.justUpgradedThisTurn = false;

  // advance calendar
  G.monthIdx += 1;
  if(G.monthIdx>11){ G.monthIdx=0; G.year+=1; }
  G.turn += 1;
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function checkEndConditions(){
  if(G.money < -200000 && G.winCondition!=="sandbox"){
    G.over = {type:"lose", reason:"bankrupt"};
    return true;
  }
  if(G.winCondition==="season"){
    if(G.turn > G.seasonLen){ G.over = {type:"win", reason:"season"}; return true; }
  }
  if(G.winCondition==="goal"){
    let reached=false;
    if(G.goalType==="money" && G.money>=G.goalValue) reached=true;
    if(G.goalType==="stars" && G.rating>=G.goalValue) reached=true;
    if(G.goalType==="visitors" && G.cumulativeVisitors>=G.goalValue) reached=true;
    if(reached){ G.over = {type:"win", reason:"goal"}; return true; }
  }
  return false;
}

/* =========================================================
   RENDER — root dispatcher
   ========================================================= */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!G){ app.appendChild(renderWelcome()); return; }
  if(G.over){ app.appendChild(renderGameOver()); return; }
  switch(G.screen){
    case "wizard": app.appendChild(renderWizard()); break;
    case "dashboard": app.appendChild(renderDashboard()); break;
    case "build": app.appendChild(renderBuild()); break;
    case "history": app.appendChild(renderHistory()); break;
    default: app.appendChild(renderDashboard());
  }
  // overlays
  if(G.screen==="dashboard" || G.screen==="build" || G.screen==="history"){
    if(G._showReport){ app.appendChild(renderReportOverlay()); }
    else if(G._showDilemma){ app.appendChild(renderDilemmaOverlay()); }
  }
  saveGame();
  Tour.flushTips();
}

function el(html){
  const d = document.createElement("div");

}

/* Capacity is the real bottleneck of the park, and until now it only showed up
   on the build screen. This puts next month's demand next to what we can serve,
   plus how many people we already sent home. */
function capacityCard(){
  const cap = capacityTotal();
  const last = G.history[G.history.length-1];
  const demand = Math.round(marketPerDay(G.monthIdx));
  const pct = cap>0 ? Math.min(100, Math.round(demand/cap*100)) : 0;
  const over = cap>0 && demand>cap;
  const turned = last ? (last.turnedAway||0) : 0;
  const card = el(`<div class="cap-card">
    <div class="cap-head">
      <span class="lbl">🏊 ביקוש מול קיבולת · ${MONTHS[G.monthIdx]}</span>
      <span class="cap-nums ${over?'over':''}">${demand.toLocaleString('he-IL')} מול ${cap.toLocaleString('he-IL')} ליום</span>
    </div>
    <div class="cap-bar"><div class="cap-fill ${over?'over':''}" style="width:${cap>0?pct:0}%"></div></div>
    <div class="cap-hint"></div>
  </div>`);
  const hint = card.querySelector(".cap-hint");
  if(cap<=0){
    hint.innerHTML = `אין עדיין מתקנים פעילים — אף אחד לא יכול להיכנס.`;
  } else if(over){
    hint.innerHTML = `<b style="color:var(--bad);">הפארק מלא.</b> ~${Math.round(demand-cap).toLocaleString('he-IL')} אנשים ביום לא נכנסים — וזה מוריד שביעות רצון.`;
  } else {
    hint.innerHTML = `יש מקום ל-${Math.round(cap-demand).toLocaleString('he-IL')} מבקרים נוספים ביום.`;
  }
  if(turned>0){
    hint.insertAdjacentHTML("beforeend", `<br><span style="color:var(--warn);">בחודש שעבר ${turned.toLocaleString('he-IL')} מבקרים חזרו הביתה.</span>`);
  }
  return card;
}

/* Ticket price — the player's main revenue dial.
   Cheap fills the park but invites בלאגן; steep empties it and annoys people. */
function priceCard(){
  const price = G.ticketPrice||ECON.ticketDefault;
  const card = el(`<div class="price-card">
    <div class="price-head">
      <span class="lbl">🎟️ מחיר כרטיס</span>
      <span class="price-value" id="priceVal">₪${price}</span>
    </div>
    <div class="price-row">
      <button class="price-step" id="priceDown" aria-label="הורדת מחיר">−</button>
      <input class="price-slider" id="priceSlider" type="range"
             min="${ECON.ticketMin}" max="${ECON.ticketMax}" step="1" value="${price}"
             aria-label="מחיר כרטיס בשקלים">
      <button class="price-step" id="priceUp" aria-label="העלאת מחיר">+</button>
    </div>
    <div class="price-hint" id="priceHint"></div>
  </div>`);

  const valEl   = card.querySelector("#priceVal");
  const hintEl  = card.querySelector("#priceHint");
  const slider  = card.querySelector("#priceSlider");
  const btnDown = card.querySelector("#priceDown");
  const btnUp   = card.querySelector("#priceUp");

  function refresh(){
    const p = G.ticketPrice;
    valEl.textContent = `₪${p}`;
    slider.value = p;
    btnDown.disabled = p<=ECON.ticketMin;
    btnUp.disabled   = p>=ECON.ticketMax;

    const cap    = capacityTotal();
    const demand = Math.round(marketPerDay(G.monthIdx));

    let tag;
    if(p < 25)      tag = `<span class="price-tag cheap">זול</span> קהל גדול וקצת פרוע.`;
    else if(p > 40) tag = `<span class="price-tag steep">יקר</span> יותר מכל ראש, פחות סבלנות בביקורות.`;
    else            tag = `<span class="price-tag fair">בינוני</span> אף אחד לא מתלונן.`;

    // The real lesson: the right price depends on whether capacity is the bottleneck.
    let load;
    if(cap<=0){
      load = "אין עדיין מתקנים פעילים — המחיר לא משנה עד שתבנו משהו.";
    } else if(demand > cap*1.05){
      const away = Math.round((demand-cap)*30).toLocaleString('he-IL');
      load = `ביקוש <b>${demand.toLocaleString('he-IL')}</b>/יום מול קיבולת <b>${cap.toLocaleString('he-IL')}</b> — `
           + `<span style="color:var(--warn)">${away} אנשים יחזרו הביתה החודש</span>. `
           + `<b style="color:var(--good)">כדאי להעלות מחיר או להרחיב.</b>`;
    } else if(demand < cap*0.8){
      const pct = Math.round(demand/cap*100);
      load = `ביקוש <b>${demand.toLocaleString('he-IL')}</b>/יום — רק <b>${pct}%</b> מהקיבולת, `
           + `ואת המשכורות משלמים בכל מקרה. <b style="color:var(--good)">כדאי להוריד מחיר.</b>`;
    } else {
      const pct = Math.round(demand/cap*100);
      load = `ביקוש <b>${demand.toLocaleString('he-IL')}</b>/יום — <b>${pct}%</b> מהקיבולת. `
           + `<b style="color:var(--good)">מחיר מכויל יפה.</b>`;
    }
    hintEl.innerHTML = `${tag}<br>${load}`;
  }

  function setPrice(v){

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function sparkline(values, light){
  if(values.length<2){ return el(`<div class="small" style="color:${light?'rgba(255,255,255,.85)':'var(--dim)'};text-shadow:${light?'0 1px 4px rgba(3,26,40,.3)':'none'};">עוד אין מספיק נתונים.</div>`); }
  const w=480,h=60,pad=4;
  const max=Math.max(...values,1), min=Math.min(...values,0);
  const range = (max-min)||1;
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1))*(w-pad*2);
    const y = h-pad - ((v-min)/range)*(h-pad*2);
    return `${x},${y}`;
  }).join(" ");
  const stroke = light? "#ffffff" : "#ff6b4a";
  const svg = el(`<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 1px 3px rgba(3,26,40,.3));"/>
  </svg>`);
  return svg;
}

function catColor(cat){
  return ({facility:"var(--accent)", food:"var(--coral)", seating:"var(--violet)", expansion:"var(--leaf)", marketing:"var(--pink)", security:"var(--slate)"})[cat] || "var(--border)";
}

function availableCard(d){
  const used = allSlotsUsed();
  const needsSlot = (d.slots||0) > 0;
  const noSpace = needsSlot && (used + d.slots > totalSlots());
  const noMoney = G.money < d.cost;
  const disabled = noSpace || noMoney;
  let extra = "";
  if(d.id==="umbrellas"){ extra = ` · ₪16,500 ליחידה (כאן = 4 יח')`; }
  // What this costs you every single month, and how much new demand it pulls in.
  const runPayroll = d.capacity? Math.ceil(d.capacity/ECON.lifeguardPer)*ECON.lifeguardCost
                              + Math.ceil(d.capacity/ECON.staffPer)*ECON.staffCost : 0;
  const runFixed = (d.maint||0) + (d.capacity||0)*ECON.arnonaPerCapacity;
  const runMonthly = runFixed + runPayroll;
  // Payroll shrinks to a skeleton crew in winter, arnona and maintenance don't.
  const runWinter = Math.round(runFixed + runPayroll*ECON.staffFloor);
  const runLine = runMonthly>0
    ? `<div class="item-meta" style="color:var(--bad);">💸 עד ${fmtMoney(runMonthly)}/חודש בשיא העונה · ${fmtMoney(runWinter)} בחורף</div>` : "";
  const drawLine = d.appeal
    ? `<div class="item-meta" style="color:var(--good);">🧲 מושך ~${Math.round(d.appeal*ECON.appealScale)} מבקרים/יום נוספים לשוק</div>` : "";
  const card = el(`<div class="item-card ${disabled?'disabled':''}" style="border-inline-start-color:${catColor(d.cat)};">
    <div class="item-title">${d.emoji} ${d.name}</div>
    <div class="item-meta">${fmtMoney(d.cost)} · ${d.weeks>0?Math.ceil(d.weeks/4)+' חודשים בנייה':'זמין מיידית'}${d.capacity?` · קיבולת ${d.capacity}/יום`:''}${needsSlot?` · ${d.slots} יח' שטח`:''}${extra}</div>
    ${drawLine}${runLine}
    <div class="item-actions"></div>
  </div>`);
  const btn = el(`<button class="btn btn-sm ${disabled?'btn-ghost':'btn-accent'} btn-block">🔨 בנה</button>`);
  btn.disabled = disabled;
  on(btn,"click",()=>{
    if(disabled) return;
    G.money -= d.cost;
    const b = {defId:d.id, status: d.weeks>0?"building":"active", weeksLeft:d.weeks, monthsSinceMaint:0, builtAtTurn:G.turn};
    if(d.weeks<=0) G.justUpgradedThisTurn = true;
    if(d.id==="extra_dunam"){ /* built triggers capacity via effect below on completion */ }
    G.built.push(b);
    toast(`🔨 בונים ${d.name}...`);
    render();
    if(d.weeks>0) Tour.trigger("FIRST_CONSTRUCTION_START");
  });
  card.querySelector(".item-actions").appendChild(btn);
  if(noSpace) card.querySelector(".item-meta").insertAdjacentHTML("beforeend", ` · <span style="color:var(--bad);">אין שטח פנוי</span>`);
  return card;
}

        <span style="font-weight:800;font-size:13.5px;">${h.satBefore!=null?`${h.satBefore} → `:''}${h.satisfaction}
          ${satDelta!=null?`<span style="color:${dColor};">(${satDelta>=0?'+':''}${satDelta})</span>`:''}</span>
      </div>
      <div class="stack gap4" style="margin-top:9px;"></div>
    </div>`);
    const rows = satBox.querySelector(".stack");
    (h.satUp||[]).forEach(f=>rows.appendChild(el(`<div class="sat-row"><span class="up">↑ ${f.label}</span><span class="up">+${f.v}</span></div>`)));
    (h.satDown||[]).forEach(f=>rows.appendChild(el(`<div class="sat-row"><span class="down">↓ ${f.label}</span><span class="down">${f.v}</span></div>`)));
    if(!(h.satUp||[]).length && !(h.satDown||[]).length){
      rows.appendChild(el(`<div class="muted small">חודש בלי אירועים מיוחדים.</div>`));
    }
    const more = el(`<button class="tour-more" style="margin-top:6px;">הסבר מלא ←</button>`);
    on(more,"click",()=>Tour.openGlossary("satisfaction"));
    satBox.appendChild(more);
    sheet.appendChild(satBox);
  }

  // financial breakdown (collapsible)
  const finBox = el(`<div class="card" data-tour="report-financials" style="margin-top:14px;"></div>`);
  const finHeader = el(`<div class="row-between" style="cursor:pointer;"><span style="font-weight:700;font-size:13.5px;">💵 פירוט כספי</span><span id="finArrow">${G.quickUI?'▼':'▲'}</span></div>`);
  const finBody = el(`<div class="stack" style="margin-top:10px;"></div>`);
  finBody.appendChild(el(`<div class="finance-row"><span class="muted">🎟️ כרטיסים <span style="opacity:.7">(₪${h.ticketPrice??ECON.ticketDefault})</span></span><span>${fmtMoney(h.ticketIncome)}</span></div>`));
  if(h.priceFactorVal!=null && h.priceFactorVal!==1){
    let label = `↳ מקדם מחיר ×${h.priceFactorVal}`, value, color;
    if(h.priceVisitorDelta){
      const up = h.priceVisitorDelta>0;
      value = `${up?'+':''}${h.priceVisitorDelta.toLocaleString('he-IL')} מבקרים`;
      color = up? 'var(--good)' : 'var(--bad)';
    } else {
      // demand was above capacity either way — the price cost nothing at the gate
      label += ` <span style="opacity:.7">(הקיבולת חסמה ממילא)</span>`;
      value = "0 מבקרים";
      color = 'var(--dim)';
    }
    finBody.appendChild(el(`<div class="finance-row"><span class="muted" style="padding-inline-start:14px;">${label}</span><span style="color:${color}">${value}</span></div>`));
  }
  finBody.appendChild(el(`<div class="finance-row"><span class="muted">🍔 הסעדה</span><span>${fmtMoney(h.foodIncome)}</span></div>`));
  finBody.appendChild(el(`<div class="finance-row"><span class="muted">💎 VIP</span><span>${fmtMoney(h.vipIncome)}</span></div>`));
  const outRow = (label,val)=>`<div class="finance-row"><span class="muted">${label}</span><span style="color:var(--bad)">-${fmtMoney(val)}</span></div>`;
  finBody.appendChild(el(outRow(`🧑‍✈️ שכר עובדים <span style="opacity:.7">(${staffCounts().lifeguards} מצילים · ${staffCounts().staff} עובדים)</span>`, h.payroll||0)));
  finBody.appendChild(el(outRow("🔧 תחזוקה", h.maintenance)));
  finBody.appendChild(el(outRow("🏛️ ארנונה", h.arnona||0)));
  finBody.appendChild(el(outRow(`📋 ביטוח${G.turn < (G.insuranceSpikeUntil||0) ? ' <span style="opacity:.7">(מוטען אחרי תאונה)</span>' : ''}`, h.insurance||0)));
  finBody.appendChild(el(outRow("🗄️ מנהלה ורישוי", h.admin||0)));
  finBody.appendChild(el(outRow("🛡️ אבטחה", h.securityMonthly)));
  finBody.appendChild(el(`<div class="finance-row total"><span>רווח נקי</span><span style="color:${h.profit>=0?'var(--good)':'var(--bad)'}">${fmtMoney(h.profit)}</span></div>`));
  if(h.turnedAway>0){
    finBody.appendChild(el(`<div class="finance-row" style="border-top:1px dashed var(--border);margin-top:6px;padding-top:8px;"><span class="muted">🚧 נשלחו הביתה (אין מקום)</span><span style="color:var(--warn)">${h.turnedAway.toLocaleString('he-IL')}</span></div>`));
  }
  finBody.style.display = G.quickUI ? "none" : "flex";
  finBox.appendChild(finHeader); finBox.appendChild(finBody);
  on(finHeader,"click",()=>{
    const showing = finBody.style.display!=="none";
    finBody.style.display = showing?"none":"flex";
    finHeader.querySelector("#finArrow").textContent = showing?"▼":"▲";
  });
  sheet.appendChild(finBox);

  // hot news
  if(G.pendingEvents.length){
    sheet.appendChild(el(`<div class="section-title" style="margin:16px 0 8px;padding:0;">🗞️ הידיעות החמות</div>`));
    const newsStack = el(`<div class="stack gap8"></div>`);
    G.pendingEvents.forEach(n=>{
      const card = el(`<div class="news-card ${n.type==='bad'?'bad':(n.type==='good'?'good':'')}">
        <div class="news-title">${n.headline?n.headline:n.title}</div>
        <div class="news-sub">${n.headline?n.title+' — ':''}${n.sub}</div>
      </div>`);
      newsStack.appendChild(card);
    });
    sheet.appendChild(newsStack);
  } else {
    sheet.appendChild(el(`<div class="muted small center" style="margin-top:16px;">חודש שקט. אף אחד לא רב על כיסא הפעם. 🙏</div>`));
  }

  if(!G.quickUI){
    sheet.appendChild(el(`<div class="section-title" style="padding:0;margin:18px 0 6px;">📈 מגמה — 6 חודשים אחרונים</div>`));
    sheet.appendChild(sparkline(G.history.slice(-6).map(x=>x.visitors)));
  }

  const cont = el(`<button class="btn btn-primary btn-lg btn-block" style="margin-top:20px;">המשך ➡️</button>`);
  on(cont,"click",()=>{
    G._showReport = false;
    G.pendingEvents = [];
    if(checkEndConditions()){ render(); return; }
    render();
  });
  sheet.appendChild(cont);

  Tour.trigger("FIRST_MONTHLY_REPORT");

  return overlay;
}

/* =========================================================
   GAME OVER / WIN
   ========================================================= */
function renderGameOver(){
  const win = G.over.type==="win";
  const outer = el(`<div class="screen scene-host">
    <div class="scene-backdrop">${SCENE_SVG}</div>
    <div class="scene-content px" style="justify-content:center;padding-top:60px;display:flex;flex-direction:column;flex:1;"></div>
  </div>`);
  const wrap = outer.querySelector(".scene-content");
  wrap.appendChild(el(`<div class="logo-hero">${win?'🏆':'💧😢'}</div>`));
  wrap.appendChild(el(`<div class="title-xl">${win?'ניצחתם!':'המשחק נגמר'}</div>`));
  let msg = "";
  if(win && G.over.reason==="season") msg = `${G.parkName} שרד עונה שלמה בלי לפשוט רגל! מנהל/ת השנה: ${G.managerName}.`;
  if(win && G.over.reason==="goal") msg = `${G.parkName} הגיע ליעד שהוגדר! כל הכבוד, ${G.managerName}.`;
  if(!win) msg = `${G.parkName} פשט את הרגל אחרי ${G.turn-1} חודשים. אולי בפעם הבאה פחות מגלשות "פחד מוות".`;
  wrap.appendChild(el(`<div class="subtitle">${msg}</div>`));

  const stat = el(`<div class="card stack gap8" style="margin-top:24px;"></div>`);
  [["💰 כסף סופי", fmtMoney(G.money)],["⭐ דירוג סופי", stars(G.rating)],["👥 סה״כ מבקרים", G.cumulativeVisitors.toLocaleString('he-IL')],["📅 חודשים שרדו", G.turn-1]]
    .forEach(([k,v])=>stat.appendChild(el(`<div class="row-between"><span class="muted small">${k}</span><span style="font-weight:800;">${v}</span></div>`)));
  wrap.appendChild(stat);

  // what actually happened over the season — peak, trough, and where it all went
  if(G.history.length){
    const hs = G.history;
    const peak = hs.reduce((a,b)=>b.money>a.money?b:a);
    const low  = hs.reduce((a,b)=>b.money<a.money?b:a);
    const best = hs.reduce((a,b)=>b.visitors>a.visitors?b:a);
    const costs = {payroll:"🧑‍✈️ שכר עובדים", maintenance:"🔧 תחזוקה", arnona:"🏛️ ארנונה",
                   insurance:"📋 ביטוח", admin:"🗄️ מנהלה", securityMonthly:"🛡️ אבטחה"};
    const totals = Object.keys(costs).map(k=>[k, hs.reduce((s,x)=>s+(x[k]||0),0)]).sort((a,b)=>b[1]-a[1]);
    const summary = el(`<div class="card stack gap8" style="margin-top:14px;"></div>`);
    summary.appendChild(el(`<div style="font-weight:800;font-size:13.5px;">📖 מה קרה לכסף שלך</div>`));
    [
      ["📈 שיא בקופה", `${fmtMoney(peak.money)} · ${MONTHS[peak.monthIdx]}`],
      ["📉 שפל בקופה", `${fmtMoney(low.money)} · ${MONTHS[low.monthIdx]}`],
      ["🔥 החודש הכי חזק", `${best.visitors.toLocaleString('he-IL')} מבקרים · ${MONTHS[best.monthIdx]}`],
      ["💸 ההוצאה הגדולה", `${costs[totals[0][0]]} — ${fmtMoney(totals[0][1])}`],
    ].forEach(([k,v])=>summary.appendChild(el(`<div class="row-between"><span class="muted small">${k}</span><span style="font-weight:700;font-size:12.5px;">${v}</span></div>`)));
    wrap.appendChild(summary);
  }

  const btn = el(`<button class="btn btn-primary btn-lg btn-block" style="margin-top:24px;">🆕 משחק חדש</button>`);
  on(btn,"click",()=>{
    clearSave();
    G = {screen:"wizard", step:0, draft:{managerName:G.managerName, parkName:"", winCondition:"season", difficulty:"normal", pace:"fast", goalType:"money", goalValue:5000000}};
    render();
  });
  wrap.appendChild(btn);
  return outer;
}

const _resolveMonthOriginal = resolveMonth;
resolveMonth = function(){
  _resolveMonthOriginal();
  // grant slots for any extra_dunam that just became active
  G.built.forEach(b=>{
    if(b.defId==="extra_dunam" && b.status==="active" && !b.slotsGranted){
      G.extraSlots += 4;
      b.slotsGranted = true;
    }
  });
};

   away from the actual balance.

const TOUR_KEY = "waterpark_tour_state";
const TOUR_VERSION = 2;

let tourState = (function loadTourState(){
  const fresh = {version:TOUR_VERSION, seenSteps:[], toursCompleted:[], tipsDisabled:false};
  try{
    const raw = localStorage.getItem(TOUR_KEY);
    if(!raw) return fresh;
    const s = JSON.parse(raw);
    if(!s || typeof s!=="object" || s.version!==TOUR_VERSION) return fresh;
    return {
      version: TOUR_VERSION,
      seenSteps: Array.isArray(s.seenSteps)? s.seenSteps : [],
      toursCompleted: Array.isArray(s.toursCompleted)? s.toursCompleted : [],
      tipsDisabled: !!s.tipsDisabled,
    };
  }catch(e){ return fresh; }
})();
function saveTourState(){ try{ localStorage.setItem(TOUR_KEY, JSON.stringify(tourState)); }catch(e){} }

/* =========================================================
   ONBOARDING — the engine.
   Generic spotlight tour: it highlights one element, dims the
   rest and points a bubble at it. It knows nothing about the
   content above — steps are plain data, wired to the DOM only
   through data-tour attributes.
   ========================================================= */
const Tour = (function(){
  let steps=[], idx=0, mode="tour", tourId=null, session=0;
  let overlay=null, hole=null, bubble=null, arrowEl=null;
  let rafId=null, lastKey="", paused=false;
  let tipQueue=[], flushTimer=null;

  /* ---------- targets ---------- */
  function isUsable(node){
    if(!node || !node.isConnected) return false;
    const r = node.getBoundingClientRect();
    if(r.width<=0 || r.height<=0) return false;
    const st = window.getComputedStyle(node);
    return st.visibility!=="hidden" && st.display!=="none" && st.opacity!=="0";
  }
  function findTarget(sel){
    try{ const n = document.querySelector(sel); return isUsable(n)? n : null; }catch(e){ return null; }
  }
  // A step may fire slightly before its element is rendered.
  function waitForTarget(sel, ms){
    return new Promise(resolve=>{
      const now = findTarget(sel);
      if(now) return resolve(now);
      let settled = false;
      const done = (v)=>{ if(settled) return; settled=true; obs.disconnect(); clearTimeout(timer); resolve(v); };
      const obs = new MutationObserver(()=>{ const n = findTarget(sel); if(n) done(n); });
      obs.observe(document.body,{childList:true, subtree:true, attributes:true});
      const timer = setTimeout(()=>done(findTarget(sel)), ms);
    });
  }
  // rAF is throttled to a standstill in a background tab — never hang on it.
  const nextFrame = ()=> new Promise(r=>{
    let done = false;
    const fire = ()=>{ if(done) return; done = true; r(); };
    requestAnimationFrame(fire);
    setTimeout(fire, 80);
  });
  const wait = (ms)=> new Promise(r=>setTimeout(r, ms));

  /* ---------- text ---------- */
  function interpolate(text){
    return String(text==null?"":text).replace(/\{\{(\w+)\}\}/g,(m,key)=>{
      if(!G) return "";
      if(key==="money") return fmtMoney(G.money);
      if(key==="difficulty") return (DIFFICULTY[G.difficulty]||{}).label||"";
      const v = G[key];
      return (v==null)? "" : escapeHtml(String(v));
    });
  }
  function bodyFor(step){
    const byDiff = step.bodyByDifficulty;
    if(byDiff && G && byDiff[G.difficulty]) return byDiff[G.difficulty];
    return step.body;
  }
  function markSeen(id){
    if(!id || tourState.seenSteps.includes(id)) return;
    tourState.seenSteps.push(id); saveTourState();
  }

  /* ---------- dom ---------- */
  function ensureDom(){
    if(overlay) return;
    overlay = el(`<div class="tour-overlay"></div>`);
    hole = el(`<div class="tour-hole"></div>`);
    overlay.appendChild(hole);
    document.body.appendChild(overlay);
    bubble = el(`<div class="tour-bubble" role="dialog" aria-modal="true" aria-live="polite"></div>`);
    document.body.appendChild(bubble);
    document.addEventListener("keydown", onKey, true);
  }
  function teardown(){
    document.removeEventListener("keydown", onKey, true);
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(overlay){ overlay.remove(); }
    if(bubble){ bubble.remove(); }
    overlay=null; hole=null; bubble=null; arrowEl=null; lastKey=""; paused=false;
  }

  function buildBubble(step){
    bubble.innerHTML = "";
    arrowEl = el(`<div class="tour-arrow"><i></i></div>`);
    bubble.appendChild(arrowEl);
    bubble.appendChild(el(`<div class="tour-head">${step.icon?`<span>${step.icon}</span>`:""}<span>${interpolate(step.title)}</span></div>`));
    bubble.appendChild(el(`<div class="tour-body">${interpolate(bodyFor(step))}</div>`));

    if(step.effects && (step.effects.up || step.effects.down)){
      const fx = el(`<div class="tour-fx"></div>`);
      if(step.effects.up && step.effects.up.length) fx.appendChild(el(`<div class="fx-up">↑ ${step.effects.up.join(" · ")}</div>`));
      if(step.effects.down && step.effects.down.length) fx.appendChild(el(`<div class="fx-down">↓ ${step.effects.down.join(" · ")}</div>`));
      bubble.appendChild(fx);
    }
    if(step.glossaryKey && GLOSSARY.some(g=>g.key===step.glossaryKey)){
      const more = el(`<button class="tour-more">הסבר מלא ←</button>`);
      on(more,"click",()=>openGlossary(step.glossaryKey));
      bubble.appendChild(more);
    }

    const foot = el(`<div class="tour-foot"></div>`);
    const btns = el(`<div class="tour-btns"></div>`);
    if(mode==="tour" && idx>0){
      const prev = el(`<button class="btn btn-sm btn-ghost">◀️ הקודם</button>`);
      on(prev,"click",()=>go(-1));
      btns.appendChild(prev);
    }
    const last = idx >= steps.length-1;
    const label = mode==="tip" ? "הבנתי 👍" : (last ? "יאללה, בוא נתחיל 🏊" : "הבא ➡️");
    const next = el(`<button class="btn btn-sm btn-accent" id="tourNext">${label}</button>`);
    on(next,"click",()=>go(1));
    btns.appendChild(next);
    foot.appendChild(btns);

    const meta = el(`<div class="tour-meta"></div>`);
    if(mode==="tour"){
      meta.appendChild(el(`<span class="tour-count">${idx+1}/${steps.length}</span>`));
      const skip = el(`<button class="tour-skip">דלג על ההדרכה</button>`);
      on(skip,"click",askSkip);
      meta.appendChild(skip);
    }
    foot.appendChild(meta);
    bubble.appendChild(foot);
  }

  /* ---------- positioning ---------- */
  function calcPos(p, r, bw, bh, vw, vh, M, GAP){
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if(p==="bottom") return {left:clamp(cx-bw/2, M, vw-bw-M), top:r.bottom+GAP};
    if(p==="top")    return {left:clamp(cx-bw/2, M, vw-bw-M), top:r.top-bh-GAP};
    if(p==="left")   return {left:r.left-bw-GAP, top:clamp(cy-bh/2, M, vh-bh-M)};
    if(p==="right")  return {left:r.right+GAP, top:clamp(cy-bh/2, M, vh-bh-M)};
    return null;
  }
  function placeArrow(p, r, bl, bt, bw, bh){
    if(!arrowEl) return;
    arrowEl.style.display = "";
    arrowEl.className = "tour-arrow";
    arrowEl.style.left = ""; arrowEl.style.top = "";
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if(p==="bottom" || p==="top"){
      arrowEl.classList.add(p==="bottom" ? "at-top" : "at-bottom");
      arrowEl.style.left = clamp(cx-bl-8, 16, Math.max(16, bw-32)) + "px";
    } else {
      arrowEl.classList.add(p==="left" ? "at-right" : "at-left");
      arrowEl.style.top = clamp(cy-bt-8, 16, Math.max(16, bh-32)) + "px";
    }
  }
  function place(){
    const step = steps[idx];
    if(!step || !bubble || !hole) return;
    const t = findTarget(step.target);
    if(!t) return;
    const r = t.getBoundingClientRect();
    const pad = (step.spotlightPadding!=null) ? step.spotlightPadding : 8;
    hole.style.left = Math.max(0, r.left-pad)+"px";
    hole.style.top = Math.max(0, r.top-pad)+"px";
    hole.style.width = (r.width+pad*2)+"px";
    hole.style.height = (r.height+pad*2)+"px";

    const vw = window.innerWidth, vh = window.innerHeight, M = 12, GAP = 14;
    bubble.classList.remove("as-sheet");
    bubble.style.left = ""; bubble.style.top = "";
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    const hogsScreen = (r.width*r.height) > (vw*vh*0.4);

    let chosen = null;
    if(vh>=600 && vw>=360 && !hogsScreen){
      const order = [];
      [step.placement,"bottom","top","left","right"].forEach(p=>{ if(p && order.indexOf(p)<0) order.push(p); });
      for(const p of order){
        const pos = calcPos(p, r, bw, bh, vw, vh, M, GAP);
        if(pos && pos.left>=M && pos.left+bw<=vw-M && pos.top>=M && pos.top+bh<=vh-M){ chosen = {p, left:pos.left, top:pos.top}; break; }
      }
    }
    if(chosen){
      bubble.style.left = Math.round(chosen.left)+"px";
      bubble.style.top = Math.round(chosen.top)+"px";
      placeArrow(chosen.p, r, chosen.left, chosen.top, bw, bh);
    } else {
      // nothing fits, tiny screen, or the target eats the viewport → bottom sheet
      bubble.classList.add("as-sheet");
      bubble.style.left = ""; bubble.style.top = "";
      if(arrowEl) arrowEl.style.display = "none";
    }
  }
  // The target may move (scroll, layout, a re-render). Follow it.
  function track(){
    rafId = requestAnimationFrame(track);
    if(paused || !bubble) return;
    const step = steps[idx];
    if(!step) return;
    const t = findTarget(step.target);
    if(!t) return;
    const r = t.getBoundingClientRect();
    const key = [Math.round(r.left),Math.round(r.top),Math.round(r.width),Math.round(r.height),window.innerWidth,window.innerHeight].join(",");
    if(key!==lastKey){ lastKey = key; place(); }
  }

  /* ---------- flow ---------- */
  async function enter(){
    const my = ++session;
    const step = steps[idx];
    if(!step){ finish(); return; }
    if(typeof step.condition === "function"){
      let ok = false;
      try{ ok = !!step.condition(G); }catch(e){ ok = false; }
      if(!ok){ go(1); return; }
    }
    let t = findTarget(step.target);
    if(!t && step.waitForTarget) t = await waitForTarget(step.target, 3000);
    if(my!==session) return;
    if(!t){ console.warn("[tour] target missing, skipping step:", step.id, step.target); go(1); return; }

    ensureDom();
    bubble.style.visibility = "hidden";
    try{ t.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){ try{ t.scrollIntoView(); }catch(e2){} }
    await nextFrame();
    await wait(350);
    if(my!==session || !bubble) return;
    if(!findTarget(step.target)){ go(1); return; }

    buildBubble(step);
    lastKey = "";
    place();
    bubble.style.visibility = "";
    markSeen(step.id);
    if(!rafId) track();
    const nb = bubble.querySelector("#tourNext");
    if(nb){ try{ nb.focus({preventScroll:true}); }catch(e){ nb.focus(); } }
  }
  function go(dir){
    const next = idx + dir;
    if(next < 0){ idx = 0; enter(); return; }
    if(next >= steps.length){ finish(); return; }
    idx = next;
    enter();
  }
  function finish(){
    if(mode==="tour" && tourId && !tourState.toursCompleted.includes(tourId)){
      tourState.toursCompleted.push(tourId);
      saveTourState();
    }
    close();
  }
  function close(){
    session++;
    steps = []; idx = 0; tourId = null;
    teardown();
    scheduleFlush();
  }
  function startSteps(list, m, id){
    if(!list || !list.length) return;
    session++;
    teardown();
    steps = list.slice(); idx = 0; mode = m; tourId = id;
    enter();
  }
  function start(id){
    const list = TOUR_STEPS[id];
    if(!list){ console.warn("[tour] unknown tour:", id); return; }
    startSteps(list, "tour", id);
  }

  function askSkip(){
    const ov = el(`<div class="overlay" style="z-index:10001;"><div class="sheet">
      <div class="sheet-handle"></div>
      <div class="title-xl on-card" style="font-size:18px;">לדלג על ההדרכה?</div>
      <div class="subtitle on-card" style="margin-top:8px;">תמיד אפשר להחזיר אותה מכפתור ה-❓ שבראש המסך.</div>
      <label class="row gap8 card" style="margin-top:16px;padding:12px 14px;align-items:center;cursor:pointer;">
        <input type="checkbox" id="tourNoTips" style="width:18px;height:18px;flex:0 0 auto;">
        <span style="font-size:13.5px;font-weight:700;">אל תציג לי טיפים בהמשך המשחק</span>
      </label>
      <div class="stack gap8" style="margin-top:16px;">
        <button class="btn btn-primary btn-block" id="tourSkipYes">כן, דלג</button>
        <button class="btn btn-ghost btn-block" id="tourSkipNo">חזרה להדרכה</button>
      </div>
    </div></div>`);
    document.body.appendChild(ov);
    on(ov.querySelector("#tourSkipYes"),"click",()=>{
      if(ov.querySelector("#tourNoTips").checked){
        tourState.tipsDisabled = true;
        tipQueue = [];
      }
      steps.forEach(s=>markSeen(s.id));
      saveTourState();
      ov.remove();
      finish();
    });
    on(ov.querySelector("#tourSkipNo"),"click",()=>ov.remove());
    on(ov,"click",(e)=>{ if(e.target===ov) ov.remove(); });
  }

  /* ---------- glossary ---------- */
  function glTable(title, rows, cls){
    const box = el(`<div class="gl-table ${cls||""}"></div>`);
    box.appendChild(el(`<div class="gl-tr gl-th"><span>${title}</span><span></span></div>`));
    (rows||[]).forEach(r=>{
      box.appendChild(el(`<div class="gl-tr"><span>${r.label}</span>${r.weight?`<span class="gl-w">${r.weight}</span>`:""}</div>`));
    });
    return box;
  }
  function glossaryItem(entry, open){
    const item = el(`<div class="gl-item ${open?"open":""}"></div>`);
    item.dataset.key = entry.key;
    const head = el(`<div class="gl-head"><span>${entry.icon}</span><span>${entry.title}</span><span class="gl-chev">${open?"▲":"▼"}</span></div>`);
    const body = el(`<div class="gl-body"></div>`);
    body.appendChild(el(`<div class="gl-def">${entry.definition}</div>`));
    if(entry.up) body.appendChild(glTable("↑ מה מעלה", entry.up, "gl-up"));
    if(entry.down) body.appendChild(glTable("↓ מה מוריד", entry.down, "gl-down"));
    (entry.tables||[]).forEach(t=>body.appendChild(glTable(t.title, t.rows, "")));
    if(entry.note) body.appendChild(el(`<div class="gl-note">🧑‍💼 <b>הערת מנהל:</b> ${entry.note}</div>`));
    body.style.display = open ? "" : "none";
    on(head,"click",()=>{
      const nowOpen = body.style.display === "none";
      const list = item.parentElement;
      if(list){
        list.querySelectorAll(".gl-item").forEach(other=>{
          if(other===item) return;
          other.classList.remove("open");
          const b = other.querySelector(".gl-body"); if(b) b.style.display = "none";
          const c = other.querySelector(".gl-chev"); if(c) c.textContent = "▼";
        });
      }
      body.style.display = nowOpen ? "" : "none";
      item.classList.toggle("open", nowOpen);
      head.querySelector(".gl-chev").textContent = nowOpen ? "▲" : "▼";
    });
    item.appendChild(head);
    item.appendChild(body);
    return item;
  }
  function openGlossary(key){
    const cameFromTour = !!overlay;
    if(cameFromTour) pause();
    const ov = el(`<div class="overlay" style="z-index:10000;"><div class="sheet"></div></div>`);
    const sheet = ov.querySelector(".sheet");
    sheet.appendChild(el(`<div class="sheet-handle"></div>`));
    sheet.appendChild(el(`<div class="row-between"><div style="font-weight:800;font-size:17px;">📖 מילון מונחים</div><button class="icon-btn" id="glClose">✕</button></div>`));
    const list = el(`<div class="gl-list"></div>`);
    GLOSSARY.forEach(entry=>list.appendChild(glossaryItem(entry, key===entry.key)));
    sheet.appendChild(list);
    sheet.appendChild(el(`<div style="height:10px;"></div>`));
    document.body.appendChild(ov);
    const closeGl = ()=>{ ov.remove(); if(cameFromTour) resume(); };
    on(ov.querySelector("#glClose"),"click",closeGl);
    on(ov,"click",(e)=>{ if(e.target===ov) closeGl(); });
    if(key){
      const opened = list.querySelector(`.gl-item[data-key="${key}"]`);
      if(opened) requestAnimationFrame(()=>opened.scrollIntoView({block:"start", behavior:"smooth"}));
    }
  }
  function pause(){
    paused = true;
    if(overlay) overlay.style.display = "none";
    if(bubble) bubble.style.display = "none";
  }
  function resume(){
    paused = false;
    if(overlay) overlay.style.display = "";
    if(bubble) bubble.style.display = "";
    lastKey = "";
    place();
  }

  /* ---------- help menu (the ❓ button) ---------- */
  function openHelp(){
    const ov = el(`<div class="overlay" style="z-index:10000;"><div class="sheet">
      <div class="sheet-handle"></div>
      <div class="title-xl on-card" style="font-size:18px;">❓ עזרה</div>
      <div class="stack gap12" style="margin-top:16px;">
        <button class="btn btn-accent btn-block" id="helpTour">▶️ הפעל את הסיור מחדש</button>
        <button class="btn btn-ghost btn-block" id="helpGloss">📖 מילון מונחים</button>
        <button class="btn btn-ghost btn-block" id="helpTips">${tourState.tipsDisabled?"🔔 הפעל טיפים בחזרה":"🔕 כבה טיפים"}</button>
        <button class="btn btn-ghost btn-block" id="helpClose">סגירה</button>
      </div>
    </div></div>`);
    document.body.appendChild(ov);
    on(ov.querySelector("#helpTour"),"click",()=>{ ov.remove(); start("opening"); });
    on(ov.querySelector("#helpGloss"),"click",()=>{ ov.remove(); openGlossary(null); });
    on(ov.querySelector("#helpTips"),"click",()=>{
      tourState.tipsDisabled = !tourState.tipsDisabled;
      if(tourState.tipsDisabled) tipQueue = [];
      saveTourState();
      ov.remove();
      toast(tourState.tipsDisabled? "טיפים כבויים 🔕" : "טיפים פעילים 🔔");
    });
    on(ov.querySelector("#helpClose"),"click",()=>ov.remove());
    on(ov,"click",(e)=>{ if(e.target===ov) ov.remove(); });
  }

  /* ---------- contextual tips ---------- */
  function trigger(name){
    if(tourState.tipsDisabled) return;
    const tip = TIPS.find(t=>t.trigger===name);
    if(!tip) return;
    if(tourState.seenSteps.includes(tip.id) || tipQueue.includes(tip.id)) return;
    tipQueue.push(tip.id);
    scheduleFlush();
  }
  function scheduleFlush(){
    if(flushTimer) return;
    flushTimer = setTimeout(()=>{ flushTimer = null; flushTips(); }, 420);
  }
  function flushTips(){
    if(overlay || !G || G.over || tourState.tipsDisabled) return;
    if(G._tipTurn === G.turn) return;           // at most one tip per game month
    tipQueue = tipQueue.filter(id=>{
      const tip = TIPS.find(t=>t.id===id);
      return tip && !tourState.seenSteps.includes(id);
    });
    // First tip whose element is actually on screen wins. The rest keep their
    // place in line and get their turn when their screen comes back.
    const i = tipQueue.findIndex(id=>findTarget(TIPS.find(t=>t.id===id).target));
    if(i<0) return;
    const id = tipQueue.splice(i,1)[0];
    const tip = TIPS.find(t=>t.id===id);
    G._tipTurn = G.turn;
    startSteps([tip], "tip", null);
  }
  function showTip(id){
    if(tourState.tipsDisabled) return;
    const tip = TIPS.find(t=>t.id===id);
    if(!tip || tourState.seenSteps.includes(tip.id)) return;
    startSteps([tip], "tip", null);
  }

  /* ---------- keyboard ---------- */
  function onKey(e){
    if(!overlay || paused) return;
    if(e.key==="Enter" || e.key==="ArrowRight"){
      e.preventDefault(); e.stopPropagation(); go(1);
    } else if(e.key==="ArrowLeft"){
      if(mode==="tour"){ e.preventDefault(); e.stopPropagation(); go(-1); }
    } else if(e.key==="Escape"){
      e.preventDefault(); e.stopPropagation();
      if(mode==="tour") askSkip(); else close();
    } else if(e.key==="Tab" && bubble){
      const f = bubble.querySelectorAll("button, [href], input, select, textarea");
      if(!f.length) return;
      const first = f[0], last = f[f.length-1];
      if(!bubble.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
      else if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  }

  return {
    get isActive(){ return !!overlay; },
    start, showTip, trigger, openGlossary, openHelp,
    flushTips: scheduleFlush,
    stop: close,
    reset(){ tourState.seenSteps=[]; tourState.toursCompleted=[]; saveTourState(); tipQueue=[]; },
    // A new game gets its tips back; "don't show me tips" stays global.
    // Call this BEFORE the first render — the render itself queues tips.
    onNewGame(){
      tourState.seenSteps = [];
      tourState.toursCompleted = [];
      saveTourState();
      tipQueue = [];
    },
    // ...and this after it, once the dashboard is actually on screen.
    startOpening(){ if(!tourState.tipsDisabled) start("opening"); },
  };
})();

/* =========================================================
   BOOTSTRAP
   ========================================================= */
function boot(){
  const saved = loadGame();
  if(saved && saved.screen && saved.screen!=="wizard"){
    G = null; // show welcome with continue option
  } else {
    G = null;
  }
  render();
}
boot();
</script>
</body>
</html>
