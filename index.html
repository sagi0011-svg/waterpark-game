<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b84d6">
<title>ספלאש בלאגן — סימולציית פארק מים</title>
<style>
:root{
  --sky1:#7bdcff;
  --sky2:#0b84d6;
  --bg:var(--sky2);
  --bg2:#f4fbfe;
  --card:#ffffff;
  --card2:#eaf6fb;
  --border:#d3ecf5;
  --text:#0a324c;
  --dim:#5c7a8c;
  --dim2:#93aebc;
  --accent:#00bfb3;
  --accent2:#00969c;
  --good:#16a34a;
  --bad:#d9362b;
  --warn:#c9790a;
  --gold:#b8790a;
  --coral:#ff6b4a;
  --coral2:#ff5252;
  --pink:#ec4fa0;
  --leaf:#3fb950;
  --violet:#9b6bff;
  --ruti:#6d28d9;
  --ruti2:#4c1d95;
  --slate:#3d5a72;
  --radius:20px;
  --radius-sm:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--sky2);color:var(--text);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Assistant,Arial,sans-serif;
  overscroll-behavior-y:none;
  touch-action:manipulation;
  min-height:100vh;
  min-height:100dvh;
}
button{font-family:inherit;}
::selection{background:var(--accent);color:#fff;}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 460px,#075c87 1400px);
}

/* ---------- generic bits ---------- */
.screen{display:flex;flex-direction:column;flex:1;padding-bottom:calc(24px + var(--safe-bottom));animation:fadein .25s ease;position:relative;}
.scene-host{position:relative;overflow:hidden;}
.scene-backdrop{position:absolute;left:0;right:0;bottom:0;height:min(50vh,380px);z-index:0;}
.scene-backdrop svg{width:100%;height:100%;display:block;}
.scene-backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,132,214,0) 0%,rgba(6,60,92,.45) 55%,rgba(3,26,40,.82) 100%);}
.scene-content{position:relative;z-index:1;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.px{padding-left:16px;padding-right:16px;}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
}
.muted{color:var(--dim);}
.small{font-size:12.5px;}
.center{text-align:center;}
.row{display:flex;align-items:center;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.gap8{gap:8px;}
.gap12{gap:12px;}
.stack{display:flex;flex-direction:column;}
.spacer{flex:1;}
h1,h2,h3,p{margin:0;}
.hidden{display:none !important;}

/* buttons */
.btn{
  border:none;border-radius:999px;
  padding:15px 20px;
  font-size:15.5px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;
  transition:transform .08s ease, opacity .15s ease, filter .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--coral),var(--coral2));color:#fff;box-shadow:0 6px 16px rgba(255,82,82,.35);}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(0,150,156,.3);}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn-good{background:linear-gradient(135deg,#4ade80,#22c55e);color:#052e14;}
.btn-bad{background:linear-gradient(135deg,#fb7185,#ef4444);color:#3a0303;}
.btn-block{width:100%;}
.btn-lg{padding:18px 22px;font-size:17px;border-radius:22px;}
.btn:disabled{opacity:.4;filter:grayscale(.3);cursor:not-allowed;transform:none;box-shadow:none;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:999px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text);cursor:pointer;
  box-shadow:0 2px 8px rgba(8,48,74,.12);
}

/* badges */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:var(--card2);border:1px solid var(--border);color:var(--text);
}
.badge-good{background:rgba(22,163,74,.12);color:var(--good);border-color:rgba(22,163,74,.3);}
.badge-bad{background:rgba(217,54,43,.1);color:var(--bad);border-color:rgba(217,54,43,.28);}
.badge-warn{background:rgba(201,121,10,.12);color:var(--warn);border-color:rgba(201,121,10,.3);}
.badge-gold{background:rgba(184,121,10,.12);color:var(--gold);border-color:rgba(184,121,10,.3);}

/* progress dots (wizard) */
.progress-dots{display:flex;gap:6px;justify-content:center;padding:14px 0 4px;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s;}
.dot.active{background:#fff;width:22px;border-radius:5px;}
.dot.done{background:rgba(255,255,255,.6);}

/* top bar */
.topbar{
  position:sticky;top:0;z-index:20;
  padding:calc(10px + var(--safe-top)) 16px 10px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.park-id{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}

/* hero seasonal card */
.hero{
  margin:12px 16px 0;
  border-radius:24px;
  padding:0;
  position:relative;overflow:hidden;
  border:1px solid var(--border);
  min-height:150px;
  display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:0 10px 28px rgba(6,40,62,.22);
}
.hero-scene{position:absolute;inset:0;transition:filter .4s ease;}
.hero-scene svg{width:100%;height:100%;display:block;}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:75%;background:linear-gradient(0deg,rgba(3,26,40,.8),rgba(3,26,40,0));pointer-events:none;}
.hero .hero-emoji{position:absolute;top:14px;left:16px;font-size:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));z-index:2;background:rgba(255,255,255,.25);backdrop-filter:blur(4px);border-radius:14px;padding:4px 8px;}
.hero .hero-content{position:relative;z-index:2;padding:18px 18px 16px;color:#fff;}
.hero .hero-month{font-size:20px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.4);}
.hero .hero-sub{font-size:12.5px;opacity:.92;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.35);}
.hero-scene.season-winter{filter:saturate(.45) brightness(.78) hue-rotate(15deg);}
.hero-scene.season-spring{filter:saturate(1.05) brightness(1.02);}
.hero-scene.season-summer{filter:saturate(1.3) brightness(1.08) hue-rotate(-6deg);}
.hero-scene.season-autumn{filter:saturate(.8) brightness(.9) sepia(.15) hue-rotate(8deg);}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 16px 0;}
.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:12px 8px;text-align:center;
  box-shadow:0 3px 10px rgba(8,48,74,.08);
}
.kpi .kpi-label{font-size:11px;color:var(--dim);margin-bottom:4px;}
.kpi .kpi-value{font-size:16.5px;font-weight:800;}
.kpi .kpi-delta{font-size:11px;margin-top:3px;font-weight:700;}

/* action grid */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 16px 0;}
.action-card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:16px 12px;text-align:center;cursor:pointer;transition:.1s;
  box-shadow:0 3px 10px rgba(8,48,74,.08);
}
.action-card:active{transform:scale(.96);background:var(--card2);}
.action-card .ac-emoji{font-size:26px;display:block;margin-bottom:6px;}
.action-card .ac-label{font-weight:700;font-size:13.5px;}

/* sticky bottom CTA */
.sticky-cta{
  position:sticky;bottom:0;z-index:20;
  padding:12px 16px calc(12px + var(--safe-bottom));
  background:linear-gradient(0deg,var(--sky2) 55%,transparent);
  margin-top:auto;
}

/* list section */
.section-title{font-size:13px;font-weight:800;color:rgba(255,255,255,.9);margin:18px 16px 8px;letter-spacing:.02em;text-shadow:0 1px 4px rgba(0,0,0,.2);}

/* warning banner */
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;}
.banner-bad{background:#fff0ee;border:1px solid rgba(217,54,43,.3);color:var(--bad);}
.banner-warn{background:#fff8ea;border:1px solid rgba(201,121,10,.3);color:var(--warn);}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;
  background:var(--card);border:1px solid var(--border);color:var(--dim);cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 6px rgba(8,48,74,.08);
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.tab.active.tab-facility{background:var(--accent);border-color:var(--accent);}
.tab.active.tab-food{background:var(--coral);border-color:var(--coral);}
.tab.active.tab-seating{background:var(--violet);border-color:var(--violet);}
.tab.active.tab-expansion{background:var(--leaf);border-color:var(--leaf);}
.tab.active.tab-marketing{background:var(--pink);border-color:var(--pink);}
.tab.active.tab-security{background:var(--slate);border-color:var(--slate);}

.side-panel{display:flex;gap:8px;margin:8px 16px 6px;}
.side-stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 10px;text-align:center;box-shadow:0 2px 8px rgba(8,48,74,.08);}
.side-stat .ss-label{font-size:10px;color:var(--dim);}
.side-stat .ss-value{font-size:13.5px;font-weight:800;margin-top:2px;}

.item-list{display:flex;flex-direction:column;gap:10px;padding:8px 16px 10px;}
.item-card{background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--border);border-radius:18px;padding:14px;box-shadow:0 3px 10px rgba(8,48,74,.08);}
.item-card.building{border-color:rgba(201,121,10,.4);border-inline-start-color:var(--warn);}
.item-card.disabled{opacity:.55;}
.item-title{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;}
.item-meta{font-size:12px;color:var(--dim);margin-top:4px;}
.item-actions{display:flex;gap:8px;margin-top:10px;}
.progress-bar{height:8px;border-radius:5px;background:var(--border);overflow:hidden;margin-top:8px;}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;transition:width .3s;}

/* overlay / bottom sheet */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadein2 .2s ease;
}
@keyframes fadein2{from{opacity:0;}to{opacity:1;}}
.sheet{
  width:100%;max-width:520px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:26px 26px 0 0;
  padding:10px 18px calc(20px + var(--safe-bottom));
  max-height:88vh;overflow-y:auto;
  animation:slideup .25s cubic-bezier(.2,.9,.3,1);
  color:var(--text);
}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 14px;}
.event-emoji{font-size:44px;text-align:center;display:block;margin-bottom:6px;}
.event-headline{font-size:18px;font-weight:800;text-align:center;line-height:1.35;}
.event-desc{font-size:13.5px;color:var(--dim);text-align:center;margin-top:8px;line-height:1.5;}
.event-effects{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.event-choices{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

/* news card */
.news-card{background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(8,48,74,.06);}
.news-card.bad{border-inline-start-color:var(--bad);}
.news-card.good{border-inline-start-color:var(--good);}
.news-title{font-weight:800;font-size:13.5px;}
.news-sub{font-size:12px;color:var(--dim);margin-top:3px;}

/* finance breakdown */
.finance-row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
.finance-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:9px;font-weight:800;font-size:15px;}

/* ---- ticket price control ---- */
.price-card{margin:0 16px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;box-shadow:0 4px 14px rgba(3,26,40,.10);}
.price-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.price-head .lbl{font-size:13px;font-weight:700;color:var(--dim);}
.price-value{font-size:26px;font-weight:900;color:var(--accent2);font-variant-numeric:tabular-nums;}
.price-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.price-step{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:20px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.price-step:active{transform:scale(.94);}
.price-step:disabled{opacity:.35;cursor:default;}
.price-slider{flex:1 1 auto;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--leaf),var(--warn),var(--bad));outline:none;}
.price-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;
  border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;
  box-shadow:0 2px 8px rgba(3,26,40,.28);}
.price-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;
  border:3px solid var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(3,26,40,.28);}
.price-slider:focus-visible{box-shadow:0 0 0 3px rgba(0,191,179,.4);}
.price-hint{margin-top:9px;font-size:12.5px;color:var(--dim);line-height:1.5;}
.price-hint b{color:var(--text);}
.price-tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:800;}
.price-tag.cheap{background:rgba(63,185,80,.15);color:var(--good);}
.price-tag.fair{background:rgba(0,191,179,.15);color:var(--accent2);}
.price-tag.steep{background:rgba(217,54,43,.13);color:var(--bad);}
@media (prefers-reduced-motion:reduce){.price-step:active{transform:none;}}

/* capacity vs demand */
.cap-card{margin:14px 16px 0;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;box-shadow:0 4px 14px rgba(3,26,40,.10);}
.cap-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.cap-head .lbl{font-size:12.5px;font-weight:700;color:var(--dim);}
.cap-nums{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent2);}
.cap-nums.over{color:var(--bad);}
.cap-bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:9px;
  border:1px solid var(--border);}
.cap-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--leaf),var(--accent));
  transition:width .3s;}
.cap-fill.over{background:linear-gradient(90deg,var(--warn),var(--bad));}
.cap-hint{margin-top:8px;font-size:12px;color:var(--dim);line-height:1.5;}

/* satisfaction breakdown in the monthly report */
.sat-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;}
.sat-row .up{color:var(--good);}
.sat-row .down{color:var(--bad);}
.gap4{gap:4px;}

/* history table */
.hist-row{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.hist-row:last-child{border-bottom:none;}

/* toggle switch style card for wizard options */
.opt-card{
  background:var(--card);border:2px solid var(--border);border-radius:18px;
  padding:14px 16px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:12px;
  box-shadow:0 3px 10px rgba(8,48,74,.08);
}
.opt-card.selected{border-color:var(--accent);background:rgba(0,191,179,.08);}
.opt-emoji{font-size:26px;}
.opt-title{font-weight:800;font-size:14.5px;}
.opt-sub{font-size:12px;color:var(--dim);margin-top:2px;}

input[type=text],input[type=number]{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;color:var(--text);font-size:16px;outline:none;
}
input[type=text]:focus,input[type=number]:focus{border-color:var(--accent);}

.logo-hero{font-size:56px;text-align:center;margin-bottom:6px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
.title-xl{font-size:24px;font-weight:900;text-align:center;line-height:1.3;color:#fff;text-shadow:0 2px 10px rgba(3,26,40,.35);}
.subtitle{font-size:14px;color:rgba(255,255,255,.88);text-align:center;margin-top:6px;line-height:1.5;text-shadow:0 1px 6px rgba(3,26,40,.3);}
.title-xl.on-card{color:var(--text);text-shadow:none;}
.subtitle.on-card{color:var(--dim);text-shadow:none;}

.sparkline{width:100%;height:60px;margin-top:6px;}

.toast{
  /* clears the dashboard's bottom bar (~69px) instead of sitting on top of it */
  position:fixed;bottom:calc(84px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  max-width:min(92vw,470px);text-align:center;
  background:var(--text);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  animation:toastin .2s ease, toastout .3s ease 1.8s forwards;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,10px);}}

/* =========================================================
   ONBOARDING — spotlight tour · contextual tips · glossary
   ========================================================= */
.tour-overlay{position:fixed;inset:0;z-index:9998;background:transparent;}
.tour-hole{
  position:fixed;left:0;top:0;width:0;height:0;border-radius:14px;
  box-shadow:0 0 0 9999px rgba(3,26,40,.75);
  transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease;
  pointer-events:none;
}
.tour-hole::after{
  content:"";position:absolute;inset:-3px;border-radius:inherit;
  border:2px solid var(--sky2);animation:tourpulse 1.7s ease-in-out infinite;
}
@keyframes tourpulse{0%,100%{opacity:.95;}50%{opacity:.3;}}

.tour-bubble{
  position:fixed;z-index:9999;top:0;left:0;
  width:min(320px,calc(100vw - 32px));
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:14px 16px 12px;box-shadow:0 14px 40px rgba(3,26,40,.4);
  color:var(--text);text-align:start;animation:fadein2 .18s ease;
}
.tour-bubble.as-sheet{
  left:0;right:0;top:auto;bottom:0;width:100%;max-width:520px;margin:0 auto;
  border-radius:22px 22px 0 0;padding-bottom:calc(14px + var(--safe-bottom));
}
.tour-arrow{position:absolute;width:16px;height:16px;z-index:-1;}
.tour-arrow i{display:block;width:16px;height:16px;background:var(--card);
  border:1px solid var(--border);border-radius:3px;transform:rotate(45deg);}
.tour-arrow.at-top{top:-8px;animation:tourfloatup 1.2s ease-in-out infinite;}
.tour-arrow.at-bottom{bottom:-8px;animation:tourfloatdown 1.2s ease-in-out infinite;}
.tour-arrow.at-left{left:-8px;animation:tourfloatleft 1.2s ease-in-out infinite;}
.tour-arrow.at-right{right:-8px;animation:tourfloatright 1.2s ease-in-out infinite;}
@keyframes tourfloatup{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

/* רותי carries her own kind so she can be styled apart, but she is still the crowd */

<div id="app"></div>
<script>
"use strict";

/* =========================================================
   CONFIG — all tables from the design doc
   ========================================================= */
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const MONTH_EMOJI = ["❄️","☔","🌱","🌸","🌤️","🌞","🔥","🔥","🍎","🎉","🍂","🌧️"];
const SEASON_MULT = [0.1,0.1,0.3,1.2,0.8,1.5,3.0,3.2,1.3,1.4,0.2,0.1];

function seasonClass(mIdx){ // 0-based month index
  if([5,6,7].includes(mIdx)) return "season-summer";
  if([2,3,4].includes(mIdx)) return "season-spring";
  if([8,9].includes(mIdx)) return "season-autumn";
  return "season-winter";
}

/* illustrated water-park scene, reused as hero art + screen backdrops.
   season variety comes from a CSS filter on the wrapper, not separate art. */
const SCENE_SVG = `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe0ff"/>
      <stop offset="1" stop-color="#2196d8"/>
    </linearGradient>
    <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c2c7"/>
      <stop offset="1" stop-color="#00838f"/>
    </linearGradient>

function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }
  catch(e){
    // The feed is the only thing here that grows without bound. Trim and retry —

    try{ pruneFeed(true); localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }
    catch(e2){ toast("⚠️ לא הצלחנו לשמור — הפיד ארוך מדי"); }

function loadGame(){
  try{
    const s = localStorage.getItem(SAVE_KEY);
    if(!s) return null;
    return migrateSave(JSON.parse(s));
  }catch(e){ return null; }
}
// Saves from before the economy rewrite lack the new fields.
function migrateSave(g){
  if(!g || typeof g!=="object") return g;
  if(g.ticketPrice==null) g.ticketPrice = ECON.ticketDefault;
  if(g.insuranceSpikeUntil==null) g.insuranceSpikeUntil = 0;
  // --- feed (added in the feed redesign; saves from before it have none of this) ---
  if(!Array.isArray(g.feed)) g.feed = [];
  if(g.feedSeq==null) g.feedSeq = 0;
  if(g.unseenEvents==null) g.unseenEvents = 0;
  if(g.feedFilter==null) g.feedFilter = "all";
  if(!g.ruti || typeof g.ruti!=="object") g.ruti = {heat:0,stage:0,members:0,lastTickHeat:null,everPeaked:0,lastEscalateTurn:null};
  else {
    if(g.ruti.heat==null) g.ruti.heat = 0;
    if(g.ruti.stage==null) g.ruti.stage = 0;
    if(g.ruti.members==null) g.ruti.members = 0;
    if(g.ruti.lastTickHeat===undefined) g.ruti.lastTickHeat = null;
    if(g.ruti.everPeaked==null) g.ruti.everPeaked = 0;
    if(g.ruti.lastEscalateTurn===undefined) g.ruti.lastEscalateTurn = null;
  }
  if(!Array.isArray(g.queuedReactions)) g.queuedReactions = [];
  if(!g.recentEventIds || typeof g.recentEventIds!=="object") g.recentEventIds = {bad:[],good:[]};
  if(!Array.isArray(g.recentEventIds.bad)) g.recentEventIds.bad = [];
  if(!Array.isArray(g.recentEventIds.good)) g.recentEventIds.good = [];
  return g;
}

/* The save is one JSON.stringify of G, so an unbounded feed eventually throws
   QuotaExceededError. Events and reports are the story and stay for a long time;
   ambient noise is trimmed hard. The feed is stored newest→oldest, so the
   overflow cut is a plain slice. */
function pruneFeed(aggressive){
  if(!G || !Array.isArray(G.feed)) return;
  const KEEP_MONTHS_NOISE = aggressive ? 2 : 6;
  const KEEP_ITEMS_TOTAL  = aggressive ? 60 : 160;
  const cutoff = G.turn - KEEP_MONTHS_NOISE;
  G.feed = G.feed.filter(it => it.kind==="event" || it.kind==="report" || it.turn >= cutoff);
  if(G.feed.length > KEEP_ITEMS_TOTAL) G.feed = G.feed.slice(0, KEEP_ITEMS_TOTAL);
}

/* =========================================================

   ========================================================= */
function fmtMoney(n){
  const neg = n<0; n = Math.round(Math.abs(n));
  return (neg?"-":"") + "₪" + n.toLocaleString("he-IL");
}
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function rand(min,max){ return Math.random()*(max-min)+min; }
function randi(min,max){ return Math.round(rand(min,max)); }
function chance(p){ return Math.random() < p; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function stars(n){ return "⭐".repeat(clamp(n,1,5)); }
function ratingFromSatisfaction(s){
  if(s<=20) return 1;
  if(s<=40) return 2;
  if(s<=60) return 3;
  if(s<=80) return 4;
  return 5;
}
function ratingDesc(n){
  return ({1:'"לא הייתי חוזר גם אם ישלמו לי"',2:'"היה בסדר, המים היו רטובים"',3:'"כיף משפחתי סטנדרטי"',4:'"תיק ותסע, שווה!"',5:'"הפארק הכי טוב אחרי הכינרת"'})[n];
}
function defOf(defId){
  return FACILITIES.find(f=>f.id===defId) || FOOD.find(f=>f.id===defId) || SEATING.find(f=>f.id===defId) || EXPANSION.find(f=>f.id===defId);
}
function allSlotsUsed(){
  return G.built.reduce((sum,b)=>{
    if(b.status==="closed") return sum;
    const d = defOf(b.defId);
    return sum + (d.slots||0);
  },0);
}
function totalSlots(){ return 8 + G.extraSlots; }
function activeBuilt(cat){
  return G.built.filter(b=>b.status==="active" && defOf(b.defId).cat===cat);
}
function allBuilt(cat){
  return G.built.filter(b=>defOf(b.defId).cat===cat);
}
function capacityTotal(){
  return G.built.filter(b=>b.status==="active").reduce((s,b)=>{
    const d = defOf(b.defId);
    return s + (d.capacity||0);
  },0);
}
function hasSlideActive(){
  return G.built.some(b=>b.status==="active" && defOf(b.defId).isSlide);
}

/* ---------- ECONOMY ---------- */
function appealTotal(){
  return G.built.filter(b=>b.status==="active")
                .reduce((s,b)=>s+(defOf(b.defId).appeal||0),0);
}
function wordOfMouth(){
  return Math.min(ECON.womCap, Math.sqrt(G.cumulativeVisitors)/ECON.womDiv*ECON.womCap);
}
// How many people WANT to come per day, before capacity is applied.
function marketPerDay(monthIdx){
  const base = ECON.marketBase
             + G.rating*ECON.marketPerStar
             + wordOfMouth()
             + appealTotal()*ECON.appealScale;
  const ads = G.campaigns.reduce((s,c)=>s+c.boost,0);
  return base * SEASON_MULT[monthIdx] * (1+ads) * (G.satisfaction/100) * priceFactor();
}
// Demand response to ticket price. >1 below the reference price, <1 above it.
function priceFactor(){
  return Math.pow(ECON.ticketRef/(G.ticketPrice||ECON.ticketDefault), ECON.elasticity);
}
function staffingLoad(monthIdx){
  return clamp(SEASON_MULT[monthIdx]/ECON.staffPeak, ECON.staffFloor, 1);
}
function staffCounts(){
  const cap = capacityTotal();
  if(cap<=0) return {lifeguards:0, staff:0};
  return {
    lifeguards: Math.ceil(cap/ECON.lifeguardPer),
    staff:      Math.ceil(cap/ECON.staffPer),
  };
}
function payrollFor(monthIdx){
  const {lifeguards, staff} = staffCounts();
  const full = lifeguards*ECON.lifeguardCost + staff*ECON.staffCost;
  return Math.round(full * staffingLoad(monthIdx));
}
function riskyCount(){
  return G.built.filter(b=>b.status==="active" && (defOf(b.defId).isSlide||defOf(b.defId).riskMult)).length;
}
function insuranceMonthly(){
  let p = ECON.insuranceBase + riskyCount()*ECON.insurancePerRisk;
  if(G.turn < (G.insuranceSpikeUntil||0)) p *= ECON.insuranceSpikeMult;
  return Math.round(p);
}
function bumpInsurance(){
  G.insuranceSpikeUntil = Math.max(G.insuranceSpikeUntil||0, G.turn + ECON.insuranceSpikeMonths);
}

/* Every fine in the game goes through here. On 🟢 קליל the multiplier is 0.5, so
   an un-rounded randi() leaves half a shekel sitting in G.money for the rest of
   the season — the balance reads ₪3,486,893.5. Rounding at the source also means
   the next event that levies a fine can't reintroduce it. */
function fineOf(min, max){
  return Math.round(randi(min, max) * (DIFFICULTY[G.difficulty].fineMult || 1));
}
function arnonaMonthly(){ return Math.round(capacityTotal()*ECON.arnonaPerCapacity); }
// Every recurring cost except maintenance and the security packages.
function overheadBreakdown(monthIdx){
  const opex = DIFFICULTY[G.difficulty].opexMult||1;
  return {
    payroll:   Math.round(payrollFor(monthIdx)*opex),
    arnona:    Math.round(arnonaMonthly()*opex),
    admin:     Math.round(ECON.adminBase*opex),
    insurance: Math.round(insuranceMonthly()*opex),
  };
}
function toast(msg){
  const el = document.createElement("div");
  el.className="toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

    if(b.status!=="active") return;
    const d = defOf(b.defId);
    const mult = (d.riskMult||1) * (b.monthsSinceMaint>6 ? 1.8 : (b.monthsSinceMaint>3?1.3:1));
    if(mult>worst) worst = mult;
  });
  return worst;
}

const RUTI_MAX_MEMBERS = 9000;    // the ceiling the joke survives
const RUTI_ESCALATE_GAP = 4;      // months between two stage-4 escalations

/* Heat is compared against the heat at the LAST month close, so mid-month player
   actions (a sassy reply, a price hike) also count as heating her up. */
function rutiTick(hadBadEvent){
  const R = G.ruti;
  let d = 0;
  if(G.satisfaction < 45)      d += 18;
  else if(G.satisfaction < 55) d += 9;
  else if(G.satisfaction > 72) d -= 16;
  else if(G.satisfaction > 62) d -= 8;
  if(hadBadEvent)              d += 10;
  if(priceNow() > 45)          d += 6;
  if(G.rating < 3)             d += 7;

  const prev = (R.lastTickHeat == null) ? R.heat : R.lastTickHeat;
  R.heat = clamp(Math.round(R.heat + d), 0, 100);
  // pinned at the top still counts as rising — the group must not bleed at peak rage
  const rising = R.heat > prev || R.heat >= 95;
  R.lastTickHeat = R.heat;

  const ns = R.heat>=88 ? 4 : R.heat>=62 ? 3 : R.heat>=36 ? 2 : R.heat>=16 ? 1 : 0;
  const old = R.stage;
  R.stage = ns;
  if(ns > R.everPeaked) R.everPeaked = ns;

  // the group only recruits while she heats up, and bleeds members while she cools
  if(ns >= 3){
    if(!R.members) R.members = randi(24,60);
    else R.members = Math.round(R.members * (rising ? 1.35 : 0.7));
    if(ns === 4 && rising) R.members = Math.max(R.members, randi(180,420));
    // 1.35× a month compounds to six figures over a long season. A neighbourhood
    // info group with 170,000 members stops being funny and starts being a bug.
    R.members = Math.min(R.members, RUTI_MAX_MEMBERS);
  } else if(R.members){
    R.members = Math.round(R.members * 0.55);
    if(R.members < 8) R.members = 0;
  }
  return {old, now:ns, up:ns>old, down:ns<old, rising};
}

/* Player actions feed the same meter, outside the monthly tick. */
function rutiHeat(delta){
  if(!G || !G.ruti) return;
  G.ruti.heat = clamp(Math.round(G.ruti.heat + delta), 0, 100);
}

  return clamp(Math.round(G.satisfaction*0.65 + (G.rating/5*100)*0.35 - (G.ruti?G.ruti.heat:0)*0.18), 0, 100);
}
function pickNoise(){
  const pool = WA_NOISE.filter(n=>{
    if(!n.cond) return true;
    try{ return !!n.cond(); }catch(e){ return false; }
  });
  const chosen = pick(pool.length ? pool : WA_NOISE);
  return String(chosen.t).replace("{price}", String(priceNow()));
}

   ========================================================= */
function mkItem(kind, type, tier, payload, extra){
  const it = {
    id: "f" + (G.feedSeq++),
    turn: G.turn, monthIdx: G.monthIdx, year: G.year,
    kind, type, tier, parentId: null, late: false,
    payload: payload || {},
  };
  if(extra) Object.assign(it, extra);
  return it;
}
/* Player actions during the month land at the top of the current month. */
function pushFeed(item){
  if(!G.feed) G.feed = [];
  G.feed.unshift(item);
  return item;
}

/* Chips are read off what apply() actually did this month, so the numbers on the
   card are the real ones — never a second, drifting copy of the balance. */
function mkEventItem(e, good, newsRow, fx){
  const chips = [];
  if(fx && fx.money) chips.push([(fx.money>0?"+":"") + fmtMoney(fx.money), fx.money>0?"g":"b"]);
  if(fx && fx.sat)   chips.push([`${fx.sat>0?"+":""}${Math.round(fx.sat)} שביעות רצון`, fx.sat>0?"g":"b"]);
  if(fx && fx.insurance) chips.push([`ביטוח ×${ECON.insuranceSpikeMult}`, "b"]);
  (e.feedChips||[]).forEach(c=>chips.push(c));
  return mkItem("event", good?"news_good":"news_bad", 1, {
    emoji: e.emoji, name: e.name,
    headline: e.headline || newsRow.title,
    sub: newsRow.sub || "", chips,
  });
}
function mkFromQueue(q){
  const it = q.kind==="staff" ? mkStaff(q.payload) : mkReview(q.payload);
  it.late = true;
  return it;
}
/* The report card holds a flat COPY of the numbers — G.history is pruned to 36
   and must stay that way, so the card can never hold a reference into it. */
function mkReportItem(h){
  const sc = staffCounts();
  return mkItem("report","report",1, Object.assign({}, h, {
    parkName: G.parkName,
    staffLifeguards: sc.lifeguards, staffOther: sc.staff,
    insuranceLoaded: G.turn < (G.insuranceSpikeUntil||0),
  }));
}
function mkDecision(dil, outcome){
  return mkItem("event","decision",2,{emoji:dil.emoji, question:dil.name, headline:dil.headline, outcome});
}

/* --- רותי's monthly card --- */
function mkRutiItem(res){
  const R = G.ruti;
  if(res.down && res.now >= 0 && R.everPeaked > 0){
    return mkItem("ruti","ruti",2,{mode:"down", stage:res.now, heat:R.heat, text:pick(RUTI.down)});
  }
  if(res.now === 4){
    // Once heat pins at 100 she sits at stage 4 for the rest of the season. Firing
    // the fine every month is a death spiral — the satisfaction hit keeps her hot,
    // which fires the next fine — and it burns the three escalation texts in a
    // quarter. She escalates on arrival, then roughly once a season.
    const since = (R.lastEscalateTurn == null) ? 99 : (G.turn - R.lastEscalateTurn);
    if(res.up || since >= RUTI_ESCALATE_GAP){
      R.lastEscalateTurn = G.turn;
      const e = pick(RUTI.stage4);
      const fine = fineOf(e.fine[0], e.fine[1]);
      G.money -= fine;
      G.satisfaction = clamp(Math.round(G.satisfaction + e.sat), 0, 100);
      G.rating = ratingFromSatisfaction(G.satisfaction);
      return mkItem("event","ruti",1,{mode:"escalate", stage:4, heat:R.heat,
        headline:e.h, sub:e.s, fine, sat:e.sat});
    }
    return mkItem("ruti","ruti",2,{mode:"pressure", stage:4, heat:R.heat, members:R.members,
      group:`נפגעי ${G.parkName} — קבוצת מידע 🕵️‍♀️`, text:pick(RUTI.stage4quiet),
      waiting:RUTI_ESCALATE_GAP - since, time:feedTime()});
  }
  if(res.now === 3){
    return mkItem("ruti","ruti",2,{mode:"group", stage:3, heat:R.heat, members:R.members,
      group:`נפגעי ${G.parkName} — קבוצת מידע 🕵️‍♀️`, text:pick(RUTI.stage3.posts),
      joined:randi(4,19), time:feedTime()});
  }
  if(res.now === 2){
    return mkItem("ruti","ruti",2,{mode:"review", stage:2, heat:R.heat,
      text:pick(RUTI.stage2), reviews:randi(40,120)});
  }
  if(res.now === 1){
    const s = pick(RUTI.stage1);
    const nb = pick(NEIGHBORS);
    return mkItem("ruti","ruti",2,{mode:"wa", stage:1, heat:R.heat,
      text:s.t, reply:s.r, replyWho:nb.n, replyColor:nb.c, t1:feedTime(), t2:feedTime()});
  }
  return null;
}

/* --- event reactions: the thread that hangs off a headline --- */
function mkReactions(e, parentId){
  const out = [];
  const rx = e.reactions;
  if(!rx) return out;
  if(rx.rev && chance(0.75)){
    // half the reviews land a month late — that is how it works in real life
    if(chance(0.5)) G.queuedReactions.push({kind:"review", payload:rx.rev});
    else { const it = mkReview(rx.rev); it.parentId = parentId; out.push(it); }
  }
  if(rx.wa && rx.wa.length){
    const lines = rx.wa.slice(0,2);
    const it = mkWA(lines, {collapse:false});
    it.parentId = parentId; out.push(it);
  }
  if(rx.staff){
    if(chance(0.5)) G.queuedReactions.push({kind:"staff", payload:rx.staff});
    else { const it = mkStaff(rx.staff); it.parentId = parentId; out.push(it); }
  }
  return out;
}

/* =========================================================
   FEED — assembling one month
   ========================================================= */
function buildMonthFeed(opts){
  const triggeredInfo = opts.triggeredInfo || [];
  const items = [];   // chronological; reversed on the way into G.feed

  // 1. opening ticker
  items.push(mkTicker());

  // 2. last month's delayed reactions arrive first
  G.queuedReactions.splice(0).forEach(q => items.push(mkFromQueue(q)));

  // 3. the headlines, each with its own thread of consequences
  let hadBad = false;
  triggeredInfo.forEach(ti => {
    const parent = mkEventItem(ti.e, ti.good, ti.newsRow, ti.fx);
    items.push(parent);
    mkReactions(ti.e, parent.id).forEach(r => items.push(r));
    if(!ti.good){
      hadBad = true;
      G.unseenEvents++;
      if(chance(0.3)) items.push(mkViral());
    }
  });

  // 4. רותי עש
  const res = rutiTick(hadBad);
  const rc = mkRutiItem(res);
  if(rc && (res.up || res.down || G.ruti.stage>=2 || chance(0.6))){
    items.push(rc);
    if(res.now === 4) G.unseenEvents++;
    if(res.up && res.now>0) setTimeout(()=>toast(`🕵️‍♀️ ${RUTI.name} עלתה לשלב ${res.now}`), 500);
    else if(res.down)       setTimeout(()=>toast(`🕵️‍♀️ ${RUTI.name} נסוגה לשלב ${res.now}`), 500);
  }

  // 5. neighbourhood noise — aware of what is actually built
  if(chance(0.85)) items.push(mkWA([pickNoise(), pick(WA_REPLY), pick(WA_REPLY)], {collapse:true}));
  if(chance(0.55)) items.push(mkReview());
  if(chance(0.50)) items.push(mkStaff());
  if(chance(0.45)) items.push(mkTicker());

  // 6. a genuinely quiet month deserves to be named
  if(!triggeredInfo.length && items.length <= 2) items.push(mkQuiet());

  // 7. the report closes the month
  items.push(mkReportItem(opts.historyRow));

  G.feed.unshift.apply(G.feed, items.reverse());
}

/* =========================================================
   MONTH RESOLUTION
   ========================================================= */
function resolveMonth(){
  const diff = DIFFICULTY[G.difficulty];
  const news = [];
  G._satDelta = 0;

  // --- tick constructions ---
  G.built.forEach(b=>{
    if(b.status==="building"){
      b.weeksLeft = Math.max(0, b.weeksLeft-4);
      if(b.weeksLeft<=0){
        b.status="active"; b.monthsSinceMaint=0; b.builtAtTurn=G.turn;
        news.push({type:"good", title:`${defOf(b.defId).emoji} ${defOf(b.defId).name} נפתח לקהל הרחב!`, sub:"עוד סיבה לבוא."});
        G.justUpgradedThisTurn = true;
      }
    } else if(b.status==="closed"){
      if(b.closedWeeksLeft!=null){
        b.closedWeeksLeft = Math.max(0,b.closedWeeksLeft-4);
        if(b.closedWeeksLeft<=0){ b.status="active"; b.monthsSinceMaint=0; news.push({type:"good", title:`${defOf(b.defId).emoji} ${defOf(b.defId).name} חזר לפעילות`, sub:"התיקון הושלם."}); }
      }
    }
    if(b.status==="active"){ b.monthsSinceMaint = (b.monthsSinceMaint||0)+1; }
  });

  // --- tick campaigns ---
  G.campaigns = G.campaigns.filter(c=>{ c.weeksLeft -= 4; return c.weeksLeft>0; });

  // --- market & demand ---
  // Demand is set by the MARKET (stars, attractions, word of mouth, price).
  // Capacity no longer creates customers — it only limits how many you can serve.
  const capacity = capacityTotal();
  const demandPerDay = marketPerDay(G.monthIdx);
  const visitorsPerDay = capacity>0 ? Math.min(demandPerDay, capacity) : 0;
  const crowding = capacity>0 ? demandPerDay/capacity : 0;
  const turnedAway = Math.round(Math.max(0, demandPerDay-capacity) * 30);
  const visitorsMonth = Math.round(visitorsPerDay * 30);
  const prevVisitors = G.lastVisitors;
  // How many heads the current ticket price won or cost us, against the
  // reference price where the demand factor is exactly 1.
  const pf = priceFactor();
  const demandAtRef = pf>0 ? demandPerDay/pf : demandPerDay;
  const visitorsAtRef = capacity>0 ? Math.round(Math.min(demandAtRef, capacity)*30) : 0;
  const priceVisitorDelta = visitorsMonth - visitorsAtRef;          // what it cost at the gate
  const priceDemandDelta = Math.round((demandPerDay-demandAtRef)*30); // what it did to demand itself

  // --- income ---
  const ticketIncome = Math.round(visitorsMonth * G.ticketPrice);
  let foodSpend = 0;
  activeBuilt("food").forEach(b=>{
    const d = defOf(b.defId);
    let s = d.spend;
    if(d.summerBoost && [5,6,7].includes(G.monthIdx)) s *= d.summerBoost;
    foodSpend += s;
  });
  const foodIncome = Math.round(visitorsMonth * foodSpend);
  const vipCount = G.built.filter(b=>b.status==="active" && defOf(b.defId).vip).length;
  const vipIncome = Math.round(visitorsMonth * 0.04 * vipCount * 45);
  let income = ticketIncome + foodIncome + vipIncome;

  // --- expenses: maintenance ---
  let maintenance = 0;
  if(diff.maintOn){
    G.built.forEach(b=>{
      if(b.status!=="active") return;
      const d = defOf(b.defId);
      let m = d.maint||0;
      if(diff.neglect && b.monthsSinceMaint>6) m *= 1.5;
      maintenance += m;
    });
    maintenance = Math.round(maintenance * (diff.opexMult||1));
  }
  let securityMonthly = 0;
  SECURITY.forEach(s=>{ if(G.security[s.id]) securityMonthly += s.monthly; });
  // payroll, arnona, admin, insurance — the costs that don't care if anyone shows up
  const oh = overheadBreakdown(G.monthIdx);
  const overhead = oh.payroll + oh.arnona + oh.admin + oh.insurance;
  let expenses = maintenance + securityMonthly + overhead;

  // --- random events ---
  const pool = buildEventPool();
  let redCandidates = pool.RED.filter(e=>e.chance>0);
  let greenCandidates = pool.GREEN.filter(e=>e.chance>0);
  if(diff.lightOnly) redCandidates = redCandidates.filter(e=>e.light);
  redCandidates = redCandidates.map(e=>({...e, chance:e.chance*diff.freqMult}));

  const triggered = [];
  function rollFrom(list){
    for(const e of list){ if(chance(e.chance)) return e; }
    return null;
  }
  // Recency memory lives in G (not a module variable) so a reload can't hand the
  // player the same headline twice in a row. RED and GREEN remember separately —
  // a shared window would starve the shorter list.
  function withoutRecent(list, key){
    const mem = G.recentEventIds[key] || [];
    const fresh = list.filter(e=>!mem.includes(e.id));
    return fresh.length ? fresh : list;
  }
  function rememberEvent(id, key, poolSize){
    const mem = G.recentEventIds[key];
    if(!mem) return;
    mem.push(id);
    const win = Math.max(2, Math.floor(poolSize/2));
    while(mem.length > win) mem.shift();
  }
  const r1 = rollFrom(withoutRecent(shuffled(redCandidates), "bad"));
  const g1 = rollFrom(withoutRecent(shuffled(greenCandidates), "good"));
  if(r1){ triggered.push(r1); rememberEvent(r1.id, "bad", redCandidates.length); }
  if(g1){ triggered.push(g1); rememberEvent(g1.id, "good", greenCandidates.length); }
  if(diff.doubleChance && chance(diff.doubleChance)){
    const extra = rollFrom(withoutRecent(shuffled(redCandidates.filter(e=>!triggered.includes(e))), "bad"));
    if(extra){ triggered.push(extra); rememberEvent(extra.id, "bad", redCandidates.length); }
  }

  // What each event actually did to the balance — the feed card reads its chips
  // from here instead of keeping a second, drifting copy of the numbers.
  const triggeredInfo = [];
  triggered.forEach(e=>{
    const good = pool.GREEN.includes(e);
    const moneyBefore = G.money, satBefore = G._satDelta||0, insBefore = G.insuranceSpikeUntil||0;
    const result = e.apply();
    const newsRow = {type: good?"good":"bad", title:`${e.emoji} ${e.name}`, sub: result, headline:e.headline};
    news.push(newsRow);
    triggeredInfo.push({e, good, newsRow, fx:{
      money: G.money - moneyBefore,
      sat: (G._satDelta||0) - satBefore,
      insurance: (G.insuranceSpikeUntil||0) > insBefore,
    }});
  });

  // dilemma roll (only if none pending already, small chance independent of red/green)
  let dilemma = null;
  if(chance(0.22 * diff.freqMult)){
    const candidates = DILEMMAS.filter(d=> !d.requiresSlide || hasSlideActive());
    if(candidates.length) dilemma = pick(candidates);
  }

  // --- satisfaction factors ---
  // Every factor is also written to satLog so the monthly report can say WHY
  // the score moved, instead of dropping a new number on the player.
  let pos = 0, neg = 0;
  const satLog = [];
  const bump = (label, delta)=>{
    if(!delta) return;
    if(delta>0) pos += delta; else neg += -delta;
    satLog.push({label, v:delta});
  };
  if(capacity>0){
    if(crowding<=1) bump("איזון טוב בין מבקרים לקיבולת", Math.round(SAT_W.crowdFit*(1-Math.abs(1-crowding))));
    else bump("צפיפות יתר", -clamp(Math.round((crowding-1)*SAT_W.crowdSlope),0,SAT_W.crowdMax));
  }
  const groups = new Set(G.built.filter(b=>b.status==="active").map(b=>defOf(b.defId).group).filter(Boolean));
  if(groups.size>=2) bump("מגוון מתקנים לכל הגילאים", SAT_W.variety);
  const seatCap = allBuilt("seating").filter(b=>b.status!=="closed").reduce((s,b)=>s+(defOf(b.defId).seatCap||0),0);
  if(seatCap*10 >= visitorsPerDay*0.4) bump("מספיק מקומות ישיבה", SAT_W.seating);
  const foodVariety = activeBuilt("food").length;
  if(foodVariety>=2) bump("מגוון הסעדה", SAT_W.foodVariety);
  if(G.justUpgradedThisTurn) bump("משהו חדש נפתח החודש", SAT_W.freshBuild);
  if(G.rating>G.prevRating) bump("הדירוג עלה מהחודש שעבר", SAT_W.ratingUp);

  const shadeCap = allBuilt("seating").filter(b=>b.status!=="closed" && defOf(b.defId).shade).reduce((s,b)=>s+(defOf(b.defId).seatCap||0),0);
  if([5,6,7].includes(G.monthIdx) && shadeCap*10 < visitorsPerDay*0.25) bump("אין מספיק צל בשיא הקיץ", -SAT_W.noShade);
  const anyClosed = G.built.some(b=>b.status==="closed");
  if(anyClosed) bump("מתקן סגור או מקולקל", -SAT_W.closedRide);
  if(crowding>SAT_W.queueAt) bump("תורים ארוכים", -SAT_W.queue);

  // headline attractions and security are a standing draw
  bump("מתקני הדגל של הפארק", Math.min(SAT_W.appealMax, Math.round(appealTotal()/SAT_W.appealDiv)));
  if(G.security.lifeguard||G.security.full) bump("מציל ייעודי", SAT_W.lifeguard);
  if(G.security.guards||G.security.full) bump("מאבטחים בכניסה", SAT_W.guards);

  // price perception — "יקר מדי" vs "מחיר הוגן"
  const price = G.ticketPrice||ECON.ticketDefault;
  if(price > SAT_W.priceHigh) bump("המחיר נתפס כיקר מדי", -(price-SAT_W.priceHigh)*SAT_W.pricyPerShekel);
  else if(price < SAT_W.priceLow) bump("המחיר נתפס כמשתלם", (SAT_W.priceLow-price)*SAT_W.cheapPerShekel);

  // event-driven sat deltas already applied via addSat -> _satDelta (can be + or -)
  const eventDelta = G._satDelta||0;
  if(eventDelta) satLog.push({label:"אירועי החודש", v:eventDelta});
  const satRanked = satLog.slice().sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const satUp = satRanked.filter(f=>f.v>0).slice(0,2).map(f=>({label:f.label, v:Math.round(f.v)}));
  const satDown = satRanked.filter(f=>f.v<0).slice(0,2).map(f=>({label:f.label, v:Math.round(f.v)}));
  const satBefore = G.satisfaction;

  // NOTE: the baseline is ECON.satBase, not 100. With a baseline of 100 every park
  // — even an empty one — drifted to 5 stars, which broke the whole economy.
  const factorSum = ECON.satBase + pos - neg + eventDelta;
  const newSat = clamp(G.satisfaction*0.7 + factorSum*0.3, 0, 100);

  // fold event-driven money changes already applied directly to G.money above (inside apply())
  const profit = income - expenses;
  G.money += profit;

  G.prevRating = G.rating;
  G.satisfaction = Math.round(newSat);
  G.rating = ratingFromSatisfaction(G.satisfaction);
  G.lastVisitors = visitorsMonth;
  G.cumulativeVisitors += visitorsMonth;

  const visitorsDeltaPct = prevVisitors>0 ? Math.round(((visitorsMonth-prevVisitors)/prevVisitors)*100) : null;

  G.history.push({
    turn:G.turn, monthIdx:G.monthIdx, year:G.year,
    visitors:visitorsMonth, visitorsDeltaPct,
    satisfaction:G.satisfaction, rating:G.rating,
    income, expenses, maintenance, securityMonthly, ticketIncome, foodIncome, vipIncome,
    payroll:oh.payroll, arnona:oh.arnona, admin:oh.admin, insurance:oh.insurance,
    ticketPrice:G.ticketPrice, turnedAway, capacity, demand:Math.round(demandPerDay),
    priceFactorVal:Math.round(pf*100)/100, priceVisitorDelta, priceDemandDelta,
    satBefore, satUp, satDown,
    profit, money:G.money,
  });
  if(G.history.length>36) G.history.shift();

  // pendingEvents stays for backwards compatibility, but the feed is the source of truth
  G.pendingEvents = news;
  G.pendingDilemma = dilemma;
  G.justUpgradedThisTurn = false;

  buildMonthFeed({ triggeredInfo, historyRow: G.history[G.history.length-1] });
  pruneFeed();

  // advance calendar
  G.monthIdx += 1;
  if(G.monthIdx>11){ G.monthIdx=0; G.year+=1; }
  G.turn += 1;
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function checkEndConditions(){
  if(G.money < -200000 && G.winCondition!=="sandbox"){
    G.over = {type:"lose", reason:"bankrupt"};
    return true;
  }
  if(G.winCondition==="season"){
    if(G.turn > G.seasonLen){ G.over = {type:"win", reason:"season"}; return true; }
  }
  if(G.winCondition==="goal"){
    let reached=false;
    if(G.goalType==="money" && G.money>=G.goalValue) reached=true;
    if(G.goalType==="stars" && G.rating>=G.goalValue) reached=true;
    if(G.goalType==="visitors" && G.cumulativeVisitors>=G.goalValue) reached=true;
    if(reached){ G.over = {type:"win", reason:"goal"}; return true; }
  }
  return false;
}

/* =========================================================
   RENDER — root dispatcher
   ========================================================= */
function render(){
  const app = document.getElementById("app");
  // a re-render must not throw the player back to the top of the feed
  const prevFeed = document.querySelector(".feed");
  if(prevFeed) _feedScroll = prevFeed.scrollTop;
  app.innerHTML = "";
  if(!G){ app.appendChild(renderWelcome()); return; }
  if(G.over){ app.appendChild(renderGameOver()); return; }
  switch(G.screen){
    case "wizard": app.appendChild(renderWizard()); break;
    case "dashboard": app.appendChild(renderDashboard()); break;
    case "build": app.appendChild(renderBuild()); break;
    case "history": app.appendChild(renderHistory()); break;
    default: app.appendChild(renderDashboard());
  }
  saveGame();
  const feed = document.querySelector(".feed");
  if(feed && _feedScroll) feed.scrollTop = _feedScroll;
  applyFeedFilter();
  Tour.flushTips();
}

function el(html){
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}
function on(node, ev, fn){ node.addEventListener(ev, fn); return node; }

/* =========================================================
   WELCOME / CONTINUE
   ========================================================= */
function renderWelcome(){
  const saved = loadGame();
  const wrap = el(`<div class="screen scene-host">
    <div class="scene-backdrop">${SCENE_SVG}</div>
    <div class="scene-content px" style="justify-content:center;padding-top:${saved?60:80}px;display:flex;flex-direction:column;flex:1;">
      <div class="logo-hero">🏊‍♂️💦</div>
      <div class="title-xl">סימולציית פארק מים</div>
      <div class="subtitle">נהלו פארק מים ישראלי — כיסאות כתר, חופש גדול, ותור אינסופי לגלידה.</div>
      <div class="stack gap12" style="margin-top:34px;"></div>
    </div>
  </div>`);
  const stack = wrap.querySelector(".stack");
  if(saved){
    const btnContinue = el(`<button class="btn btn-primary btn-lg btn-block">▶️ המשך משחק — ${saved.parkName}</button>`);
    on(btnContinue,"click",()=>{ G = saved; render(); });
    stack.appendChild(btnContinue);
  }
  const btnNew = el(`<button class="btn ${saved?'btn-ghost':'btn-primary'} btn-lg btn-block">🆕 משחק חדש</button>`);
  on(btnNew,"click",()=>{
    if(saved && !confirm("להתחיל משחק חדש? המשחק השמור יימחק.")) return;
    clearSave();
    G = {screen:"wizard", step:0, draft:{managerName:"", parkName:"", winCondition:"season", difficulty:"normal", pace:"fast", goalType:"money", goalValue:5000000}};
    render();
  });
  stack.appendChild(btnNew);
  return wrap;
}

/* =========================================================
   WIZARD
   ========================================================= */
const WIZARD_STEPS = ["manager","park","goal","difficulty","pace","review"];

function renderWizard(){
  const step = WIZARD_STEPS[G.step];
  const wrap = el(`<div class="screen">
    <div class="progress-dots">${WIZARD_STEPS.map((s,i)=>`<div class="dot ${i===G.step?'active':(i<G.step?'done':'')}"></div>`).join("")}</div>
    <div class="px stack gap12" style="flex:1;padding-top:10px;" id="wizBody"></div>
    <div class="sticky-cta row gap8">
      ${G.step>0?`<button class="btn btn-ghost" id="wizBack">➡️ חזרה</button>`:'<div style="width:8px"></div>'}
      <button class="btn btn-accent btn-block btn-lg" id="wizNext">המשך</button>
    </div>
  </div>`);
  const body = wrap.querySelector("#wizBody");

  if(step==="manager"){
    body.appendChild(el(`<div class="logo-hero">🧑‍💼</div>`));
    body.appendChild(el(`<div class="title-xl">איך קוראים למנהל/ת הפארק?</div>`));

  if(step==="park"){
    body.appendChild(el(`<div class="logo-hero">🏞️</div>`));
    body.appendChild(el(`<div class="title-xl">איך קוראים לפארק?</div>`));
    body.appendChild(el(`<div class="subtitle">שם רשמי, או פשוט תלחצו על הקוביות 🎲</div>`));

    body.appendChild(el(`<div class="title-xl" style="margin-bottom:4px;">מה מטרת המשחק?</div>`));

      {id:"sandbox", emoji:"🏖️", title:"Sandbox אינסופי", sub:"בלי סוף מוגדר — פשוט תיהנו"},
      {id:"season", emoji:"📅", title:"שרוד עונה", sub:`${PACE[G.draft.pace].seasonLen} חודשים בלי לפשוט רגל`},

      const goalBox = el(`<div class="card stack gap8" style="margin-top:4px;"></div>`);

        const b = el(`<button class="btn btn-sm ${G.draft.goalType===id?'btn-accent':'btn-ghost'}" style="flex:1;">${label}</button>`);
        on(b,"click",()=>{ G.draft.goalType=id; renderInto(); });
        typeRow.appendChild(b);

      goalBox.appendChild(el(`<div class="small muted">בחרו יעד:</div>`));
      goalBox.appendChild(typeRow);

      numInput.value = G.draft.goalValue;
      on(numInput,"input",e=>G.draft.goalValue=Number(e.target.value)||1);

      body.appendChild(goalBox);

    body.appendChild(el(`<div class="title-xl" style="margin-bottom:4px;">רמת קושי</div>`));

      const card = el(`<div class="opt-card ${G.draft.difficulty===id?'selected':''}">

    body.appendChild(el(`<div class="title-xl" style="margin-bottom:4px;">קצב משחק</div>`));

      </div>`);

    body.appendChild(el(`<div class="logo-hero">🚀</div>`));

      ["פארק", d.parkName||"—"],
      ["מטרה", {sandbox:"Sandbox אינסופי",season:"שרוד עונה",goal:"יעד מוגדר"}[d.winCondition]],

      ["קצב", PACE[d.pace].label],

    rows.forEach(([k,v])=>card.appendChild(el(`<div class="row-between"><span class="muted small">${k}</span><span style="font-weight:700;">${v}</span></div>`)));
    body.appendChild(card);
  }

  function renderInto(){ // re-render just this screen in place
    const idx = Array.from(wrap.parentElement?wrap.parentElement.children:[]).indexOf(wrap);
    render();
  }

  const nextBtn = wrap.querySelector("#wizNext");
  const backBtn = wrap.querySelector("#wizBack");
  if(step==="review") nextBtn.textContent = "🏊 התחל ניהול!";
  on(nextBtn,"click",()=>{
    if(step==="manager" && !G.draft.managerName.trim()){ toast("צריך לרשום שם 🙂"); return; }
    if(step==="park" && !G.draft.parkName.trim()){ toast("צריך שם לפארק 🙂"); return; }
    if(step==="review"){
      G = newGame(G.draft);
      Tour.onNewGame();
      render();
      Tour.startOpening();
      return;
    }
    G.step += 1; render();
  });
  if(backBtn) on(backBtn,"click",()=>{ G.step -=1; render(); });

  return wrap;
}

/* =========================================================
   DASHBOARD — the feed is the screen now.

   [topstrip]   park · money · rating · רותי · collapsible KPI panel
   [mood]       net sentiment meter
   [warnbar]    only when something is actually wrong
   [dilslot]    sticky dilemma, outside the scroll, blocks "close month"
   [ftabs]      all · events · crowd · reports
   [feed]       the scrolling majority of the screen
   [bottombar]  build · price · close month
   ========================================================= */

let _feedScroll = 0;

function renderDashboard(){
  const wrap = el(`<div class="screen dash"></div>`);
  wrap.appendChild(renderTopstrip());
  wrap.appendChild(renderDilemmaSlot());
  wrap.appendChild(renderFeedTabs());
  wrap.appendChild(renderFeed());
  wrap.appendChild(renderBottomBar());

  Tour.trigger("FIRST_NEXT_MONTH");
  if(G.ruti && G.ruti.stage>=2) Tour.trigger("RUTI_ON_YOUR_CASE");
  if(G.satisfaction<40) Tour.trigger("SATISFACTION_BELOW_40");
  if(G.money<0) Tour.trigger("NEGATIVE_BALANCE");

  return wrap;
}

/* ---------- top strip ---------- */
function renderTopstrip(){
  const cap = capacityTotal();
  const demand = Math.round(marketPerDay(G.monthIdx));
  const open = !!G._kpiOpen;
  const ts = el(`<div class="topstrip"></div>`);

  ts.appendChild(el(`<div class="ts-top">
    <div class="ts-park" data-tour="park-header">🏊 ${escapeHtml(G.parkName)}</div>
    <div class="ts-month">${MONTH_EMOJI[G.monthIdx]} ${MONTHS[G.monthIdx]} · שנה ${G.year}${G.winCondition==='season'?` · ${G.turn}/${G.seasonLen}`:''}</div>
    <div class="ts-acts">
      <button class="icon-btn" id="helpBtn" data-tour="help-btn" aria-label="עזרה והדרכה">❓</button>
      <button class="icon-btn" id="menuBtn" aria-label="תפריט">☰</button>
    </div>
  </div>`));
  on(ts.querySelector("#helpBtn"),"click",()=>Tour.openHelp());
  on(ts.querySelector("#menuBtn"),"click",()=>openMenu());

  const line = el(`<div class="ts-line">
    <button class="ts-stat ${G.money<0?'neg':''}" data-tour="kpi-money" aria-label="כסף">💰 <span>${fmtMoney(G.money)}</span></button>
    <button class="ts-stat" data-tour="kpi-rating" aria-label="דירוג ושביעות רצון">⭐ <span>${G.rating}</span><small>· ${G.satisfaction}</small></button>
    <button class="ts-ruti ${G.ruti.stage>0?'on':''}" data-tour="ruti-chip" aria-label="רותי עש">🕵️‍♀️ <span>${G.ruti.stage}</span></button>
    <button class="ts-exp ${open?'open':''}" id="kpiExp" aria-label="פרטים נוספים">▼</button>

  on(line.querySelector('[data-tour="kpi-rating"]'),"click",()=>Tour.openGlossary("satisfaction"));
  on(line.querySelector('[data-tour="ruti-chip"]'),"click",()=>{
    if(G.ruti.stage===0) toast("🕵️‍♀️ רותי עש רגועה. בינתיים.");
    else toast(`🕵️‍♀️ ${RUTI.name} · ${RUTI.stageNames[G.ruti.stage]} · חום ${G.ruti.heat}`);
  });
  on(line.querySelector("#kpiExp"),"click",()=>{ G._kpiOpen = !G._kpiOpen; toggleKpiPanel(); });
  ts.appendChild(line);

  ts.appendChild(el(`<div class="ts-detail ${open?'open':''}"><div class="ts-detail-in">
    <div class="ts-cell" data-tour="kpi-visitors"><b>${G.lastVisitors.toLocaleString('he-IL')}</b><span>👥 מבקרים בחודש שעבר</span></div>
    <div class="ts-cell"><b>${G.satisfaction}</b><span>😊 שביעות רצון</span></div>
    <div class="ts-cell"><b>${cap.toLocaleString('he-IL')}</b><span>🏊 קיבולת ליום</span></div>
    <div class="ts-cell"><b>${demand.toLocaleString('he-IL')}</b><span>📈 ביקוש ליום</span></div>
    <div class="ts-cell"><b>₪${priceNow()}</b><span>🎟️ מחיר כרטיס</span></div>
    <div class="ts-cell"><b>${RUTI.stageNames[G.ruti.stage]}</b><span>🕵️‍♀️ רותי עש</span></div>
  </div></div>`));

  // net sentiment — one number for "how the internet feels about you"
  const mo = moodScore();
  const fill = mo>70 ? "linear-gradient(90deg,#6ee7b7,#10b981)"
             : mo>45 ? "linear-gradient(90deg,#fcd34d,#f59e0b)"
             : "linear-gradient(90deg,#fca5a5,#dc2626)";
  const face = mo>78?"😍":mo>60?"🙂":mo>42?"😐":mo>25?"😠":"🤬";
  const lbl  = mo>60?"אוהבים אתכם":mo>42?"סבבה":"מתחיל להסריח";
  ts.appendChild(el(`<div class="mood">
    <span class="mood-face">${face}</span>

  return ts;

function toggleKpiPanel(){
  const d = document.querySelector(".ts-detail"), b = document.querySelector("#kpiExp");

/* ---------- the sticky dilemma slot ---------- */
function renderDilemmaSlot(){
  const slot = el(`<div class="dilslot"></div>`);
  const dil = G.pendingDilemma;
  if(!dil) return slot;
  slot.classList.add("on");
  slot.appendChild(el(`<div class="dil-pin">📌 מחכה להחלטה שלך — אי אפשר לסגור חודש</div>`));
  slot.appendChild(el(`<div class="dil-q" data-tour="event-sheet">${dil.emoji} ${dil.headline}</div>`));
  if(!G.quickUI) slot.appendChild(el(`<div class="dil-ctx">${dil.desc}</div>`));
  const btns = el(`<div class="dil-btns"></div>`);
  dil.choices.forEach((c,i)=>{
    const b = el(`<button class="${i===0?'a':'b'}">${c.label}</button>`);
    on(b,"click",()=>{
      if(Tour.isActive) return;
      G._satDelta = 0;
      const result = c.apply();
      if(G._satDelta){
        G.satisfaction = clamp(Math.round(G.satisfaction + G._satDelta*0.3), 0, 100);
        G.rating = ratingFromSatisfaction(G.satisfaction);
      }
      pushFeed(mkDecision(dil, result));
      G.pendingDilemma = null;
      render();
      const f = document.querySelector(".feed");
      if(f){ f.scrollTop = 0; _feedScroll = 0; }
    });
    btns.appendChild(b);
  });
  slot.appendChild(btns);
  Tour.trigger("FIRST_RANDOM_EVENT");
  return slot;
}

/* ---------- tabs + badge ---------- */
function renderFeedTabs(){
  const wrap = el(`<div class="ftabs"></div>`);
  [["all","הכל"],["events","🚨 אירועים"],["crowd","💬 קהל"],["report","📊 דוחות"]].forEach(pair=>{
    const k = pair[0];
    const badge = k==="events" ? `<span class="bdg ${G.unseenEvents>0?'on':''}">${G.unseenEvents}</span>` : "";
    const b = el(`<button class="ftab ${G.feedFilter===k?'on':''}" data-f="${k}">${pair[1]}${badge}</button>`);
    on(b,"click",()=>{
      G.feedFilter = k;
      if(k==="events" || k==="all") G.unseenEvents = 0;
      render();
    });
    wrap.appendChild(b);
  });
  return wrap;
}

/* ---------- the feed ---------- */
function renderFeed(){
  const feed = el(`<div class="feed" data-tour="feed" data-f="${G.feedFilter||'all'}"></div>`);
  const list = Array.isArray(G.feed) ? G.feed : [];

  if(!list.length){
    feed.appendChild(el(`<div class="feed-empty"><b>🏊 עוד לא קרה פה כלום</b>
      <span>זה הפיד של הפארק. כל מה שקורה — מבזקים, קבוצת הוואטסאפ של השכונה,
      ביקורות גוגל, לחישות של הצוות והדוח החודשי — ינחת פה.<br>
      לחצו על <b>סגור חודש</b> למטה כדי להתחיל.</span></div>`));
    return feed;
  }

  // group by turn. G.feed is newest→oldest, so months come out newest first.
  const order = [], byTurn = {};
  list.forEach(it=>{
    if(!byTurn[it.turn]){ byTurn[it.turn] = []; order.push(it.turn); }
    byTurn[it.turn].push(it);
  });

  order.forEach(turn=>{
    const items = byTurn[turn].slice().reverse();   // back to chronological
    const first = items[0];
    const sec = el(`<div class="month"></div>`);
    const rep = items.filter(i=>i.type==="report")[0];
    const sum = rep ? `<i>${(rep.payload.visitors/1000).toFixed(1)}K</i> 👥 · <i style="color:${rep.payload.profit>=0?'var(--good)':'var(--bad)'}">${fmtMoney(rep.payload.profit)}</i>` : "";
    sec.appendChild(el(`<div class="mhead"><div class="mhead-in">
      <b>📅 ${MONTHS[first.monthIdx]} · שנה ${first.year}</b><span class="sum">${sum}</span>
    </div></div>`));

    const childrenOf = {};
    items.forEach(it=>{ if(it.parentId){ (childrenOf[it.parentId] = childrenOf[it.parentId]||[]).push(it); } });

    items.forEach(it=>{
      if(it.parentId) return;                        // rendered inside its parent's thread
      const node = feedCard(it);
      if(!node) return;
      node.setAttribute("data-kind", it.kind);
      sec.appendChild(node);
      const kids = childrenOf[it.id];
      if(kids && kids.length){
        const th = el(`<div class="thread"><div class="thread-lbl">↳ מה קרה בעקבות זה</div></div>`);
        kids.forEach(k=>{
          const kn = feedCard(k);
          if(!kn) return;
          kn.setAttribute("data-kind", k.kind);
          th.appendChild(kn);
        });
        sec.appendChild(th);
      }
    });
    feed.appendChild(sec);
  });
  return feed;
}

/* Hide month headers whose entire content was filtered away. */
function applyFeedFilter(){
  const feed = document.querySelector(".feed");
  if(!feed) return;
  feed.querySelectorAll(".month").forEach(sec=>{
    const any = Array.prototype.some.call(sec.querySelectorAll("[data-kind]"),
      n => window.getComputedStyle(n).display !== "none");
    sec.classList.toggle("empty", !any);
  });
}

/* ---------- one card per feed item ---------- */
function feedCard(it){
  let node = null;
  switch(it.type){
    case "ticker":    node = cTicker(it); break;
    case "wa":        node = cWA(it); break;
    case "review":    node = cReview(it); break;
    case "staff":     node = cStaff(it); break;
    case "viral":     node = cViral(it); break;
    case "quiet":     node = cQuiet(it); break;
    case "news_bad":
    case "news_good": node = cEvent(it); break;
    case "ruti":      node = cRuti(it); break;
    case "decision":  node = cDecision(it); break;
    case "report":    node = renderReportCard(it); break;
    default:          node = null;
  }
  if(node && it.late && node.classList.contains("c")){
    node.insertBefore(el(`<div class="late">⏳ מגיב על החודש שעבר</div>`), node.firstChild);
  }
  return node;
}

function cTicker(it){ return el(`<div class="t3">${escapeHtml(it.payload.text)}</div>`); }

function cQuiet(){
  return el(`<div class="quiet"><b>🙏 חודש שקט</b>
    <span>אף אחד לא רב על כיסא, אף אחד לא נתקע במגלשה, ואף אחד לא כתב עליכם כלום.<br>
    תיהנו מזה. זה לא יימשך.</span></div>`);
}

function cEvent(it){
  const p = it.payload, good = it.type==="news_good";
  const c = el(`<div class="c t1 ${good?'good':''}">
    <div class="kicker">${good?"📰 חדשות טובות":"🚨 מבזק — קרה החודש"}</div>
    <div class="headline">${p.emoji||""} ${p.headline}</div>
    <div class="subline">${p.sub||""}</div>
  </div>`);
  if(p.chips && p.chips.length){
    c.appendChild(el(`<div class="impact">${p.chips.map(ch=>`<span class="chip ${ch[1]}">${ch[0]}</span>`).join("")}</div>`));
  }
  return c;
}

function cDecision(it){
  const p = it.payload;
  return el(`<div class="c">
    <div class="c-head"><div class="av">🗳️</div><div>
      <div class="c-who">החלטה: ${p.question}</div>
      <div class="c-meta">${MONTHS[it.monthIdx]} · שנה ${it.year}</div></div></div>
    <div class="c-body">${p.outcome}</div>
  </div>`);
}

function cWA(it){
  const p = it.payload;
  const c = el(`<div class="c wa">
    <div class="wa-bar">${p.group}<small>${p.members} משתתפים</small></div>
  </div>`);
  const bubble = (m,i)=>el(`<div class="bub ${i===0?'':'other'}">
    <span class="nm" style="color:${m.color}">${escapeHtml(m.who)}</span>${m.text}
    <div class="tm">${m.time}${i===0?" ✓✓":""}</div></div>`);
  const msgs = p.msgs||[];
  c.appendChild(bubble(msgs[0],0));
  const rest = msgs.slice(1);
  if(rest.length && !p.collapse){
    rest.forEach((m,i)=>c.appendChild(bubble(m,i+1)));
  } else if(rest.length){
    const more = el(`<button class="wa-more">💬 עוד ${rest.length} ${rest.length===1?'הודעה':'הודעות'} ↓</button>`);
    on(more,"click",()=>{
      rest.forEach((m,i)=>c.insertBefore(bubble(m,i+1), more));
      more.remove();
    });
    c.appendChild(more);
  }
  c.appendChild(el(`<div class="c-foot"><span class="react">💬 ${p.comments} תגובות</span><span class="react">👍 ${p.likes}</span></div>`));
  return c;
}

/* Answering a review is a live lever: politely costs nothing and cools רותי by 5.
   Left open forever, the player can scroll back through every unanswered review
   in the feed and drain a quarter of her heat meter in one sitting (measured:
   5 buttons, -25 heat). The conversation has a window, like a real one. */
const REVIEW_REPLY_MONTHS = 2;

function cReview(it){
  const p = it.payload;
  const c = el(`<div class="c rev">
    <div class="g-bar"><span class="g-logo"><i>G</i><i>o</i><i>o</i><i>g</i><i>l</i><i>e</i></span> ביקורת חדשה על ${escapeHtml(G.parkName)}</div>
    <div class="c-head"><div class="av">${p.avatar}</div><div>
      <div class="c-who">${escapeHtml(p.who)}</div>
      <div class="c-meta"><span class="strs" style="color:${p.stars>=4?'#f0a500':'#d9362b'}">${starStr(p.stars)}</span> · ${p.days}</div>
    </div></div>
    <div class="c-body">${p.text}</div>
  </div>`);

  if(p.ownerReply){
    c.appendChild(el(`<div class="owner-reply"><b>תגובת הבעלים · ${escapeHtml(G.parkName)}</b>${p.ownerReply}</div>`));
    return c;
  }
  if((G.turn - it.turn) > REVIEW_REPLY_MONTHS){
    c.appendChild(el(`<div class="c-foot"><span class="react">⏳ מאוחר מדי להגיב — הביקורת כבר התיישנה</span></div>`));
    return c;
  }
  const foot = el(`<div class="c-foot">
    <button class="btn-mini primary" data-a="nice">🙏 להגיב יפה</button>
    <button class="btn-mini" data-a="sass">🔥 לענות בסטייל</button></div>`);
  foot.querySelectorAll("[data-a]").forEach(b=>on(b,"click",()=>{
    if(Tour.isActive) return;
    const nice = b.dataset.a==="nice";
    p.ownerReply = nice ? OWNER_NICE : pick(OWNER_SASS);
    if(nice){
      G.satisfaction = clamp(G.satisfaction+1, 0, 100);
      rutiHeat(-5);
      toast("+1 שביעות רצון · רותי מתקררת קצת");
    } else {
      G.satisfaction = clamp(G.satisfaction-2, 0, 100);
      rutiHeat(12);
      toast("🕵️‍♀️ רותי עש שמרה צילום מסך. חום +12");
    }
    G.rating = ratingFromSatisfaction(G.satisfaction);
    render();
  }));
  c.appendChild(foot);
  return c;
}

    const c = el(`<div class="c t1" style="border-inline-start-color:var(--ruti)">

  if(p.mode==="pressure"){
    return el(`<div class="c rutic">
      <div class="ruti-bar">🕵️‍♀️ ${escapeHtml(p.group)}<small>שלב 4 — התיק פתוח</small></div>

      ${heatBar(false)}</div>`);
  }
  if(p.mode==="group"){
    return el(`<div class="c rutic">
      <div class="ruti-bar">🕵️‍♀️ ${escapeHtml(p.group)}<small>שלב 3</small></div>
      <div class="bub" style="background:#ede9fe"><span class="nm" style="color:#5b21b6">${RUTI.name} · מנהלת</span>${p.text}

      ${heatBar(false)}</div>`);

  if(p.mode==="review"){

      <div class="ruti-bar">🕵️‍♀️ ${RUTI.name} · שלב 2 — ביקורת<small>Google</small></div>

        <div class="c-who">${RUTI.name}</div>

/* ---------- the monthly report, as a card inside the feed ----------
   Same numbers, same collapsible breakdown and same satisfaction
   explanation the overlay used to show — it just lives in the feed now,
   and it is never wiped. */
function renderReportCard(it){
  const h = it.payload;
  const card = el(`<div class="c report"></div>`);
  card.appendChild(el(`<div class="rep-head">
    <b>📅 סגירת ${MONTHS[h.monthIdx]} · שנה ${h.year}</b>
    <span style="font-size:11px;opacity:.92">${escapeHtml(h.parkName||G.parkName)}</span></div>`));

  const deltaTxt = (h.visitorsDeltaPct==null) ? "" :
    `<div style="font-size:10px;font-weight:800;color:${h.visitorsDeltaPct>=0?'var(--good)':'var(--bad)'}">${h.visitorsDeltaPct>=0?'▲':'▼'} ${Math.abs(h.visitorsDeltaPct)}%</div>`;
  card.appendChild(el(`<div class="rep-kpi">
    <div><small>👥 מבקרים</small><b>${(h.visitors/1000).toFixed(1)}K</b>${deltaTxt}</div>
    <div><small>⭐ דירוג</small><b>${stars(h.rating)}</b></div>
    <div><small>💰 רווח</small><b style="color:${h.profit>=0?'var(--good)':'var(--bad)'}">${fmtMoney(h.profit)}</b></div>
  </div>`));

  // why the satisfaction score moved — the factors resolveMonth weighed
  if(h.satUp || h.satDown){
    const satDelta = (h.satBefore!=null) ? h.satisfaction-h.satBefore : null;
    const dColor = satDelta==null ? 'var(--dim)' : (satDelta>=0 ? 'var(--good)':'var(--bad)');
    const box = el(`<div class="rep-sat">
      <div class="rs-head"><span>😊 שביעות רצון</span>
        <span>${h.satBefore!=null?`${h.satBefore} → `:''}${h.satisfaction}
        ${satDelta!=null?`<span style="color:${dColor};">(${satDelta>=0?'+':''}${satDelta})</span>`:''}</span></div>
      <div class="stack gap4" style="margin-top:7px;"></div>
    </div>`);
    const rows = box.querySelector(".stack");
    (h.satUp||[]).forEach(f=>rows.appendChild(el(`<div class="sat-row"><span class="up">↑ ${f.label}</span><span class="up">+${f.v}</span></div>`)));
    (h.satDown||[]).forEach(f=>rows.appendChild(el(`<div class="sat-row"><span class="down">↓ ${f.label}</span><span class="down">${f.v}</span></div>`)));
    if(!(h.satUp||[]).length && !(h.satDown||[]).length){
      rows.appendChild(el(`<div class="muted small">חודש בלי אירועים מיוחדים.</div>`));
    }
    const more = el(`<button class="tour-more" style="margin-top:6px;">הסבר מלא ←</button>`);
    on(more,"click",()=>Tour.openGlossary("satisfaction"));
    box.appendChild(more);
    card.appendChild(box);
  }

  const toggle = el(`<button class="rep-toggle" data-tour="report-financials">💵 פירוט כספי ▼</button>`);
  const lines = el(`<div class="rep-lines"></div>`);
  const row = (label,val,color)=>el(`<div class="fr"><span>${label}</span><span${color?` style="color:${color}"`:''}>${val}</span></div>`);
  lines.appendChild(row(`🎟️ כרטיסים <span style="opacity:.7">(₪${h.ticketPrice==null?ECON.ticketDefault:h.ticketPrice})</span>`, fmtMoney(h.ticketIncome)));
  if(h.priceFactorVal!=null && h.priceFactorVal!==1){
    let label = `↳ מקדם מחיר ×${h.priceFactorVal}`, value, color;
    if(h.priceVisitorDelta){
      const up = h.priceVisitorDelta>0;
      value = `${up?'+':''}${h.priceVisitorDelta.toLocaleString('he-IL')} מבקרים`;
      color = up ? 'var(--good)' : 'var(--bad)';
    } else {
      label += ` <span style="opacity:.7">(הקיבולת חסמה ממילא)</span>`;
      value = "0 מבקרים"; color = 'var(--dim)';
    }
    lines.appendChild(row(`<span style="padding-inline-start:10px;">${label}</span>`, value, color));
  }
  lines.appendChild(row("🍔 הסעדה", fmtMoney(h.foodIncome)));
  lines.appendChild(row("💎 VIP", fmtMoney(h.vipIncome)));
  lines.appendChild(row(`🧑‍✈️ שכר עובדים <span style="opacity:.7">(${h.staffLifeguards} מצילים · ${h.staffOther} עובדים)</span>`, "-"+fmtMoney(h.payroll||0), "var(--bad)"));
  lines.appendChild(row("🔧 תחזוקה", "-"+fmtMoney(h.maintenance), "var(--bad)"));
  lines.appendChild(row("🏛️ ארנונה", "-"+fmtMoney(h.arnona||0), "var(--bad)"));
  lines.appendChild(row(`📋 ביטוח${h.insuranceLoaded?' <span style="opacity:.7">(מוטען אחרי תאונה)</span>':''}`, "-"+fmtMoney(h.insurance||0), "var(--bad)"));
  lines.appendChild(row("🗄️ מנהלה ורישוי", "-"+fmtMoney(h.admin||0), "var(--bad)"));
  lines.appendChild(row("🛡️ אבטחה", "-"+fmtMoney(h.securityMonthly), "var(--bad)"));
  const tot = row("רווח נקי", fmtMoney(h.profit), h.profit>=0?'var(--good)':'var(--bad)');
  tot.classList.add("tot");
  lines.appendChild(tot);
  if(h.turnedAway>0){
    const away = row("🚧 נשלחו הביתה (אין מקום)", h.turnedAway.toLocaleString('he-IL'), "var(--warn)");
    away.style.borderTop = "1px dashed var(--border)";
    away.style.marginTop = "5px"; away.style.paddingTop = "6px";
    lines.appendChild(away);
  }
  if(!G.quickUI) lines.classList.add("open");
  toggle.textContent = lines.classList.contains("open") ? "💵 פירוט כספי ▲" : "💵 פירוט כספי ▼";
  on(toggle,"click",()=>{
    lines.classList.toggle("open");
    toggle.textContent = lines.classList.contains("open") ? "💵 פירוט כספי ▲" : "💵 פירוט כספי ▼";
  });
  card.appendChild(toggle);
  card.appendChild(lines);

  Tour.trigger("FIRST_MONTHLY_REPORT");
  return card;
}
